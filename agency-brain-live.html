<title>Agency Brain</title>
<style>
  :root {
    --ceo:#8fe6ff; --lead:#6fe3c0; --sales:#aeb4ff; --store:#f2cd94;
    --ink:#e7f0fa; --dim:#7f93b0; --faint:#586a85;
    --panel:rgba(10,16,26,.72); --edge:rgba(90,150,210,.20);
  }
  html,body{margin:0;height:100%;background:#04060c;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);}
  #stage{position:fixed;inset:0;} canvas{display:block;width:100%;height:100%;cursor:crosshair;}

  .hud{position:fixed;left:0;top:0;padding:20px 22px;pointer-events:none;z-index:5;}
  .hud .brand{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10.5px;letter-spacing:.36em;text-transform:uppercase;color:var(--ceo);opacity:.8;}
  .hud h1{margin:5px 0 0;font-size:20px;font-weight:500;letter-spacing:.02em;color:var(--ink);}
  .hud .hint{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.03em;color:var(--faint);margin-top:6px;}

  .stats{position:fixed;right:20px;top:20px;z-index:5;display:flex;gap:1px;pointer-events:none;
    border:1px solid var(--edge);border-radius:12px;overflow:hidden;background:var(--edge);}
  .stat{background:rgba(8,13,22,.82);backdrop-filter:blur(10px);padding:9px 15px;text-align:right;min-width:70px;}
  .stat .v{font-family:ui-monospace,monospace;font-size:18px;font-weight:600;letter-spacing:.01em;line-height:1.1;}
  .stat .k{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:4px;}
  .stat.mrr .v{color:var(--ceo);} .stat.leads .v{color:var(--lead);} .stat.dials .v{color:var(--store);}
  .stat .v small{color:var(--faint);font-size:11px;}

  .console{position:fixed;left:20px;bottom:20px;width:min(330px,calc(100% - 40px));z-index:5;
    background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--edge);
    border-radius:14px;padding:14px 16px 15px;pointer-events:none;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;box-shadow:0 0 50px rgba(0,0,0,.55);
    transition:opacity .35s,transform .35s;opacity:0;transform:translateY(8px);}
  .console.on{opacity:1;transform:translateY(0);}
  .console .c-top{display:flex;align-items:center;gap:10px;}
  .console .c-dot{width:8px;height:8px;border-radius:99px;box-shadow:0 0 12px currentColor;}
  .console .c-name{font-size:14px;font-weight:600;font-family:system-ui,sans-serif;letter-spacing:.02em;color:var(--ink);}
  .console .c-tag{margin-left:auto;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);}
  .console .c-log{margin:11px 0 12px;font-size:11.5px;line-height:1.75;min-height:88px;white-space:pre-wrap;color:var(--dim);}
  .console .c-log b{font-weight:400;color:currentColor;}
  .console .cur::after{content:"▍";animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .console .open-btn{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink);background:transparent;border:1px solid currentColor;border-radius:8px;padding:8px 13px;transition:.2s;}
  .console .open-btn:hover{background:rgba(255,255,255,.06);}

  .scrim{position:fixed;inset:0;background:rgba(2,4,9,.62);backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s;}
  .scrim.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(500px,100%);z-index:50;background:#070b12;
    border-left:1px solid var(--edge);transform:translateX(100%);transition:transform .34s cubic-bezier(.2,.9,.2,1);
    overflow-y:auto;box-shadow:-24px 0 70px rgba(0,0,0,.55);}
  .drawer.open{transform:translateX(0);}
  .drawer .d-head{position:sticky;top:0;background:linear-gradient(#070b12,rgba(7,11,18,.86));backdrop-filter:blur(8px);
    padding:24px 26px 17px;border-bottom:1px solid var(--edge);}
  .drawer .d-role{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;}
  .drawer h2{margin:6px 0 0;font-size:23px;font-weight:500;letter-spacing:.01em;color:var(--ink);}
  .drawer .d-sub{color:var(--dim);font-size:12.5px;margin-top:7px;line-height:1.55;}
  .drawer .d-close{position:absolute;top:20px;right:20px;background:none;border:none;color:var(--faint);font-size:24px;line-height:1;cursor:pointer;}
  .drawer .d-close:hover{color:var(--ink);}
  .drawer .d-body{padding:22px 26px 64px;}
  .sec{margin-top:24px;} .sec:first-child{margin-top:2px;}
  .sec .s-lbl{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:10px;}
  .card2{background:#0b1119;border:1px solid var(--edge);border-radius:12px;padding:13px 15px;margin-bottom:9px;}
  .card2 .t{font-size:13.5px;font-weight:600;color:var(--ink);}
  .card2 .d{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.5;}
  .card2 .ph{font-family:ui-monospace,monospace;font-size:13px;color:var(--lead);margin-top:5px;letter-spacing:.02em;}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .kpi{background:#0b1119;border:1px solid var(--edge);border-radius:12px;padding:13px;text-align:center;}
  .kpi .n{font-family:ui-monospace,monospace;font-size:21px;font-weight:600;letter-spacing:.01em;}
  .kpi .l{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:5px;}
  .funnel{display:flex;flex-direction:column;gap:6px;}
  .fr{display:flex;align-items:center;gap:11px;font-size:12px;}
  .fr .fb{flex:1;height:20px;border-radius:5px;background:#0b1119;border:1px solid var(--edge);position:relative;overflow:hidden;}
  .fr .fb>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(143,230,255,.35),rgba(143,230,255,.1));}
  .fr .fn{font-family:ui-monospace,monospace;width:64px;color:var(--dim);}
  .fr .fv{font-family:ui-monospace,monospace;width:20px;text-align:right;color:var(--ink);font-weight:600;}
  .quote{border-left:2px solid;padding:6px 0 6px 14px;margin:9px 0;font-size:12.5px;line-height:1.6;color:#d3e3f4;}
  .filerow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid rgba(90,150,210,.1);}
  .filerow:last-child{border-bottom:none;}
  .filerow .fname{font-family:ui-monospace,monospace;font-size:12px;color:var(--ink);}
  .filerow .fmeta{font-size:10.5px;color:var(--faint);margin-top:2px;}
  .badge{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap;}
  .badge.full{background:rgba(111,227,192,.14);color:var(--lead);} .badge.empty{background:rgba(88,106,133,.18);color:var(--dim);} .badge.warn{background:rgba(242,205,148,.14);color:var(--store);}
  .next{background:linear-gradient(135deg,rgba(143,230,255,.08),#0b1119);border:1px solid rgba(143,230,255,.28);border-radius:12px;padding:16px;}
  .next .nl{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ceo);}
  .next .nt{font-size:14.5px;color:var(--ink);margin-top:7px;line-height:1.5;font-weight:600;}
  .next .nd{font-size:11.5px;color:var(--dim);margin-top:7px;}
  a.link{color:var(--ceo);font-size:12px;text-decoration:none;border-bottom:1px solid rgba(143,230,255,.3);}
  @media(max-width:620px){.stats{right:12px;top:12px;} .stat{min-width:56px;padding:8px 11px;} .stat .v{font-size:15px;}
    .drawer{width:100%;} .console{bottom:12px;left:12px;} .hud .hint{display:none;}}
</style>

<div id="stage"><canvas id="c"></canvas></div>

<div class="hud">
  <div class="brand">AI Automation Agency</div>
  <h1>Agency Brain</h1>
  <div class="hint">Move over a node to light it · click to open its work · click the core to dispatch</div>
</div>

<div class="stats">
  <div class="stat mrr"><div class="v">$0<small>/10k</small></div><div class="k">MRR</div></div>
  <div class="stat leads"><div class="v">25</div><div class="k">Leads</div></div>
  <div class="stat dials"><div class="v">0<small>/10</small></div><div class="k">Dials</div></div>
</div>

<div class="console" id="console">
  <div class="c-top"><span class="c-dot" id="cdot"></span><span class="c-name" id="cname"></span><span class="c-tag">process</span></div>
  <div class="c-log" id="clog"></div>
  <button class="open-btn" id="openBtn">Open full work →</button>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="d-head"><button class="d-close" id="dclose" aria-label="Close">×</button>
    <div class="d-role" id="drole"></div><h2 id="dname"></h2><div class="d-sub" id="dsub"></div></div>
  <div class="d-body" id="dbody"></div>
</aside>

<script>
const canvas=document.getElementById("c"), ctx=canvas.getContext("2d"), stage=document.getElementById("stage");
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener("resize",resize);resize();

const C={ceo:"#8fe6ff",lead:"#6fe3c0",sales:"#aeb4ff",store:"#f2cd94"};
const NODES=[
 {id:"ceo",nx:.5,ny:.40,r:40,color:C.ceo,role:"You · Founder-Operator",name:"CEO Core",
  think:["reading pipeline.md","MRR $0 / $10k","constraint = 0 dials","10 leads queued → 2026-08-01","holding: no new agents till 5 clients"]},
 {id:"lead",nx:.24,ny:.62,r:28,color:C.lead,role:"Subagent",name:"Lead Research",
  think:["query restoration · STL radius","filter ✕ franchises","verify (314) 291-8888","rank by missed-call pain","wrote leads/2026-07-31.md"]},
 {id:"sales",nx:.76,ny:.62,r:28,color:C.sales,role:"Subagent",name:"Sales Assistant",
  think:["read business-context","draft opener · 'your 2am calls'","personalize ×10 leads","CTA → call the demo #","wrote 2 assets"]},
 {id:"store",nx:.5,ny:.72,r:28,color:C.store,role:"Source of Truth",name:"The Store",
  think:["business-context ✎","pipeline · 10 queued","decisions · 4 logged","metrics · 1 row","objections · empty"]},
];
const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));
NODES.forEach((n,i)=>{n.phase=i*1.9;n.px=0;n.py=0;n.pulse=0;n.hov=0;n.depth=n.r/40;});
const EDGES=[["ceo","lead"],["ceo","sales"],["ceo","store"],["lead","store"],["sales","store"],["lead","sales"]].map(([a,b])=>({a,b}));
const packets=[];EDGES.forEach((e,ei)=>{for(let k=0;k<3;k++)packets.push({ei,t:k/3,sp:.11+Math.random()*.07});});
const bursts=[];
const motes=[];for(let i=0;i<60;i++)motes.push({x:Math.random(),y:Math.random(),z:Math.random()*.7+.3,v:Math.random()*.015+.004,a:Math.random()*.35+.08});

const mouse={x:-999,y:-999,ex:-999,ey:-999,in:false};
canvas.addEventListener("pointermove",e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;mouse.in=true;});
canvas.addEventListener("pointerleave",()=>{mouse.in=false;});

function hex(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function glow(x,y,r,c,a){const[R,G,B]=hex(c);const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(${R},${G},${B},${.85*a})`);g.addColorStop(.45,`rgba(${R},${G},${B},${.22*a})`);g.addColorStop(1,`rgba(${R},${G},${B},0)`);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const l=dx*dx+dy*dy||1;
  let t=((px-ax)*dx+(py-ay)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(ax+dx*t),py-(ay+dy*t));}

let selected=null,tPrev=0,parX=0,parY=0;
function frame(t){
  const dt=Math.min((t-tPrev)/1000||0,.05);tPrev=t;
  // ease mouse + parallax
  if(mouse.in){mouse.ex+=(mouse.x-mouse.ex)*.18;mouse.ey+=(mouse.y-mouse.ey)*.18;}
  const tgX=mouse.in?(mouse.ex-W/2):0, tgY=mouse.in?(mouse.ey-H/2):0;
  parX+=(tgX-parX)*.06;parY+=(tgY-parY)*.06;
  NODES.forEach(n=>{const off=(n.depth-1);n.px=n.nx*W+parX*.03*n.depth;n.py=n.ny*H+parY*.03*n.depth;});

  // ground
  const bg=ctx.createRadialGradient(W*.5,H*.42,0,W*.5,H*.42,Math.max(W,H)*.85);
  bg.addColorStop(0,"#0a1220");bg.addColorStop(1,"#04060c");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // faint guide ring
  ctx.strokeStyle="rgba(90,150,210,.06)";ctx.lineWidth=1;ctx.beginPath();
  ctx.arc(byId.ceo.px,byId.ceo.py,Math.min(W,H)*.34,0,7);ctx.stroke();

  ctx.save();ctx.globalCompositeOperation="lighter";
  motes.forEach(m=>{m.y-=m.v*dt*8;if(m.y<-.02){m.y=1.02;m.x=Math.random();}
    ctx.globalAlpha=m.a*m.z;ctx.fillStyle="#bfe6ff";ctx.beginPath();ctx.arc(m.x*W+parX*.06*m.z,m.y*H,m.z*1.3,0,7);ctx.fill();});
  ctx.restore();

  ctx.globalCompositeOperation="lighter";

  // edges — brighten near cursor & near hovered/selected nodes
  EDGES.forEach(e=>{const A=byId[e.a],B=byId[e.b];
    let near=0;
    if(mouse.in){const d=distSeg(mouse.ex,mouse.ey,A.px,A.py,B.px,B.py);near=Math.max(0,1-d/150);}
    const act=Math.max(A.hov,B.hov,selected===A.id||selected===B.id?.7:0);
    const a=.06+near*.5+act*.4;
    const g=ctx.createLinearGradient(A.px,A.py,B.px,B.py);
    const[ar,ag,ab]=hex(A.color),[br,bg2,bb]=hex(B.color);
    g.addColorStop(0,`rgba(${ar},${ag},${ab},${a})`);g.addColorStop(1,`rgba(${br},${bg2},${bb},${a})`);
    ctx.strokeStyle=g;ctx.lineWidth=1+near*1.2+act;ctx.beginPath();ctx.moveTo(A.px,A.py);ctx.lineTo(B.px,B.py);ctx.stroke();});

  // packets
  if(!reduce)packets.forEach(p=>{const e=EDGES[p.ei],A=byId[e.a],B=byId[e.b];p.t+=p.sp*dt;if(p.t>1)p.t-=1;
    const x=A.px+(B.px-A.px)*p.t,y=A.py+(B.py-A.py)*p.t;glow(x,y,5,B.color,.85);
    ctx.fillStyle="rgba(255,255,255,.9)";ctx.beginPath();ctx.arc(x,y,1.3,0,7);ctx.fill();});

  // bursts
  for(let i=bursts.length-1;i>=0;i--){const b=bursts[i],e=EDGES[b.ei],A=byId[e.a],B=byId[e.b];
    b.t+=1.2*dt;const x=A.px+(B.px-A.px)*b.t,y=A.py+(B.py-A.py)*b.t;glow(x,y,12*(1-b.t*.4),"#e9fbff",.9);
    if(b.t>=1){byId[e.b].pulse=1;bursts.splice(i,1);}}

  // nodes
  NODES.forEach(n=>{
    const hd=mouse.in?Math.hypot(mouse.ex-n.px,mouse.ey-n.py):999;
    const target=(hd<n.r+34)?1:0; n.hov+=(target-n.hov)*.18;
    n.pulse=Math.max(0,n.pulse-dt*1.5);
    const breathe=reduce?0:Math.sin(t/1100+n.phase)*.04;
    const sel=selected===n.id?1:0;
    const bright=(selected?(sel?1:.35):.62)+n.hov*.5+n.pulse*.5;
    const rr=n.r*(1+breathe+n.hov*.1+n.pulse*.3);

    glow(n.px,n.py,rr*2.4,n.color,(.28+n.hov*.5+n.pulse*.4)*(selected&&!sel?.4:1));

    ctx.globalCompositeOperation="source-over";
    // core fill
    ctx.beginPath();ctx.arc(n.px,n.py,rr,0,7);ctx.fillStyle="rgba(6,11,20,.9)";ctx.fill();
    // hairline inner ring
    ctx.globalAlpha=(.25+n.hov*.5);ctx.strokeStyle=n.color;ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(n.px,n.py,rr*.6,0,7);ctx.stroke();ctx.globalAlpha=1;
    // main ring
    const[R,G,B]=hex(n.color);ctx.strokeStyle=`rgba(${R},${G},${B},${Math.min(1,.5+bright*.5)})`;
    ctx.lineWidth=sel?2.2:1.5;ctx.beginPath();ctx.arc(n.px,n.py,rr,0,7);ctx.stroke();

    // hover crosshair ticks
    if(n.hov>.02){ctx.strokeStyle=`rgba(${R},${G},${B},${n.hov*.8})`;ctx.lineWidth=1.2;
      for(let a=0;a<4;a++){const ang=a*Math.PI/2+t/2600;const r1=rr+5,r2=rr+5+6*n.hov;
        ctx.beginPath();ctx.moveTo(n.px+Math.cos(ang)*r1,n.py+Math.sin(ang)*r1);
        ctx.lineTo(n.px+Math.cos(ang)*r2,n.py+Math.sin(ang)*r2);ctx.stroke();}}

    ctx.globalCompositeOperation="lighter";
    glow(n.px,n.py,rr*.5,n.color,.5+bright*.5);
    ctx.fillStyle="rgba(255,255,255,.92)";ctx.beginPath();ctx.arc(n.px,n.py,2,0,7);ctx.fill();

    // label
    ctx.globalCompositeOperation="source-over";
    ctx.font="600 11px ui-monospace, monospace";ctx.textAlign="center";ctx.textBaseline="top";
    const la=Math.min(1,.4+n.hov+sel);ctx.fillStyle=`rgba(${R},${G},${B},${la})`;
    ctx.save();ctx.letterSpacing?ctx.letterSpacing="1.5px":0;
    ctx.fillText(n.name.toUpperCase(),n.px,n.py+rr+10);ctx.restore();
  });
  ctx.globalCompositeOperation="lighter";

  // cursor light
  if(mouse.in){glow(mouse.ex,mouse.ey,90,"#9fdcff",.10);}

  ctx.globalCompositeOperation="source-over";
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// interaction
function pick(mx,my){let hit=null,best=1e9;NODES.forEach(n=>{const d=Math.hypot(mx-n.px,my-n.py);if(d<n.r+18&&d<best){best=d;hit=n;}});return hit;}
canvas.addEventListener("pointerdown",e=>{const r=canvas.getBoundingClientRect();const n=pick(e.clientX-r.left,e.clientY-r.top);
  if(!n){selected=null;consoleEl.classList.remove("on");return;}
  if(n.id==="ceo"){n.pulse=1;EDGES.forEach((e2,ei)=>{if(e2.a==="ceo")bursts.push({ei,t:0});});}
  select(n);});

const consoleEl=document.getElementById("console"),cdot=document.getElementById("cdot"),
  cname=document.getElementById("cname"),clog=document.getElementById("clog"),openBtn=document.getElementById("openBtn");
let typer=null,current=null;
function select(n){current=n.id;selected=n.id;consoleEl.classList.add("on");
  cdot.style.color=n.color;cdot.style.background=n.color;cname.textContent=n.name;clog.style.color=n.color;
  openBtn.style.color=n.color;startType(n.think);}
function startType(lines){if(typer)clearInterval(typer);let li=0,ci=0;const shown=[];clog.innerHTML="";
  if(reduce){clog.innerHTML=lines.map(l=>"› "+l).join("\n");return;}
  typer=setInterval(()=>{const cur=lines[li].slice(0,ci);
    clog.innerHTML=shown.map(s=>"› "+s).join("\n")+(shown.length?"\n":"")+'<span class="cur">› '+cur+"</span>";ci++;
    if(ci>lines[li].length){shown.push(lines[li]);if(shown.length>3)shown.shift();li=(li+1)%lines.length;ci=0;}},46);}
openBtn.addEventListener("click",()=>{if(current)openDrawer(current);});

// REAL WORK
const WORK={
 ceo:{color:C.ceo,role:"You · Founder-Operator",sub:"Owns the number. Routes work, sets strategy, never does the agents' jobs.",html:`
  <div class="sec"><div class="kpis">
    <div class="kpi"><div class="n" style="color:var(--ceo)">$0</div><div class="l">MRR / $10k</div></div>
    <div class="kpi"><div class="n" style="color:var(--lead)">25</div><div class="l">Leads ready</div></div>
    <div class="kpi"><div class="n" style="color:var(--store)">0</div><div class="l">Clients</div></div></div></div>
  <div class="sec"><div class="s-lbl">This week's funnel</div><div class="funnel">
    <div class="fr"><span class="fn">Outreach</span><span class="fb"><i style="width:0"></i></span><span class="fv">0</span></div>
    <div class="fr"><span class="fn">Replies</span><span class="fb"><i style="width:0"></i></span><span class="fv">0</span></div>
    <div class="fr"><span class="fn">Meetings</span><span class="fb"><i style="width:0"></i></span><span class="fv">0</span></div>
    <div class="fr"><span class="fn">Calls</span><span class="fb"><i style="width:0"></i></span><span class="fv">0</span></div>
    <div class="fr"><span class="fn">Closes</span><span class="fb"><i style="width:0"></i></span><span class="fv">0</span></div></div></div>
  <div class="sec"><div class="s-lbl">Binding constraint</div>
    <div class="card2"><div class="t" style="color:var(--sales)">Zero dials.</div>

const scrim=document.getElementById("scrim"),drawer=document.getElementById("drawer"),
  drole=document.getElementById("drole"),dname=document.getElementById("dname"),dsub=document.getElementById("dsub"),dbody=document.getElementById("dbody");
function openDrawer(id){const w=WORK[id],n=byId[id];if(!w)return;drole.textContent=w.role;drole.style.color=w.color;
  dname.textContent=n.name;dsub.textContent=w.sub;dbody.innerHTML=w.html;drawer.scrollTop=0;scrim.classList.add("open");drawer.classList.add("open");}
function closeDrawer(){scrim.classList.remove("open");drawer.classList.remove("open");}
document.getElementById("dclose").addEventListener("click",closeDrawer);
scrim.addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});

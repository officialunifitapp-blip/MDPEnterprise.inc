    for(let i=0;i<s.pts.length;i++){let[x,y,z]=s.pts[i];let x1=x*cosR-z*sinR,z1=x*sinR+z*cosR;let y1=y*cosT-z1*sinT,z2=y*sinT+z1*cosT;const persp=1/(1-z2*.34);const sx=cx+x1*R*persp,sy=cy+y1*R*persp;const depth=(z2+1)/2;const size=(0.6+depth*1.9)*(R0/60)*(s.active?1:.8);ctx.fillStyle=`rgba(${Rc},${Gc},${Bc},${(0.16+depth*0.95)*bright})`;ctx.fillRect(sx-size/2,sy-size/2,size,size);}
    if(s.core){const r2=s.rot*-1.3,cR=Math.cos(r2),sR=Math.sin(r2);for(let i=0;i<s.pts.length;i+=2){let[x,y,z]=s.pts[i];let x1=x*cR-z*sR,z1=x*sR+z*cR;let y1=y*cosT-z1*sinT,z2=y*sinT+z1*cosT;const persp=1/(1-z2*.34);const sx=cx+x1*R*.62*persp,sy=cy+y1*R*.62*persp;const depth=(z2+1)/2;ctx.fillStyle=`rgba(215,245,255,${(0.1+depth*.5)*bright})`;ctx.fillRect(sx-1,sy-1,1.8,1.8);}}
    if(s.id===focusId&&fp>.2){for(let k=0;k<8;k++){const a=t/1500+k*Math.PI/4,rr=R*1.55,sx2=cx+Math.cos(a)*rr,sy2=cy+Math.sin(a)*rr*.5;ctx.fillStyle="rgba("+Rc+","+Gc+","+Bc+","+(.7*fp)+")";ctx.beginPath();ctx.arc(sx2,sy2,2.4,0,7);ctx.fill();}}
  });
  ctx.globalCompositeOperation="source-over";requestAnimationFrame(frame);
}

SPH.forEach(s=>{const d=document.createElement("div");d.className="lbl"+(s.active?"":" soon");d.innerHTML=`<div class="nm" style="color:${s.col}">${s.name}</div><div class="one">${s.one}</div><div class="chip" style="color:${s.col}">${s.chip}</div>`;d.addEventListener("click",()=>{s.pulse=1;openModal(s.id);});labels.appendChild(d);s.el=d;});

 notes:()=>{const ks=Object.keys(NOTES).filter(k=>NOTES[k]);return `<div class="sec"><div class="s-lbl">Call notes <span>${ks.length} logged</span></div>${ks.length?ks.map(k=>`<div class="note-item"><div class="nc">${k}</div><div class="nt">${(NOTES[k]||"").replace(/</g,"&lt;")}</div></div>`).join(""):'<div class="say">No notes yet. Open <b>Leads</b>, tap 📝 on any company, and jot what happened on the call. It saves on your device and shows up here.</div>'}</div><div class="sec"><button class="btn" id="notesCsv">⬇ Export notes + leads CSV</button></div>`;},
 sales:()=>`<div class="sec"><div class="s-lbl">When they push back, say this</div>${PUSH.map(c=>`<div class="push"><div class="q">${c[0]}</div><div class="a">${c[1]}</div></div>`).join("")}</div>
  <div class="sec"><div class="s-lbl">What to open with</div>${OPENERS.map(o=>`<div class="script"><div class="sh"><div><div class="sw">${o[1]} · ${o[2]}</div><div class="sc">${tel(o[3])}</div></div><a class="tel" href="tel:+1${o[3]}">Call</a></div>${o[4]?`<div class="flag">⚠ ${o[4]}</div>`:""}<div class="op">“${o[5]}”</div><div class="vm"><b>if voicemail</b>${o[6]}</div></div>`).join("")}</div>`,
 store:()=>`<div class="sec"><div class="s-lbl">Everything the team remembers</div>
   <div class="fr"><div><div class="fl">Your offer & pricing</div><div class="fm">$500/mo, setup waived for first 3</div></div><span class="badge on">Set</span></div>
   <div class="fr"><div><div class="fl">Decisions made</div><div class="fm">pivot, pricing, phone-first</div></div><span class="badge on">Saved</span></div>
   <div class="fr"><div><div class="fl">Your leads</div><div class="fm">${DATA.pipeline.new||0} waiting</div></div><span class="badge warn">${DATA.pipeline.new||0}</span></div>
   <div class="fr"><div><div class="fl">Call notes</div><div class="fm">${Object.keys(NOTES).length} logged on this device</div></div><span class="badge ${Object.keys(NOTES).length?'on':'empty'}">${Object.keys(NOTES).length||'—'}</span></div></div>`,
 engine:()=>`<div class="sec"><div class="s-lbl">Your 5am robot</div><div class="say">Every morning at <b>5:00am</b> it finds ~150 new companies, checks the numbers, writes what to say, and adds them to your list — while you sleep.</div></div>
  <div class="sec"><div class="s-lbl">Latest run</div><div class="say">Grew your list to <b>${DATA.kpis.leads} leads</b>. <a class="link" href="https://claude.ai/code/routines/trig_018YYUgA7ZBB2uueWFLEQRgg" target="_blank" rel="noopener">See its runs →</a></div></div>`,
 voice:()=>`<div class="sec"><div class="s-lbl">Coming soon</div><div class="say"><b>An AI that makes the calls for you</b> — same tech as your demo, pointed at the lead list.</div></div>`,
 appt:()=>`<div class="sec"><div class="s-lbl">Coming soon</div><div class="say"><b>Books appointments into your calendar</b> when a lead replies.</div></div>`,
 tiktok:()=>`<div class="sec"><div class="s-lbl">Building tomorrow</div><div class="say"><b>Makes a faceless AI story video every day</b> to post on TikTok for views. Needs a video + posting tool (~$50–150/mo).</div></div>`,
 clone:()=>`<div class="sec"><div class="s-lbl">Coming soon</div><div class="say"><b>An AI version of your voice and face</b> for content videos.</div></div>`,

 adstudio:()=>`<div class="sec"><div class="s-lbl">Just an idea</div><div class="say"><b>Makes the photos, video, and copy</b> for the store's ads.</div></div>`,

const SUB={core:"The brain. All your key info and what to do next.",lead:"Companies to call, hottest first. Tap 📝 to log a call.",sales:"What to say — and what to say back when they push.",notes:"Your call log — what's happening with each lead.",store:"Everything the team knows about your business.",engine:"Finds 150 new leads every morning while you sleep.",voice:"An AI that makes calls for you.",appt:"Books your appointments.",tiktok:"Daily AI videos for views.",clone:"An AI you for content.",ecomstore:"An online store for profit.",adstudio:"Makes the store's ads.",life:"Runs your personal life admin.",money:"Watches your finances."};
const scrim=document.getElementById("scrim"),modal=document.getElementById("modal"),mey=document.getElementById("mey"),mname=document.getElementById("mname"),msub=document.getElementById("msub"),mbody=document.getElementById("mbody"),morb=document.getElementById("morb");
function openModal(id){const s=byId[id];focusId=id;open=true;mey.textContent=s.active?"Working now":(s.stage==="idea"?"Just an idea":"Coming soon");mey.style.color=s.col;mname.textContent=s.name;msub.textContent=SUB[id]||"";
  morb.textContent=s.ico;morb.style.background=`rgba(${hx(s.col).join(",")},.14)`;morb.style.color=s.col;
  mbody.innerHTML=WORK[id]();modal.scrollTop=0;scrim.classList.add("open");modal.classList.add("open");wireModal();}
function closeModal(){open=false;scrim.classList.remove("open");modal.classList.remove("open");}
function wireModal(){
  mbody.querySelectorAll(".ntbtn").forEach(b=>b.addEventListener("click",()=>{const ta=mbody.querySelector(`textarea[data-co="${b.dataset.co}"]`);if(ta){ta.classList.toggle("hide");if(!ta.classList.contains("hide"))ta.focus();}}));
  mbody.querySelectorAll("textarea[data-co]").forEach(ta=>ta.addEventListener("input",()=>{saveNote(ta.dataset.co,ta.value);const b=mbody.querySelector(`.ntbtn[data-co="${ta.dataset.co}"]`);if(b)b.classList.toggle("has",!!ta.value.trim());}));
  const nc=document.getElementById("notesCsv");if(nc)nc.addEventListener("click",exportCSV);
}
document.getElementById("mx").addEventListener("click",closeModal);scrim.addEventListener("click",closeModal);
addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

// ===== CSV EXPORT =====
function exportCSV(){
  const rows=[["Company","Contact / Owner","Phone","Note"]];
  DATA.leadList.forEach(l=>rows.push([l.co,(l.c||"").replace(/·/g," - "),l.p||"",NOTES[l.co]||""]));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="mdp-leads.csv";a.click();URL.revokeObjectURL(url);
}
document.getElementById("exportBtn").addEventListener("click",exportCSV);

const log=document.getElementById("log"),cinp=document.getElementById("cinp");
function add(cls,html){const m=document.createElement("div");m.className="msg "+cls;m.innerHTML=html;log.appendChild(m);log.scrollTop=log.scrollHeight;}
function reply(q){const s=q.toLowerCase();const ph=DATA.leadList.filter(l=>l.p).length;
  if(/hi|hey|hello|yo|sup/.test(s)&&s.length<12)return "<b>Command:</b> Hey. Ask me about leads, what to say, what's next, notes, or the 5am engine.";
  if(/how many|lead|compan|call list/.test(s))return `<b>Leads:</b> <b>${DATA.kpis.leads}</b> companies in the pipeline, <b>${ph}</b> with a phone ready to dial. Hottest: ${DATA.leadList.slice(0,3).map(l=>l.co).join(", ")}. Tap the Leads ball for the list, or Export CSV top-right.`;
  if(/csv|export|dialer|download/.test(s))return "<b>Command:</b> Hit <b>Export leads CSV</b> top-right — it downloads every company, phone, and your notes, ready for the auto-dialer.";
  if(/note|log|track/.test(s))return "<b>Notes:</b> Open Leads, tap 📝 on any company, and write what happened. It saves on your device and shows in the Notes ball — and it's included in the CSV export.";
  if(/next|what.*do|priority|today/.test(s))return "<b>Command:</b> First — <b>verify your Vapi demo line</b> works for a stranger. Then call the green leads and log each in Notes.";
  if(/say|script|opener|pitch|objection|push/.test(s))return "<b>Scripts:</b> Open with — “Not a pitch, quick: when a water call hits at 2am and drops to voicemail, that job's gone. I built a line that answers those. Call it, 90 seconds.” Tap Scripts for the push-back answers.";
  if(/money|revenue|mrr|close|client/.test(s))return `<b>Command:</b> Revenue <b>${DATA.kpis.mrr}</b> toward $10k, <b>${DATA.kpis.clients}</b> clients. Waive setup for the first 3, get them live in a week, make them case studies.`;
  if(/engine|5am|auto|source|find more/.test(s))return "<b>Auto-Leads:</b> I run at 5am and add ~150 phone-checked companies. Last run grew you to "+DATA.kpis.leads+". Ask your operator to trigger me early anytime.";
  if(/tiktok|video|content|clone/.test(s))return "<b>Content:</b> TikTok's next — daily AI story videos you post yourself. Needs a video + posting tool.";
  return "<b>Command:</b> I can talk leads, scripts, notes, CSV, next steps, revenue, or the engine. Try the buttons — or have your operator wire me to full AI for open chat.";}
function send(q){if(!q.trim())return;add("me",q);cinp.value="";setTimeout(()=>add("ai",reply(q)),360);}
document.getElementById("csend").addEventListener("click",()=>send(cinp.value));
cinp.addEventListener("keydown",e=>{if(e.key==="Enter")send(cinp.value);});
const chips=document.getElementById("chips");["How many leads?","What do I say?","How do notes work?","What's next?"].forEach(c=>{const b=document.createElement("button");b.textContent=c;b.onclick=()=>send(c);chips.appendChild(b);});
document.getElementById("chatHead").addEventListener("click",()=>{const c=document.getElementById("chat");c.classList.toggle("min");document.getElementById("chatToggle").textContent=c.classList.contains("min")?"▴":"▾";});

const last={};
function flash(id){const el=document.getElementById(id);el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}
function renderKpis(){const set=(id,html,key)=>{const el=document.getElementById(id);el.innerHTML=html;if(last[key]!==undefined&&last[key]!==html)flash(id);last[key]=html;};
  set("k-mrr",DATA.kpis.mrr+'<small>/10k</small>',"m");set("k-leads",String(DATA.kpis.leads),"l");set("k-dials",DATA.kpis.dials.split("/")[0]+'<small>/'+DATA.kpis.dials.split("/")[1]+'</small>',"d");set("k-clients",String(DATA.kpis.clients),"c");
  if(byId.lead.el)byId.lead.el.querySelector(".chip").textContent=DATA.kpis.leads;}
async function hydrate(){try{const pipe=await fetch("pipeline.md",{cache:"no-store"});if(!pipe.ok)throw 0;const txt=await pipe.text();
  const counts={};STAGES.forEach(s=>counts[s[0]]=0);const list=[];let won=false;
  txt.split("\n").forEach(line=>{if(/^##\s*Won/i.test(line))won=true;if(won||!line.startsWith("| "))return;const c=line.split("|").map(x=>x.trim());if(c.length<4||c[1]===""||c[1]==="Company")return;const st=c[3].toLowerCase();if(!STAGES.some(s=>s[0]===st))return;counts[st]++;if(st==="new"){const m=(c[2]||"").match(/\(?\d{3}\)?[ .-]?\d{3}[ .-]?\d{4}/);list.push({co:c[1],c:c[2],p:m?m[0]:""});}});
  if(list.length){DATA.pipeline=counts;DATA.kpis.leads=Object.values(counts).reduce((a,b)=>a+b,0);DATA.leadList=list;}
  const met=await fetch("metrics.md",{cache:"no-store"});if(met.ok){const rows=(await met.text()).split("\n").filter(l=>l.startsWith("|")&&!/Week of|:---/.test(l));const lr=rows[rows.length-1];if(lr){const c=lr.split("|").map(x=>x.trim());if(c.length>=9)DATA.kpis.mrr=c[7]||DATA.kpis.mrr;}}
  document.getElementById("liveTxt").innerHTML='LIVE · <b>'+DATA.kpis.leads+' leads</b> in your files';renderKpis();
}catch(e){document.getElementById("liveTxt").innerHTML='<b>'+DATA.kpis.leads+' leads</b> · snapshot';renderKpis();}}
document.getElementById("resetView").addEventListener("click",()=>{pan.x=0;pan.y=0;zoom=1;});
setTimeout(()=>{const h=document.getElementById("hint");if(h)h.style.opacity="0";},6500);
resize();renderKpis();requestAnimationFrame(frame);hydrate();setInterval(hydrate,5000);

ve dispatch 24/7 — real person at 2am, or does it roll to a service? I built a line that answers after-hours water calls and books them, often cheaper. If your setup nails it, I'll leave you alone. Curious? Call it — 90 seconds. Fair?","Alan, it's [YOU] — you advertise 24/7 dispatch; here's a line that answers and books after-hours calls, often cheaper. Call [DEMO #]."],[6,"Greg","Power Dry","9135861545",null,"Hey Greg — not a pitch. Water mitigation only since '88, so every after-hours call to voicemail is a four or five-figure job walking to the next guy. If it's still you and Ed, you can't be on the phone at 2am every night. I built a line that answers and books those. Call it — 90 seconds. Want the number?","Greg, it's [YOU] — water-only means every missed 2am call is a big job lost; this answers and books them. Call [DEMO #]."],[7,"—","Pride Cleaning & Rest.","3146681223","Owner name not confirmed — get the right person first.","Hey — quick one, who owns the shop? ... Not a pitch: 30-plus years in STL, your phone rings a lot — who picks up when a water call hits at 2am? If it's voicemail, that job's gone. I built a line that answers those and books them. Call it — 90 seconds. Want the number?","Hey, it's [YOU] for whoever owns Pride — a line that answers your after-hours water calls so they don't hit voicemail. Call [DEMO #]."],[8,"—","Kelley Klean","5732140990","Owner unconfirmed — verify before using a name.","Hey — quick one, who's the owner these days? ... You're the oldest restoration shop in Central Missouri, so you're fielding a ton of calls — and I bet the after-hours ones roll to voicemail. I built a line that answers and books those. Call it — 90 seconds. Want the number?","Hey, it's [YOU] for the owner of Kelley Klean — this catches your after-hours calls before voicemail does. Call [DEMO #]."],[9,"—","Five One Five Rest.","5154521876","Owner not confirmed — get the right person.","Hey — are you the owner? ... You promise to respond in minutes, so it function glow(x,y,r,col,a){const[R,G,B]=hx(col);const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(${R},${G},${B},${.85*a})`);g.addColorStop(.4,`rgba(${R},${G},${B},${.22*a})`);g.addColorStop(1,`rgba(${R},${G},${B},0)`);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy||1;let t=((px-ax)*dx+(py-ay)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(ax+dx*t),py-(ay+dy*t));}

const mouse={x:-999,y:-999,ex:-999,ey:-999,in:false};
let panX=0,panY=0,tpanX=0,tpanY=0,drag=null;
cv.addEventListener("pointermove",e=>{const r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;mouse.in=true;
  if(drag){tpanX=drag.px+(mouse.x-drag.mx);tpanY=drag.py+(mouse.y-drag.my);}});
cv.addEventListener("pointerleave",()=>{mouse.in=false;});
cv.addEventListener("pointerdown",e=>{const r=cv.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;
  const n=pick(mx,my);if(n){n.pulse=1;if(n.id==="core")E.forEach((e2,ei)=>{if(e2.a==="core"&&!e2.off)bursts.push({ei,t:0});});openDrawer(n.id);}
  else drag={mx,my,px:tpanX,py:tpanY};});
addEventListener("pointerup",()=>{drag=null;});
function pick(mx,my){let hit=null,best=1e9;N.forEach(n=>{const d=Math.hypot(mx-n.px,my-n.py);if(d<n.r+16&&d<best){best=d;hit=n;}});return hit;}

let tPrev=0,rot=0;
function frame(t){
  const dt=Math.min((t-tPrev)/1000||0,.05);tPrev=t;rot+=dt*.04;
  panX+=(tpanX-panX)*.1;panY+=(tpanY-panY)*.1;
  if(mouse.in){mouse.ex+=(mouse.x-mouse.ex)*.2;mouse.ey+=(mouse.y-mouse.ey)*.2;}
  // subtle breathing drift of whole field
  const driftX=reduce?0:Math.sin(t/4000)*8, driftY=reduce?0:Math.cos(t/5200)*6;
  const OX=panX+driftX, OY=panY+driftY;
  N.forEach(n=>{n.px=n.x*W+OX;n.py=n.y*H+OY;});
  const cx=byId.core.px,cy=byId.core.py;

  // ground
  const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H));
  bg.addColorStop(0,"#0a1024");bg.addColorStop(.55,"#050912");bg.addColorStop(1,"#03050b");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // starfield
  ctx.save();ctx.globalCompositeOperation="lighter";
  stars.forEach(s=>{const x=s.x*W+OX*.3*s.z,y=s.y*H+OY*.3*s.z;const tw=reduce?.5:(Math.sin(t/700+s.tw)*.5+.5);
    ctx.globalAlpha=.15+tw*.5*s.z;ctx.fillStyle="#bcd4ff";ctx.beginPath();ctx.arc((x%W+W)%W,(y%H+H)%H,s.z*1.2,0,7);ctx.fill();});
  ctx.restore();

  ctx.globalCompositeOperation="lighter";
  // edges
  E.forEach(e=>{const A=byId[e.a],B=byId[e.b];let near=0;if(mouse.in)near=Math.max(0,1-distSeg(mouse.ex,mouse.ey,A.px,A.py,B.px,B.py)/130);
    const act=Math.max(A.hov,B.hov);const base=e.off?.04:.09;const a=base+near*.45+act*.4;
    if(e.off){ctx.setLineDash([3,7]);}else ctx.setLineDash([]);
    const g=ctx.createLinearGradient(A.px,A.py,B.px,B.py);const[ar,ag,ab]=hx(A.col),[br,bg2,bb]=hx(B.col);
    g.addColorStop(0,`rgba(${ar},${ag},${ab},${a})`);g.addColorStop(1,`rgba(${br},${bg2},${bb},${a})`);
    ctx.strokeStyle=g;ctx.lineWidth=(e.off?.9:1.3)+near+act;ctx.beginPath();ctx.moveTo(A.px,A.py);ctx.lineTo(B.px,B.py);ctx.stroke();});
  ctx.setLineDash([]);
  // packets
  if(!reduce)packets.forEach(p=>{const e=E[p.ei],A=byId[e.a],B=byId[e.b];p.t+=p.sp*dt;if(p.t>1)p.t-=1;const x=A.px+(B.px-A.px)*p.t,y=A.py+(B.py-A.py)*p.t;
    glow(x,y,5,B.col,.85);ctx.fillStyle="rgba(255,255,255,.9)";ctx.beginPath();ctx.arc(x,y,1.3,0,7);ctx.fill();});
  // core bursts
  for(let i=bursts.length-1;i>=0;i--){const b=bursts[i],e=E[b.ei],A=byId[e.a],B=byId[e.b];b.t+=1.1*dt;const x=A.px+(B.px-A.px)*b.t,y=A.py+(B.py-A.py)*b.t;
    glow(x,y,12*(1-b.t*.4),"#f4e6ff",.9);if(b.t>=1){byId[e.b].pulse=1;bursts.splice(i,1);}}

  // nodes
  N.forEach(n=>{
    const hd=mouse.in?Math.hypot(mouse.ex-n.px,mouse.ey-n.py):999;n.hov+=((hd<n.r+30?1:0)-n.hov)*.18;
    n.pulse=Math.max(0,n.pulse-dt*1.5);const breathe=reduce?0:Math.sin(t/1000+n.ph)*(n.active?.05:.02);
    const rr=n.r*(1+breathe+n.hov*.1+n.pulse*.3);const[R,G,B]=hx(n.col);
    const base=n.active?1:.42;const bright=base*(.7+n.hov*.5+n.pulse*.5);
    // satellites (orbiting dots)
    n.satA.forEach(s=>{s.a+=s.sp*dt;const sx=n.px+Math.cos(s.a)*s.rr,sy=n.py+Math.sin(s.a)*s.rr;
      ctx.globalCompositeOperation="lighter";glow(sx,sy,s.s*3.2,n.col,(n.active?.5:.22)*(.6+n.hov*.5));
      ctx.fillStyle=`rgba(${R},${G},${B},${n.active?.85:.4})`;ctx.beginPath();ctx.arc(sx,sy,s.s,0,7);ctx.fill();});
    ctx.globalCompositeOperation="lighter";glow(n.px,n.py,rr*2.5,n.col,(n.active?.3:.14)+n.hov*.4+n.pulse*.4);
    ctx.globalCompositeOperation="source-over";
    // core special: rotating hex
    if(n.hex){ctx.save();ctx.translate(n.px,n.py);
      for(let ring=0;ring<2;ring++){ctx.rotate(rot*(ring?-1:1.3));ctx.beginPath();
        for(let k=0;k<6;k++){const ang=k*Math.PI/3,rad=rr*(ring?.72:1.05);const px=Math.cos(ang)*rad,py=Math.sin(ang)*rad;k?ctx.lineTo(px,py):ctx.moveTo(px,py);}
        ctx.closePath();ctx.strokeStyle=`rgba(${R},${G},${B},${(.4-ring*.15)*(.6+bright*.4)})`;ctx.lineWidth=1.3;ctx.stroke();}
      // spokes
      for(let k=0;k<6;k++){const ang=k*Math.PI/3+rot;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(ang)*rr*1.05,Math.sin(ang)*rr*1.05);ctx.strokeStyle=`rgba(${R},${G},${B},.14)`;ctx.lineWidth=1;ctx.stroke();}
      ctx.restore();}
    // disc
    ctx.beginPath();ctx.arc(n.px,n.py,rr,0,7);ctx.fillStyle=n.active?"rgba(7,12,22,.9)":"rgba(9,13,20,.85)";ctx.fill();
    if(!n.active){ctx.setLineDash([3,4]);}ctx.strokeStyle=`rgba(${R},${G},${B},${Math.min(1,.45+bright*.5)})`;ctx.lineWidth=n.hov>.5?2.2:1.5;
    ctx.beginPath();ctx.arc(n.px,n.py,rr,0,7);ctx.stroke();ctx.setLineDash([]);
    // hover ticks
    if(n.hov>.02){ctx.strokeStyle=`rgba(${R},${G},${B},${n.hov*.8})`;ctx.lineWidth=1.2;
      for(let a=0;a<4;a++){const ang=a*Math.PI/2+t/2400;ctx.beginPath();ctx.moveTo(n.px+Math.cos(ang)*(rr+5),n.py+Math.sin(ang)*(rr+5));ctx.lineTo(n.px+Math.cos(ang)*(rr+5+6*n.hov),n.py+Math.sin(ang)*(rr+5+6*n.hov));ctx.stroke();}}
    if(n.id==="engine"&&!reduce){const oa=t/900;ctx.fillStyle=`rgba(${R},${G},${B},.7)`;ctx.beginPath();ctx.arc(n.px+Math.cos(oa)*(rr+5),n.py+Math.sin(oa)*(rr+5),2,0,7);ctx.fill();}
    // glyph
    const gs=rr*0.05;ctx.save();ctx.translate(n.px-12*gs,n.py-12*gs);ctx.scale(gs,gs);
    ctx.strokeStyle=`rgba(${R},${G},${B},${Math.min(1,(n.active?.85:.55)+bright*.3)})`;ctx.lineWidth=1.7/gs;ctx.lineJoin="round";ctx.lineCap="round";ctx.stroke(n.path);ctx.restore();
    ctx.globalCompositeOperation="lighter";glow(n.px,n.py,rr*.42,n.col,(n.active?.35:.15)+bright*.3);
    ctx.globalCompositeOperation="source-over";
    // label
    ctx.font="600 10px ui-monospace, monospace";ctx.textAlign="center";ctx.textBaseline="top";
    ctx.fillStyle=`rgba(${R},${G},${B},${Math.min(1,(n.active?.6:.4)+n.hov+n.pulse)})`;ctx.fillText(n.label,n.px,n.py+rr+8);
    ctx.font="9px ui-monospace, monospace";ctx.fillStyle=`rgba(142,163,192,${.4+n.hov*.5})`;ctx.fillText(n.sub,n.px,n.py+rr+21);
  });
  ctx.globalCompositeOperation="lighter";if(mouse.in)glow(mouse.ex,mouse.ey,80,"#9fd0ff",.07);
  ctx.globalCompositeOperation="source-over";
  requestAnimationFrame(frame);
}

// ============ DRAWER ============

 core:()=>`<div class="sec"><div class="s-lbl"><span>Scoreboard</span></div>

  <div class="sec"><div class="s-lbl"><span>Pipeline</span></div><div class="stagebars">${STAGES.map(s=>{const v=DATA.pipeline[s]||0,mx=Math.max(1,...STAGES.map(x=>DATA.pipeline[x]||0));return`<div class="sb"><span class="sn">${s}</span><span class="st2"><i style="width:${v/mx*100}%"></i></span><span class="sv">${v}</span></div>`;}).join("")}</div></div>

  <div class="sec"><div class="s-lbl"><span>Personalized openers · top 10</span></div>${OPENERS.map(o=>`<div class="script"><div class="sh"><div><div class="sw">${o[1]==="—"?"":o[1]+" · "}${o[2]}</div><div class="sc">${o[3]?tel(o[3]):""}</div></div>${o[3]?`<a class="tel" href="tel:+1${o[3]}">Call</a>`:""}</div>${o[4]?`<div class="flag">⚠ ${o[4]}</div>`:""}<div class="op">${o[5]}</div><div class="vm"><b>voicemail</b>${o[6]}</div></div>`).join("")}</div>`,
 store:()=>`<div class="sec"><div class="s-lbl"><span>Files</span></div>
   <div class="filerow"><div><div class="fname">business-context.md</div><div class="fmeta">offer · pricing · ICP</div></div><span class="badge on">Filled</span></div>
   <div class="filerow"><div><div class="fname">decisions.md</div><div class="fmeta">4 logged</div></div><span class="badge on">Full</span></div>
   <div class="filerow"><div><div class="fname">pipeline.md</div><div class="fmeta">10 queued · new</div></div><span class="badge warn">Queued</span></div>
   <div class="filerow"><div><div class="fname">metrics.md</div><div class="fmeta">1 row · zeros</div></div><span class="badge warn">Seeded</span></div>
   <div class="filerow"><div><div class="fname">objections.md</div><div class="fmeta">fills after dials</div></div><span class="badge empty">Empty</span></div></div>`,
 engine:()=>`<div class="sec"><div class="s-lbl"><span>Schedule</span></div><div class="mini"><b>Every day · 5:00am Central.</b> Cron 0 10 * * * UTC. One fresh cloud run per morning — no machine open.</div></div>
  <div class="sec"><div class="s-lbl"><span>Each run</span></div><div class="mini">1 · sources 100–200 qualified leads<br>2 · checker verifies a phone, flags the rest<br>3 · writes chess tree + top-25 openers<br>4 · commits to the repo → this dashboard updates</div></div>
  <div class="sec"><div class="s-lbl"><span>Status</span></div><div class="mini">Wired to MDPEnterprise.inc — writes leads into your files each morning. <a class="link" href="https://claude.ai/code/routines/trig_018YYUgA7ZBB2uueWFLEQRgg" target="_blank" rel="noopener">Open runs →</a></div></div>`,
 tiktok:()=>`<div class="sec"><div class="s-lbl"><span>Status · Offline</span></div><div class="plan"><b>Building tomorrow.</b> Generates faceless AI story videos daily for you to post to TikTok manually (no auto-posting). Needs a video tool + posting tool (~$50–150/mo) before it goes live. Script generation is ready; the render + queue pipeline gets wired next session.</div></div>`,
 voice:()=>`<div class="sec"><div class="s-lbl"><span>Status · Planned</span></div><div class="plan"><b>Not built yet.</b> An outbound AI voice caller (Vapi) — the same tech as your demo, pointed at the lead list to pre-qualify or set appointments. Lives in Vapi, not this repo; we'd design the assistant + call flow there.</div></div>`,
 appt:()=>`<div class="sec"><div class="s-lbl"><span>Status · Planned</span></div><div class="plan"><b>Not built yet.</b> Books demos/calls straight into your calendar from replies — SMS or voice. Pairs with the voice caller. Requires a calendar + booking tool connection.</div></div>`,
 clone:()=>`<div class="sec"><div class="s-lbl"><span>Status · Planned</span></div><div class="plan"><b>Not built yet.</b> An AI voice/face clone (ElevenLabs / HeyGen) for the TikTok + UGC content, so videos use a consistent persona. Needs those tool accounts + API keys.</div></div>`,
};
const SUB={core:"The agency OS. Routes work, owns the number, never does the agents' jobs.",lead:"Sources & qualifies restoration prospects.",sales:"Writes openers, objection handling, follow-ups.",store:"The files every agent reads before working and writes after.",engine:"The autonomous 5am routine — runs in the cloud.",tiktok:"Daily AI story videos for TikTok.",voice:"Outbound AI voice caller.",appt:"Books demos into your calendar.",clone:"AI voice/face clone for content."};
const scrim=document.getElementById("scrim"),drawer=document.getElementById("drawer"),drole=document.getElementById("drole"),dname=document.getElementById("dname"),dsub=document.getElementById("dsub"),dbody=document.getElementById("dbody"),dava=document.getElementById("dava");
function openDrawer(id){const n=byId[id];drole.textContent=n.active?"Active":"Offline · planned";drole.style.color=n.col;dname.textContent=n.label.replace(/\b\w/g,c=>c)+"";
  dname.textContent=n.label.split(" ").map(w=>w[0]+w.slice(1).toLowerCase()).join(" ");
  dsub.textContent=SUB[id];dava.style.background=`rgba(${hx(n.col).join(",")},.12)`;
  dava.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="${n.col}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[id]}</svg><span class="dot" style="background:${n.active?"var(--lead)":"#8a94a8"}"></span>`;
  dbody.innerHTML=WORK[id]();drawer.scrollTop=0;scrim.classList.add("open");drawer.classList.add("open");}
function closeDrawer(){scrim.classList.remove("open");drawer.classList.remove("open");}
document.getElementById("dclose").addEventListener("click",closeDrawer);scrim.addEventListener("click",closeDrawer);
addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});

// ============ HUD + HYDRATE ============
function renderKpis(){document.getElementById("k-mrr").innerHTML=DATA.kpis.mrr+'<small>/10k</small>';
  document.getElementById("k-leads").textContent=DATA.kpis.leads;
  document.getElementById("k-dials").innerHTML=DATA.kpis.dials.split("/")[0]+'<small>/'+DATA.kpis.dials.split("/")[1]+'</small>';
  document.getElementById("k-clients").textContent=DATA.kpis.clients;}
async function hydrate(){try{
  const pipe=await fetch("pipeline.md",{cache:"no-store"});if(!pipe.ok)throw 0;const txt=await pipe.text();
  const counts={};STAGES.forEach(s=>counts[s]=0);let won=false;
  txt.split("\n").forEach(line=>{if(/^##\s*Won/i.test(line))won=true;if(won||!line.startsWith("|"))return;const c=line.split("|").map(x=>x.trim());if(c.length<4)return;STAGES.forEach(s=>{if(c[3].toLowerCase()===s)counts[s]++;});});
  if(Object.values(counts).some(v=>v>0)){DATA.pipeline=counts;DATA.kpis.leads=Object.values(counts).reduce((a,b)=>a+b,0)||DATA.kpis.leads;}
  const met=await fetch("metrics.md",{cache:"no-store"});if(met.ok){const rows=(await met.text()).split("\n").filter(l=>l.startsWith("|")&&!/Week of|:---/.test(l));const last=rows[rows.length-1];if(last){const c=last.split("|").map(x=>x.trim());if(c.length>=9){DATA.kpis.mrr=c[7]||DATA.kpis.mrr;}}}
  document.getElementById("liveTxt").textContent="live · reading files";renderKpis();
}catch(e){document.getElementById("liveTxt").textContent="snapshot";}}
resize();renderKpis();requestAnimationFrame(frame);hydrate();
</script>

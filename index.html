    const act=Math.max(e.a.flare||0,e.b.flare||0,e.a.hov||0,e.b.hov||0);const live=(e.a.live!==0&&e.b.live!==0);

    if(al<.01)return;ctx.strokeStyle=`rgba(${R},${G},${B},${al})`;ctx.lineWidth=(e.kind==="core"?1.4:.9)*(1+act);
    ctx.beginPath();ctx.moveTo(c.ax,c.ay);ctx.quadraticCurveTo(c.cx,c.cy,c.bx,c.by);ctx.stroke();});
  // PULSES
  for(let i=pulses.length-1;i>=0;i--){const p=pulses[i];p.t+=p.sp*dt;const c=ctrl(p.e);const pt=bez(c,Math.min(p.t,1));const[R,G,B]=hx(p.col);
    const g=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,10);g.addColorStop(0,`rgba(${R},${G},${B},.9)`);g.addColorStop(1,`rgba(${R},${G},${B},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(pt.x,pt.y,10,0,7);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.9)";ctx.beginPath();ctx.arc(pt.x,pt.y,1.6,0,7);ctx.fill();
    if(p.t>=1){p.e.b.flare=1;if(p.depth===0&&p.e.b.subEdges)p.e.b.subEdges.forEach(se=>{if(Math.random()<.85)spawn(se,1);});pulses.splice(i,1);}}
  // SUB NEURONS
  subs.forEach(s=>{s.flare=Math.max(0,s.flare-dt*1.3);const x=SX(s),y=SY(s);if(x<-40||x>W+40||y<-40||y>H+40)return;const[R,G,B]=hx(s.col);
    const tw=reduce?.5:(Math.sin(t/600+s.twk)*.5+.5);const a=(.25+tw*.4+s.flare*.7)*(s.live?1:.5)*foc(s).dim;const r=RAD(s)*(1+s.flare*1.4);
    const g=ctx.createRadialGradient(x,y,0,x,y,r*4);g.addColorStop(0,`rgba(${R},${G},${B},${a})`);g.addColorStop(1,`rgba(${R},${G},${B},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*4,0,7);ctx.fill();
    ctx.fillStyle=`rgba(${R},${G},${B},${Math.min(1,a*1.6)})`;ctx.beginPath();ctx.arc(x,y,Math.max(1,r),0,7);ctx.fill();});
  // AGENT + CORE dotted spheres
  nodes.forEach(n=>{const P=foc(n);const cx=P.x,cy=P.y;const dimf=P.dim||1;
    const hd=(mouse.in&&!open)?Math.hypot(mouse.x-cx,mouse.y-cy):999;n.hov+=((hd<RAD(n)*1.6?1:0)-n.hov)*.15;
    n.flare=Math.max(0,n.flare-dt*1.1);if(!reduce)n.rot+=(n.kind==="core"?.14:.3)*dt;
    const breathe=reduce?1:(1+.04*Math.sin(t/900+n.ph)+n.flare*.12);const R=RAD(n)*breathe*P.s;
    const base=(n.live?1:.5)*dimf;const bright=base*(.8+n.hov*.5+n.flare*.6);const[Rc,Gc,Bc]=hx(n.col);
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*2);g.addColorStop(0,`rgba(${Rc},${Gc},${Bc},${(n.kind==="core"?.34:.26)*base*(1+n.hov+n.flare)})`);g.addColorStop(.5,`rgba(${Rc},${Gc},${Bc},${.07*base})`);g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*2,0,7);ctx.fill();
    if(n.kind==="core"){const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,R*.55);cg.addColorStop(0,`rgba(235,252,255,${.6+n.flare*.3})`);cg.addColorStop(1,"rgba(90,216,255,0)");ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,R*.55,0,7);ctx.fill();}
    const cosR=Math.cos(n.rot),sinR=Math.sin(n.rot),cosT=Math.cos(.42),sinT=Math.sin(.42);
    for(let i=0;i<n.pts.length;i++){let[x,y,z]=n.pts[i];let x1=x*cosR-z*sinR,z1=x*sinR+z*cosR;let y1=y*cosT-z1*sinT,z2=y*sinT+z1*cosT;const persp=1/(1-z2*.34);const sx=cx+x1*R*persp,sy=cy+y1*R*persp;const depth=(z2+1)/2;const size=(0.6+depth*1.8)*(RAD(n)/44)*(n.live?1:.8);if(size<.3)continue;ctx.fillStyle=`rgba(${Rc},${Gc},${Bc},${(0.16+depth*.9)*bright})`;ctx.fillRect(sx-size/2,sy-size/2,size,size);}
    if(n.id===focusId&&fp>.2){for(let k=0;k<8;k++){const a=t/1500+k*Math.PI/4,rr=R*1.5,sx2=cx+Math.cos(a)*rr,sy2=cy+Math.sin(a)*rr*.5;ctx.fillStyle=`rgba(${Rc},${Gc},${Bc},${.7*fp})`;ctx.beginPath();ctx.arc(sx2,sy2,2.4,0,7);ctx.fill();}}
  });
  ctx.globalCompositeOperation="source-over";placeLabels();requestAnimationFrame(frame);
}

clickable.forEach(n=>{if(n.id==="core")return;const d=document.createElement("div");d.className="lbl"+(n.live?"":" soon");d.innerHTML=`<div class="nm" style="color:${n.col}">${n.name}</div><div class="one">${n.one}</div><div class="chip" style="color:${n.col}">${n.chip}</div>`;labels.appendChild(d);n.lel=d;});

function placeLabels(){clickable.forEach(n=>{if(!n.lel)return;n.lel.style.left=SX(n)+"px";n.lel.style.top=(SY(n)+RAD(n)*1.6+16)+"px";const off=(SX(n)<-60||SX(n)>W+60||SY(n)<-60||SY(n)>H+60);n.lel.style.opacity=off?0:"";});

function tel(d){return d?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:"";}
function dial(p){return p?p.replace(/\D/g,""):"";}
function esc(s){return(s||"").replace(/"/g,"&quot;");}
const WORK={
 core:()=>`<div class="sec"><div class="s-lbl">The money</div><div class="say"><b style="font-size:26px;color:var(--core)">${DATA.kpis.mrr}</b> of $10,000/mo · <b>${DATA.kpis.clients}</b> clients · <b>${DATA.kpis.leads}</b> leads · <b>${DATA.kpis.dials.split("/")[0]}</b> called today</div></div>

 notes:()=>{const ks=Object.keys(NOTES).filter(k=>NOTES[k]);return `<div class="sec"><div class="s-lbl">Call notes <span>${ks.length} logged</span></div>${ks.length?ks.map(k=>`<div class="note-item"><div class="nc">${k}</div><div class="nt">${(NOTES[k]||"").replace(/</g,"&lt;")}</div></div>`).join(""):'<div class="say">No notes yet. Open <b>Leads</b>, tap 📝 on a company, and jot what happened. Saves on your device, shows here, and rides along in the CSV.</div>'}</div><div class="sec"><button class="btn" id="notesCsv">⬇ Export notes + leads CSV</button></div>`;},
 sales:()=>`<div class="sec"><div class="s-lbl">When they push back, say this</div>${PUSH.map(c=>`<div class="push"><div class="q">${c[0]}</div><div class="a">${c[1]}</div></div>`).join("")}</div>
  <div class="sec"><div class="s-lbl">What to open with</div>${OPENERS.map(o=>`<div class="script"><div class="sh"><div><div class="sw">${o[1]} · ${o[2]}</div><div class="sc">${tel(o[3])}</div></div><a class="tel" href="tel:+1${o[3]}">Call</a></div>${o[4]?`<div class="flag">⚠ ${o[4]}</div>`:""}<div class="op">“${o[5]}”</div><div class="vm"><b>if voicemail</b>${o[6]}</div></div>`).join("")}</div>`,
 store:()=>`<div class="sec"><div class="s-lbl">Everything the team remembers</div>
   <div class="fr"><div><div class="fl">Offer & pricing</div><div class="fm">$500/mo, setup waived for first 3</div></div><span class="badge on">Set</span></div>
   <div class="fr"><div><div class="fl">Demo line</div><div class="fm">(314) 887-9824 — in every script</div></div><span class="badge on">Wired</span></div>
   <div class="fr"><div><div class="fl">Your leads</div><div class="fm">${DATA.pipeline.new||0} waiting</div></div><span class="badge warn">${DATA.pipeline.new||0}</span></div>
   <div class="fr"><div><div class="fl">Call notes</div><div class="fm">${Object.keys(NOTES).length} logged on this device</div></div><span class="badge ${Object.keys(NOTES).length?'on':'empty'}">${Object.keys(NOTES).length||'—'}</span></div></div>`,
 engine:()=>`<div class="sec"><div class="s-lbl">Your 5am robot</div><div class="say">Every morning at <b>5:00am</b> it finds ~150 new companies, checks the numbers, writes what to say (with your real demo line), and adds them to your list — while you sleep.</div></div>
  <div class="sec"><div class="s-lbl">Latest</div><div class="say">Grew your list to <b>${DATA.kpis.leads} leads</b>. <a class="link" href="https://claude.ai/code/routines/trig_018YYUgA7ZBB2uueWFLEQRgg" target="_blank" rel="noopener">See its runs →</a></div></div>`,
 voice:()=>`<div class="sec"><div class="s-lbl">Coming soon</div><div class="say"><b>An AI that makes the calls for you</b> — same tech as your demo, pointed at the lead list.</div></div>`,

 adstudio:()=>`<div class="sec"><div class="s-lbl">Just an idea</div><div class="say"><b>Makes the photos, video, and copy</b> for the store's ads.</div></div>`,

const SUB={core:"The brainstem. All your key info and what to do next.",lead:"Companies to call, hottest first. Tap 📝 to log a call.",sales:"What to say — and what to say back when they push.",notes:"Your call log — what's happening with each lead.",store:"Everything the team knows about your business.",engine:"Finds 150 new leads every morning while you sleep.",voice:"An AI that makes calls for you.",appt:"Books your appointments.",tiktok:"Daily AI videos for views.",clone:"An AI you for content.",ecomstore:"An online store for profit.",adstudio:"Makes the store's ads.",life:"Runs your personal life admin.",money:"Watches your finances."};
const scrim=document.getElementById("scrim"),modal=document.getElementById("modal"),mey=document.getElementById("mey"),mname=document.getElementById("mname"),msub=document.getElementById("msub"),mbody=document.getElementById("mbody"),morb=document.getElementById("morb");
function openModal(id){const n=byId[id];focusId=id;open=true;mey.textContent=n.live?"Working now":(n.chip==="IDEA"?"Just an idea":"Coming soon");mey.style.color=n.col;mname.textContent=n.name;msub.textContent=SUB[id]||"";
  morb.textContent=n.ico;morb.style.background=`rgba(${hx(n.col).join(",")},.14)`;morb.style.color=n.col;
  mbody.innerHTML=(WORK[id]||(()=>""))();modal.scrollTop=0;scrim.classList.add("open");modal.classList.add("open");wireModal();}
function closeModal(){open=false;scrim.classList.remove("open");modal.classList.remove("open");}
function wireModal(){mbody.querySelectorAll(".ntbtn").forEach(b=>b.addEventListener("click",()=>{const ta=mbody.querySelector(`textarea[data-co="${b.dataset.co}"]`);if(ta){ta.classList.toggle("hide");if(!ta.classList.contains("hide"))ta.focus();}}));
  mbody.querySelectorAll("textarea[data-co]").forEach(ta=>ta.addEventListener("input",()=>{saveNote(ta.dataset.co,ta.value);const b=mbody.querySelector(`.ntbtn[data-co="${ta.dataset.co}"]`);if(b)b.classList.toggle("has",!!ta.value.trim());}));
  const nc=document.getElementById("notesCsv");if(nc)nc.addEventListener("click",exportCSV);}
document.getElementById("mx").addEventListener("click",closeModal);scrim.addEventListener("click",closeModal);
addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

function exportCSV(){const rows=[["Company","Contact / Owner","Phone","Note"]];DATA.leadList.forEach(l=>rows.push([l.co,(l.c||"").replace(/·/g," - "),l.p||"",NOTES[l.co]||""]));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n");const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="mdp-leads.csv";a.click();URL.revokeObjectURL(url);}
document.getElementById("exportBtn").addEventListener("click",exportCSV);

// ===== CHAT =====
const log=document.getElementById("log"),cinp=document.getElementById("cinp");
function add(cls,html){const m=document.createElement("div");m.className="msg "+cls;m.innerHTML=html;log.appendChild(m);log.scrollTop=log.scrollHeight;}
function reply(q){const s=q.toLowerCase();const ph=DATA.leadList.filter(l=>l.p).length;
  if(/hi|hey|hello|yo|sup/.test(s)&&s.length<12)return "<b>Command:</b> Hey. Ask me about leads, what to say, notes, CSV, next steps, or the 5am engine.";
  if(/how many|lead|compan|call list/.test(s))return `<b>Leads:</b> <b>${DATA.kpis.leads}</b> companies, <b>${ph}</b> with a phone ready to dial. Hottest: ${DATA.leadList.slice(0,3).map(l=>l.co).join(", ")}.`;
  if(/csv|export|dialer|download/.test(s))return "<b>Command:</b> Hit <b>Export leads CSV</b> top-right — every company, phone, and note, ready for the auto-dialer.";
  if(/note|log|track/.test(s))return "<b>Notes:</b> Open Leads, tap 📝 on a company, write what happened. Saves on your device, shows in the Notes neuron, and lands in the CSV.";
  if(/next|what.*do|priority|today/.test(s))return "<b>Command:</b> First — <b>call (314) 887-9824</b> and confirm your demo line works. Then dial the green leads and log each in Notes.";
  if(/say|script|opener|pitch|objection|push/.test(s))return "<b>Scripts:</b> Open with — “Not a pitch, quick: when a water call hits at 2am and drops to voicemail, that job's gone. I built a line that answers those. Call it, 90 seconds.” Tap Scripts for push-back answers.";
  if(/demo|vapi|number|line/.test(s))return "<b>Command:</b> Your demo line <b>(314) 887-9824</b> is wired into every script. Call it once yourself to make sure it rings and sounds right.";
  if(/money|revenue|mrr|close|client/.test(s))return `<b>Command:</b> Revenue <b>${DATA.kpis.mrr}</b> toward $10k, <b>${DATA.kpis.clients}</b> clients. Waive setup for the first 3, get them live in a week.`;
  if(/engine|5am|auto|source|find more/.test(s))return "<b>Auto-Leads:</b> I run at 5am and add ~150 phone-checked companies. You're at "+DATA.kpis.leads+" now.";
  if(/tiktok|video|content|clone/.test(s))return "<b>Content:</b> TikTok's next — daily AI story videos you post yourself.";
  return "<b>Command:</b> I can talk leads, scripts, notes, CSV, next steps, revenue, or the engine. Try the buttons — or have your operator wire me to full AI.";}
function send(q){if(!q.trim())return;add("me",q);cinp.value="";setTimeout(()=>add("ai",reply(q)),340);}
document.getElementById("csend").addEventListener("click",()=>send(cinp.value));cinp.addEventListener("keydown",e=>{if(e.key==="Enter")send(cinp.value);});
const chips=document.getElementById("chips");["How many leads?","What do I say?","How do notes work?","What's next?"].forEach(c=>{const b=document.createElement("button");b.textContent=c;b.onclick=()=>send(c);chips.appendChild(b);});
document.getElementById("chatHead").addEventListener("click",()=>{const c=document.getElementById("chat");c.classList.toggle("min");document.getElementById("chatToggle").textContent=c.classList.contains("min")?"▴":"▾";});

const last={};
function flash(id){const el=document.getElementById(id);el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}
function renderKpis(){const set=(id,html,key)=>{const el=document.getElementById(id);el.innerHTML=html;if(last[key]!==undefined&&last[key]!==html)flash(id);last[key]=html;};
  set("k-mrr",DATA.kpis.mrr+'<small>/10k</small>',"m");set("k-leads",String(DATA.kpis.leads),"l");set("k-dials",DATA.kpis.dials.split("/")[0]+'<small>/'+DATA.kpis.dials.split("/")[1]+'</small>',"d");set("k-clients",String(DATA.kpis.clients),"c");
  if(byId.lead.lel)byId.lead.lel.querySelector(".chip").textContent=DATA.kpis.leads;if(byId.notes.lel)byId.notes.lel.querySelector(".chip").textContent=Object.keys(NOTES).length;}
async function hydrate(){try{const pipe=await fetch("pipeline.md",{cache:"no-store"});if(!pipe.ok)throw 0;const txt=await pipe.text();
  const counts={};STAGES.forEach(s=>counts[s[0]]=0);const list=[];let won=false;
  txt.split("\n").forEach(line=>{if(/^##\s*Won/i.test(line))won=true;if(won||!line.startsWith("| "))return;const c=line.split("|").map(x=>x.trim());if(c.length<4||c[1]===""||c[1]==="Company")return;const st=c[3].toLowerCase();if(!STAGES.some(s=>s[0]===st))return;counts[st]++;if(st==="new"){const m=(c[2]||"").match(/\(?\d{3}\)?[ .-]?\d{3}[ .-]?\d{4}/);list.push({co:c[1],c:c[2],p:m?m[0]:""});}});
  if(list.length){DATA.pipeline=counts;DATA.kpis.leads=Object.values(counts).reduce((a,b)=>a+b,0);DATA.leadList=list;}
  const met=await fetch("metrics.md",{cache:"no-store"});if(met.ok){const rows=(await met.text()).split("\n").filter(l=>l.startsWith("|")&&!/Week of|:---/.test(l));const lr=rows[rows.length-1];if(lr){const c=lr.split("|").map(x=>x.trim());if(c.length>=9)DATA.kpis.mrr=c[7]||DATA.kpis.mrr;}}
  document.getElementById("liveTxt").innerHTML='LIVE · <b>'+DATA.kpis.leads+' neurons</b> firing';renderKpis();
}catch(e){document.getElementById("liveTxt").innerHTML='<b>'+DATA.kpis.leads+' leads</b> · snapshot';renderKpis();}}
document.getElementById("resetView").addEventListener("click",()=>{pan.x=0;pan.y=0;zoom=.6;});
setTimeout(()=>{const h=document.getElementById("hint");if(h)h.style.opacity="0";},7000);
resize();renderKpis();requestAnimationFrame(frame);hydrate();setInterval(hydrate,5000);
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MDP Enterprises — A.I. Operating System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05080f; --panel:rgba(9,18,32,.72); --line:rgba(90,175,255,.16);
  --line2:rgba(90,175,255,.30); --txt:#cfe3f4; --dim:#7d94aa; --acc:#4fc3f7;
  --acc2:#7fe6ff; --ok:#4fd39a; --warn:#e0b45c; --bad:#e5697a;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 700px at 50% 42%,rgba(20,70,130,.30),transparent 62%),
    radial-gradient(900px 600px at 8% 0%,rgba(15,50,95,.22),transparent 60%),
    var(--bg);
  color:var(--txt);font:13px/1.45 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
/* faint HUD grid */
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(80,160,240,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(80,160,240,.045) 1px,transparent 1px);
  background-size:46px 46px}

.app{position:fixed;inset:0;display:grid;
  grid-template-columns:266px 1fr 288px;grid-template-rows:52px 1fr;gap:12px;padding:12px}

/* ---------- header ---------- */
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 14px;
  backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.16em;
  font-size:11.5px;text-transform:uppercase;color:#dbeeff}
.mark{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--acc);
  display:grid;place-items:center;box-shadow:0 0 14px rgba(79,195,247,.45)}
.mark i{width:7px;height:7px;border-radius:50%;background:var(--acc);display:block}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);
  border-radius:20px;padding:3px 10px;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 8px var(--ok);animation:bp 2.4s infinite}
@keyframes bp{50%{opacity:.35}}
.clock{margin-left:auto;font:11.5px/1 var(--mono);color:var(--dim);letter-spacing:.08em}

/* ---------- rails ---------- */
.rail{display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:thin}
.rail::-webkit-scrollbar{width:5px}
.rail::-webkit-scrollbar-thumb{background:rgba(90,175,255,.22);border-radius:3px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px 12px;backdrop-filter:blur(8px)}
.ct{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--acc);margin-bottom:9px;font-weight:600}
.ct svg{width:13px;height:13px;stroke:var(--acc);fill:none;stroke-width:1.7}

/* metrics */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mt{border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:rgba(255,255,255,.015)}
.ml{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.mv{font:600 20px/1.15 var(--mono);color:#eaf6ff;margin-top:3px;letter-spacing:-.01em}
.mv small{font-size:11px;color:var(--dim);font-weight:400}
.md{font-size:10px;margin-top:2px;color:var(--dim)}

/* status rows */
.sr{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(90,175,255,.09);font-size:12px}
.sr:first-of-type{border-top:0}
.sr .nm{flex:1;color:var(--txt)}
.sr .vl{font:11px var(--mono);color:var(--dim)}
.sd{width:7px;height:7px;border-radius:50%;flex:none}

/* feed */
.fi{display:flex;gap:9px;padding:8px 0;border-top:1px solid rgba(90,175,255,.09)}
.fi:first-of-type{border-top:0}
.fic{width:24px;height:24px;border-radius:7px;border:1px solid var(--line2);flex:none;
  display:grid;place-items:center;font-size:11px;color:var(--acc);background:rgba(79,195,247,.07)}
.fb{flex:1;min-width:0}
.fn{font-size:12px;color:#e2f1ff}
.fs{font-size:10.5px;color:var(--dim);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ft{font:10px var(--mono);color:#5f7a92;flex:none}

/* thoughts */
.th{display:flex;gap:8px;padding:6px 0;font-size:12px;line-height:1.4}
.th b{color:var(--acc);font-weight:400}
.addbtn,.qa{width:100%;display:flex;align-items:center;gap:8px;background:rgba(79,195,247,.07);
  border:1px solid var(--line2);color:var(--acc2);border-radius:8px;padding:8px 10px;
  font-size:11.5px;cursor:pointer;font-family:inherit;text-align:left;margin-top:4px;transition:.15s}
.addbtn:hover,.qa:hover{background:rgba(79,195,247,.16);border-color:var(--acc)}

/* ---------- stage ---------- */
.stage{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background:radial-gradient(600px 460px at 50% 48%,rgba(20,75,140,.20),rgba(5,10,20,.55))}
#net{display:block;width:100%;height:100%}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:10.5px;
  color:#5f7a92;letter-spacing:.05em;pointer-events:none;transition:opacity 1s}

/* ---------- modal / chat ---------- */
.scrim{position:fixed;inset:0;background:rgba(2,6,14,.72);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:.22s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;top:50%;left:50%;transform:translate(-50%,-46%) scale(.97);
  width:min(760px,92vw);max-height:82vh;overflow-y:auto;background:rgba(8,16,29,.97);
  border:1px solid var(--line2);border-radius:12px;opacity:0;pointer-events:none;transition:.22s;
  box-shadow:0 30px 90px rgba(0,0,0,.6)}
.sheet.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.sh{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:rgba(8,16,29,.98);z-index:2}
.sh h2{font-size:15px;font-weight:600;color:#eaf6ff}
.sh p{font-size:11.5px;color:var(--dim);margin-top:1px}
.sx{margin-left:auto;background:none;border:0;color:var(--dim);font-size:22px;cursor:pointer;line-height:1}
.sb{padding:14px 16px}
.sec{margin-bottom:16px}
.slb{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--acc);
  margin-bottom:7px;display:flex;justify-content:space-between;align-items:baseline}
.slb span{color:var(--dim);letter-spacing:.03em;text-transform:none;font-size:11px}
.say{font-size:12.5px;line-height:1.55;color:#c3d8ea}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:5px 6px;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);cursor:pointer;user-select:none;white-space:nowrap;font-weight:600}
td{padding:6px;border-top:1px solid rgba(90,175,255,.09);vertical-align:middle}
.tel{color:var(--acc2);text-decoration:none;font-family:var(--mono);font-size:11.5px}
.noph{color:#4d6478}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;background:rgba(79,195,247,.09);
  border:1px solid var(--line);font-size:10.5px;letter-spacing:.05em;margin:0 5px 5px 0}
.chip b{color:var(--acc2)}
.ntbtn{width:24px;height:24px;border-radius:6px;border:1px solid var(--line2);
  background:transparent;color:var(--dim);cursor:pointer;font-size:11px}
.ntbtn.has{background:rgba(79,211,154,.16);border-color:var(--ok);color:var(--ok)}
/* Outcome picker. Tall enough to hit with a thumb — this gets used mid-call. */
/* Outcome toggles. Several can be true at once, and they get tapped mid-call
   with a thumb, so they are buttons rather than a dropdown. */
/* A brief is read once, quickly, standing up. Wide measure, calm type. */
.brief{font-size:13.5px;line-height:1.6;color:#cfe3f4}
.brief h2{font-size:15px;color:#eaf6ff;margin:16px 0 6px;letter-spacing:-.01em}
.brief h3{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--acc);margin:16px 0 6px}
.brief h4{font-size:12.5px;color:#e2f1ff;margin:12px 0 4px}
.brief p{margin:0 0 9px}
.brief ul{margin:0 0 10px 18px}
.brief li{margin-bottom:5px}
.brief b{color:#eaf6ff}
.brief code{font:11.5px var(--mono);background:rgba(79,195,247,.10);padding:1px 5px;border-radius:4px}
.brief a{color:var(--acc2)}
.unver{color:var(--warn);font-size:10px;letter-spacing:.08em;border:1px solid rgba(224,180,92,.4);
  border-radius:4px;padding:0 4px}
/* Drafts are shown raw, not rendered. This text gets pasted into a mail app,
   so what is on screen has to be exactly what gets sent. */
.draft{width:100%;min-height:340px;background:rgba(0,0,0,.30);border:1px solid var(--line);
  border-radius:8px;color:#cfe3f4;font:12.5px/1.65 var(--mono);padding:12px;resize:vertical}
.ocg{display:flex;flex-wrap:wrap;gap:4px;max-width:230px}
.ocx{background:rgba(0,0,0,.30);border:1px solid var(--line);border-radius:20px;
  color:var(--dim);font:11px inherit;padding:5px 9px;cursor:pointer;min-height:28px;
  white-space:nowrap;transition:.12s}
.ocx:hover{border-color:var(--line2)}
.ocx.on{background:rgba(79,211,154,.16);border-color:rgba(79,211,154,.5);color:var(--ok)}
.ocx.appt.on{background:rgba(79,195,247,.18);border-color:var(--acc);color:var(--acc2)}
.ocx:disabled{opacity:.45}
.ocx:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
select.oc{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:6px;
  color:var(--dim);font:11.5px inherit;padding:5px 6px;min-height:30px;max-width:150px}
select.oc.set{color:var(--ok);border-color:rgba(79,211,154,.45);background:rgba(79,211,154,.08)}
select.oc:disabled{opacity:.5}
input.due{margin-top:3px;background:rgba(0,0,0,.35);border:1px solid var(--line);
  border-radius:6px;color:var(--txt);font:11px var(--mono);padding:4px 5px;min-height:28px}
input.due.now{color:var(--warn);border-color:var(--warn);background:rgba(224,180,92,.10)}
/* Who to ask for. The front desk is the most common reason a dial dies. */
.who{font-size:11.5px;color:var(--acc2);margin-top:2px;line-height:1.3}
.who.none{color:#4d6478;font-style:italic}
/* Whether "Email them" can produce anything is decided here. Shown on the row
   so the answer is visible before the toggle is tapped, not after. */
.em{font:10px var(--mono);color:var(--ok);margin-top:2px;word-break:break-all}
.em.none{color:#4d6478}
/* What you are walking into on this call — the only thing worth reading in
   the two seconds before it connects. */
.ckind{font:10.5px var(--mono);margin-top:4px;line-height:1.35}
.ckind b{color:var(--faint);margin-right:3px}
/* The six, pinned above the leads list. Small on purpose — it has to coexist
   with the row being dialled, not compete with it. */
.tbar{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px}
.tnum{font-size:13px;color:var(--dim)}
.tnum b{font-size:23px;letter-spacing:-.02em}
.ttrack{height:5px;background:rgba(0,0,0,.35);border-radius:99px;margin:8px 0 5px;overflow:hidden}
.ttrack i{display:block;height:100%;border-radius:99px;transition:width .4s}
.tsub{font:10px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.obar{position:sticky;top:0;z-index:5;background:rgba(8,16,26,.97);backdrop-filter:blur(6px);
  border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:10px}
.obh{font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  cursor:pointer;display:flex;justify-content:space-between;gap:8px;user-select:none}
.obh span{color:var(--acc)}
.obg{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:4px 12px;margin-top:7px}
.obi{font-size:11.5px;line-height:1.35;padding-left:7px;border-left:2px solid var(--line2)}
.obi.lead{border-left-color:var(--ok)}
.obi b{color:var(--acc2);display:block;font-weight:600}
.obi span{color:var(--dim);font-size:10.5px}
textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:7px;
  color:var(--txt);padding:7px 8px;font:12px/1.45 inherit;resize:vertical;min-height:52px;margin:4px 0 6px}
.hide{display:none}

</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand"><span class="mark"><i></i></span> MDP Enterprises — A.I. Operating System</div>
    <span class="pill" id="sysPill"><span class="dot"></span><span id="sysTxt">Booting</span></span>
    <div class="clock" id="clock"></div>
  </header>

  <!-- LEFT -->
  <aside class="rail">
    <div class="card">
      <div class="ct"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg> Live Metrics</div>
      <div class="mg" id="metrics"></div>
    </div>
    <div class="card">
      <div class="ct"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> CEO Thoughts</div>
      <div id="thoughts"></div>
      <button class="addbtn" id="addThought">+ Add new thought</button>
    </div>
    <div class="card">
      <div class="ct"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg> System Status</div>
      <div id="status"></div>
    </div>
  </aside>

  <!-- CENTER -->
  <main class="stage">
    <canvas id="net"></canvas>
    <div class="hint" id="hint">tap the core to talk to your CEO · tap a hub to open it</div>
  </main>

  <!-- RIGHT -->
  <aside class="rail">
    <div class="card">
      <div class="ct"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg> Activity Feed</div>
      <div id="feed"></div>
    </div>
    <div class="card">
      <div class="ct"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg> AI Agent Activity</div>
      <div id="agents"></div>
    </div>
    <div class="card">
      <div class="ct"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg> Quick Actions</div>
      <button class="qa" data-act="log">▸ Log a call</button>
      <button class="qa" data-act="leads">▸ Open call list</button>
      <button class="qa" data-act="csv">▸ Export CSV for dialer</button>
      <button class="qa" data-act="notion">▸ Open Notion Call Log</button>
    </div>
  </aside>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="sh"><div><h2 id="shName"></h2><p id="shSub"></p></div><button class="sx" id="shX">×</button></div>
  <div class="sb" id="shBody"></div>
</div>

<div class="chat" id="chat">
  <div class="sh"><div><h2>CEO</h2><p id="ceoSub">Claude Code, running in ~/agency</p></div><button class="sx" id="chX">×</button></div>
  <div id="log"></div>
  <div class="cin"><input id="cinp" placeholder='Ask, or: log Rapid Dry — no answer' autocomplete="off"><button id="csend">Send</button></div>
</div>

<script>
/* The bridge runs on the Mac. On the Mac that is localhost; on the phone it
   has to be the tunnel URL, which the page cannot guess. Pair a device once by
   opening ...?bridge=https://xyz.trycloudflare.com&key=SECRET — it is stored
   and the query string is stripped so the key never sits in history or in a
   shared link. The key is never in this file: this file is public on Pages. */
const CFG=(()=>{
  const q=new URLSearchParams(location.search);
  const b=q.get("bridge"),k=q.get("key");
  if(b)localStorage.setItem("mdp-bridge",b.replace(/\/$/,""));
  if(k)localStorage.setItem("mdp-key",k);
  if(b||k)history.replaceState(null,"",location.pathname);
  const host=location.hostname;
  const dflt=(host==="localhost"||host==="127.0.0.1"||host==="")?"http://localhost:8787":"";
  return{url:localStorage.getItem("mdp-bridge")||dflt,key:localStorage.getItem("mdp-key")||""};
})();
let BRIDGE=CFG.url;
/* The free tunnel gets a new random URL every restart, which used to mean
   re-pairing every device by hand — and until someone did, the dashboard just
   said "bridge offline" with no way to tell that from the Mac being asleep.
   start-bridge.sh now publishes the live URL to bridge.json beside this page,
   and a device that cannot reach its stored URL picks the new one up itself.
   Only the URL is published. The key stays in localStorage, and the key is
   the fence — the bridge refuses everything without it. */
let REDISCOVERING=false;
async function rediscover(){
  if(REDISCOVERING||!CFG.key)return false;
  REDISCOVERING=true;
  try{
    const r=await fetch("bridge.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)return false;
    const u=String((await r.json()).url||"").replace(/\/$/,"");
    if(!u||u===BRIDGE)return false;
    BRIDGE=u;localStorage.setItem("mdp-bridge",u);
    return true;
  }catch(e){return false;}
  finally{REDISCOVERING=false;}
}
const bfetch=(path,opt={})=>{
  if(!BRIDGE)return Promise.reject(new Error("no bridge configured"));
  const h={...(opt.headers||{})};if(CFG.key)h["X-Bridge-Key"]=CFG.key;
  // ngrok's free tier serves a click-through warning page to anything that
  // looks like a browser, which would arrive here as HTML where JSON is
  // expected. This header opts out of it and is inert on any other host.
  h["ngrok-skip-browser-warning"]="1";
  return fetch(BRIDGE+path,{...opt,headers:h});
};
const STAGES=["new","contacted","replied","booked","call held","proposal","won","lost"];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dialn=p=>String(p||"").replace(/\D/g,"");
const $=id=>document.getElementById(id);

const DATA={leads:[],counts:{},metrics:{},status:null,feed:[],unreachable:0};
/* localStorage is now a cache, not the store. The bridge holds the truth; this
   copy is what the device shows while the bridge is unreachable, and what it
   replays once it is back. */
const NOTES=JSON.parse(localStorage.getItem("mdp-notes")||"{}");
const NOTE_AT=JSON.parse(localStorage.getItem("mdp-notes-at")||"{}");
let THOUGHTS=(()=>{
  const raw=JSON.parse(localStorage.getItem("mdp-thoughts")||"null");
  if(!raw)return null;
  // Migration: thoughts used to be bare strings with no id and no timestamp,
  // neither of which survives a merge between two devices.
  return raw.map(t=>typeof t==="string"?{id:uid(),text:t,at:"2000-01-01T00:00:00.000Z"}:t);
})();
let OUTBOX=JSON.parse(localStorage.getItem("mdp-outbox")||"[]");
/* Outcomes used to be the one thing that did NOT survive the bridge being
   down: markLead reverted the tap and showed an alert, so a call logged
   during an outage was simply gone. Notes queued; outcomes did not. They
   queue here now, keyed by company so re-tapping the same lead replaces its
   pending entry rather than sending the same row twice. */
let LEADQ=JSON.parse(localStorage.getItem("mdp-leadq")||"[]");
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36);}
const iso=()=>new Date().toISOString();
const saveOutbox=()=>localStorage.setItem("mdp-outbox",JSON.stringify(OUTBOX));
const saveLeadq=()=>localStorage.setItem("mdp-leadq",JSON.stringify(LEADQ));
const queueLead=e=>{LEADQ=LEADQ.filter(x=>x.company!==e.company);LEADQ.push(e);saveLeadq();};
function cacheState(){
  localStorage.setItem("mdp-notes",JSON.stringify(NOTES));
  localStorage.setItem("mdp-notes-at",JSON.stringify(NOTE_AT));
  if(THOUGHTS)localStorage.setItem("mdp-thoughts",JSON.stringify(THOUGHTS));
}
function saveNote(co,v){
  if(v.trim())NOTES[co]=v;else delete NOTES[co];
  NOTE_AT[co]=iso();cacheState();pushState();
}
function appendNote(co,t){
  const l=iso().slice(0,10)+" — "+t;
  NOTES[co]=NOTES[co]?NOTES[co]+"\n"+l:l;
  NOTE_AT[co]=iso();cacheState();pushState();
}

/* ---- cross-device sync ----
   Reconcile runs on every hydrate, not just after an edit. A device that has
   been writing notes with no bridge in reach — which is every note written
   before this existed — otherwise keeps them to itself forever, because
   nothing but an edit ever pushed. */
async function pullState(){
  let s;
  try{ s=await (await bfetch("/state")).json(); }catch(e){ return false; }

  const upload={};
  for(const [co,n] of Object.entries(s.notes||{})){
    // Server wins only when it is actually newer — otherwise a slow pull
    // would clobber something typed on this device a second ago.
    if(!NOTE_AT[co]||String(n.at||"")>NOTE_AT[co]){NOTES[co]=n.text;NOTE_AT[co]=n.at;}
  }
  for(const co of Object.keys(NOTES)){
    const mine=NOTES[co],srv=(s.notes||{})[co];
    if(!mine)continue;
    if(!srv){upload[co]={text:mine,at:NOTE_AT[co]||iso()};continue;}
    if(srv.text===mine||srv.text.includes(mine))continue;      // already up there
    if(mine.includes(srv.text)){upload[co]={text:mine,at:iso()};continue;}
    // Both sides wrote for this company while apart. Last-write-wins would
    // throw one away, so keep both — a duplicated line is recoverable, a
    // deleted call note is not.
    NOTES[co]=srv.text+"\n"+mine;NOTE_AT[co]=iso();
    upload[co]={text:NOTES[co],at:NOTE_AT[co]};
  }

  if(s.thoughts&&s.thoughts.length)THOUGHTS=s.thoughts;
  cacheState();
  if(Object.keys(upload).length)await pushState();
  return true;
}
async function pushState(){
  const notes={};for(const co of Object.keys(NOTES))notes[co]={text:NOTES[co],at:NOTE_AT[co]||iso()};
  try{
    const r=await bfetch("/state",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({notes,thoughts:THOUGHTS||[]})});
    if(r.ok){const s=await r.json();if(s.thoughts)THOUGHTS=s.thoughts;cacheState();}
    return r.ok;
  }catch(e){return false;}
}

/* ============ data ============ */
async function hydrate(){
  try{
    const r=await fetch("pipeline.md",{cache:"no-store"});
    if(r.ok){
      const counts={};STAGES.forEach(s=>counts[s]=0);const list=[];let won=false;
      // Rows under "## Unreachable" are quarantined by check-phones.sh — no
      // number could be verified. They are out of the pipeline on purpose, but
      // a silent quarantine is exactly how leads get lost, so they get counted
      // and shown on the Manager panel rather than just vanishing.
      let unreach=0,inUn=false;
      (await r.text()).split("\n").forEach(line=>{
        if(/^##\s*Unreachable/i.test(line)){inUn=true;return;}
        if(inUn){
          if(line.startsWith("| ")){const c=line.split("|").map(x=>x.trim());
            if(c[1]&&c[1]!=="Company")unreach++;}
          return;
        }
        if(/^##\s*Won/i.test(line))won=true;
        if(won||!line.startsWith("| "))return;
        const c=line.split("|").map(x=>x.trim());
        if(c.length<4||!c[1]||c[1]==="Company")return;
        const st=(c[3]||"").toLowerCase();if(!STAGES.includes(st))return;
        counts[st]++;
        const m=(c[2]||"").match(/\(?\d{3}\)?[ .-]?\d{3}[ .-]?\d{4}/);
        // Niche is the trailing column; fall back to name-matching for rows
        // written before the column existed (the 5am job appends without it).
        const niche=(c[7]||"").trim()||(/med ?spa|aesthetic|botox|derm|skin|laser|salon|injectable/i.test(c[1]+c[2])?"MedSpa":"Restoration");
        // "2026-08-05 sourced" vs "2026-08-05 no answer" — the trailing text is
        // the outcome, and "sourced" means the phone has never been picked up.
        const lt=c[4]||"",tail=lt.slice(10).trim();
        // Contact reads "Name · phone · website". The leading part is whoever
        // to ask for — the single most useful thing to have in hand when a
        // front desk picks up. Drop it when it is only a number or a domain.
        const lead0=(c[2]||"").split("·")[0].trim();
        // Not a phone, not a domain, not "Owner TBD", and not a "City, ST" —
        // those all sat in this column and none of them is a person to ask for.
        const who=(/[A-Za-z]{2}/.test(lead0)&&!/^\(?\d/.test(lead0)
                   &&!/\.(com|net|org|co|us|in|health|bar)\b/i.test(lead0)
                   &&!/^owner tbd$/i.test(lead0)&&!/,\s*[A-Z]{2}$/.test(lead0))?lead0:"";
        // Column 8 is the Email the 5am enrichment fills. It is what decides
        // whether "Email them" can produce anything, so it comes through.
        const em=(c[8]||"").trim();
        list.push({ix:list.length,co:c[1],c:c[2],who,p:m?m[0]:"",st,last:lt,next:c[5]||"",due:c[6]||"",niche,
          em:/@/.test(em)?em:"",
          out:(tail&&tail!=="sourced")?tail:""});
      });
      DATA.counts=counts;DATA.leads=list;DATA.unreachable=unreach;
      // pipeline.md does not know about taps that never reached the bridge.
      // Re-apply them so a reload during an outage does not look like the
      // morning's calls were never logged.
      LEADQ.forEach(q=>{
        const l=DATA.leads.find(x=>x.co===q.company);
        if(!l)return;
        l.out=(q.outcome||[]).join(", ");
        if(q.due)l.due=q.due;
        l.pending=true;
      });
    }
  }catch(e){}
  try{
    const m=await fetch("metrics.md",{cache:"no-store"});
    if(m.ok){
      const rows=(await m.text()).split("\n").filter(l=>l.startsWith("|")&&!/Week of|:---/.test(l));
      const c=(rows[rows.length-1]||"").split("|").map(x=>x.trim());
      if(c.length>=9)DATA.metrics={week:c[1],out:c[2],rep:c[3],mtg:c[4],calls:c[5],closes:c[6],mrr:c[7],constraint:c[8]};
    }
  }catch(e){}
  try{DATA.status=await (await bfetch("/status")).json();}
  catch(e){
    DATA.status=null;
    // One retry, but only after the URL actually changed — otherwise a Mac
    // that is simply asleep would be hammered twice on every hydrate.
    if(await rediscover()){
      try{DATA.status=await (await bfetch("/status")).json();}catch(_){}
    }
  }
  try{DATA.feed=(await (await bfetch("/activity")).json()).items||[];}catch(e){DATA.feed=[];}
  await pullState();
  flushOutbox();
  // Queued outcomes go first on the next successful hydrate. If any land,
  // re-read pipeline.md so the stages the bridge computed come back.
  if(LEADQ.length)flushLeads().then(r=>{if(r.sent)hydrate();});
  paint();
}

/* ============ graph ============ */
const cv=$("net"),cx=cv.getContext("2d");
const HUBS=[
  {id:"lead",  name:"LEADS",   subs:["Restoration","MedSpa","By stage"]},
  {id:"sales", name:"SCRIPTS", subs:["What I sell","Openers","Comebacks"]},
  {id:"notes", name:"NOTES",   subs:["Call Log","Notion","CSV"]},
  {id:"mgr",   name:"MANAGER", subs:["5am job","Agents","Data gaps"]},
  {id:"prep",  name:"PREP",    subs:["Briefs","Appointments","Run now"]},
  {id:"email", name:"EMAIL",   subs:["Ready","No address","Write now"]},
];
let W=0,H=0,DPR=1,t=0;
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);
  W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener("resize",resize);
const core=[];for(let i=0;i<300;i++){const y=1-(i/299)*2,rr=Math.sqrt(1-y*y),th=i*Math.PI*(3-Math.sqrt(5));
  core.push([Math.cos(th)*rr,y,Math.sin(th)*rr]);}
function hubPos(i){const a=-Math.PI/2+(i/HUBS.length)*Math.PI*2;const R=Math.min(W,H)*.315;
  return[W/2+Math.cos(a)*R,H/2+Math.sin(a)*R,a];}
/* Walk-in: clicking a hub zooms the graph into it and turns its sub-nodes into
   real targets, instead of jumping straight to a panel. `zoom` eases 0→1 so the
   transition reads as moving in rather than a hard cut. */
let FOCUS=null,zoomT=0;
const SUBACT={
  "Restoration":()=>{LEAD_NICHE="Restoration";openSheet("lead");},
  "MedSpa":()=>{LEAD_NICHE="MedSpa";openSheet("lead");},
  "By stage":()=>{LEAD_NICHE="";SORT.key="st";SORT.dir=1;openSheet("lead");},
  "What I sell":()=>{SCF="offer";openSheet("sales");},
  "Openers":()=>{SCF="openers";openSheet("sales");},
  "Comebacks":()=>{SCF="objections";openSheet("sales");},
  "Call Log":()=>openSheet("notes"),"Notion":()=>act("notion"),"CSV":()=>exportCSV(),
  "5am job":()=>openSheet("mgr"),"Agents":()=>openSheet("mgr"),"Data gaps":()=>openSheet("mgr"),
  "Briefs":()=>openSheet("prep"),"Appointments":()=>openSheet("prep"),
  "Run now":()=>{openSheet("prep");runPrep();},
  // Three nodes that opened the same view was decoration. Each now lands on a
  // different slice of the one list.
  "Ready":()=>{EMF="ready";openSheet("email");},
  "No address":()=>{EMF="noaddr";openSheet("email");},
  "Write now":()=>{EMF="todo";openSheet("email");runDrafts();},
};
function frame(){
  t+=.006;
  zoomT+=((FOCUS?1:0)-zoomT)*.14;          // ease toward focused / unfocused
  cx.clearRect(0,0,W,H);
  if(zoomT>.02)return frameFocus();
  const cxp=W/2,cyp=H/2,CR=Math.min(W,H)*.115;
  // rings
  for(let i=1;i<=3;i++){cx.beginPath();cx.arc(cxp,cyp,CR*(1+i*.42),0,7);
    cx.strokeStyle=`rgba(79,195,247,${.13-i*.03})`;cx.lineWidth=1;cx.stroke();}
  // links + hubs
  HUBS.forEach((h,i)=>{
    const[hx,hy,a]=hubPos(i);
    cx.beginPath();cx.moveTo(cxp,cyp);cx.lineTo(hx,hy);
    cx.strokeStyle="rgba(79,195,247,.20)";cx.lineWidth=1;cx.stroke();
    // travelling pulse
    const p=((t*.6+i*.25)%1);
    cx.beginPath();cx.arc(cxp+(hx-cxp)*p,cyp+(hy-cyp)*p,2.1,0,7);
    cx.fillStyle="rgba(150,225,255,.85)";cx.fill();
    // sub nodes
    h.subs.forEach((s,j)=>{
      const sa=a+(j-(h.subs.length-1)/2)*.42, SR=Math.min(W,H)*.135;
      const sx=hx+Math.cos(sa)*SR, sy=hy+Math.sin(sa)*SR;
      cx.beginPath();cx.moveTo(hx,hy);cx.lineTo(sx,sy);
      cx.strokeStyle="rgba(79,195,247,.13)";cx.stroke();
      cx.beginPath();cx.arc(sx,sy,3.4,0,7);cx.fillStyle="rgba(10,25,45,.95)";cx.fill();
      cx.strokeStyle="rgba(120,215,255,.55)";cx.lineWidth=1.2;cx.stroke();
      cx.fillStyle="rgba(150,185,210,.72)";cx.font="9.5px ui-sans-serif";
      cx.textAlign=Math.cos(sa)<0?"right":"left";
      cx.fillText(s,sx+(Math.cos(sa)<0?-8:8),sy+3);
    });
    // hub body
    const hr=Math.min(W,H)*.052;
    const g=cx.createRadialGradient(hx,hy,1,hx,hy,hr*1.7);
    g.addColorStop(0,"rgba(60,150,225,.42)");g.addColorStop(1,"rgba(20,60,110,0)");
    cx.beginPath();cx.arc(hx,hy,hr*1.7,0,7);cx.fillStyle=g;cx.fill();
    cx.beginPath();cx.arc(hx,hy,hr,0,7);cx.fillStyle="rgba(8,20,38,.92)";cx.fill();
    cx.strokeStyle="rgba(120,215,255,.75)";cx.lineWidth=1.5;cx.stroke();
    cx.beginPath();cx.arc(hx,hy,hr*1.22,0,7);cx.strokeStyle="rgba(79,195,247,.28)";cx.lineWidth=1;cx.stroke();
    h._x=hx;h._y=hy;h._r=hr*1.25;
    cx.fillStyle="#dcf1ff";cx.font="600 10.5px ui-sans-serif";cx.textAlign="center";
    cx.fillText(h.name,hx,hy+hr+15);
    if(h.id==="lead"){cx.fillStyle="rgba(127,230,255,.9)";cx.font="600 13px "+getComputedStyle(document.body).getPropertyValue("--mono");
      cx.fillText(String(DATA.leads.length||""),hx,hy+4);}
  });
  // core
  const gg=cx.createRadialGradient(cxp,cyp,2,cxp,cyp,CR*2.2);
  gg.addColorStop(0,"rgba(70,175,255,.5)");gg.addColorStop(1,"rgba(20,70,130,0)");
  cx.beginPath();cx.arc(cxp,cyp,CR*2.2,0,7);cx.fillStyle=gg;cx.fill();
  core.forEach(([x,y,z])=>{
    const ca=Math.cos(t),sa=Math.sin(t);
    const X=x*ca-z*sa,Z=x*sa+z*ca,d=(Z+1.6)/2.6;
    cx.beginPath();cx.arc(cxp+X*CR,cyp+y*CR,.9*d+.3,0,7);
    cx.fillStyle=`rgba(160,230,255,${.10+d*.5})`;cx.fill();
  });
  cx.beginPath();cx.arc(cxp,cyp,CR,0,7);cx.strokeStyle="rgba(140,225,255,.6)";cx.lineWidth=1.6;cx.stroke();
  cx.fillStyle="#eaf7ff";cx.font="600 19px ui-sans-serif";cx.textAlign="center";
  cx.fillText("CEO",cxp,cyp+CR+26);
  requestAnimationFrame(frame);
}
/* Focused view: the hub sits centre, its sub-nodes ring it as real targets. */
function frameFocus(){
  const h=FOCUS||{name:"",subs:[]},cxp=W/2,cyp=H/2;
  const k=Math.min(W,H),R=k*.055*(0.4+zoomT*.6);
  const gg=cx.createRadialGradient(cxp,cyp,2,cxp,cyp,R*4);
  gg.addColorStop(0,"rgba(70,175,255,.34)");gg.addColorStop(1,"rgba(20,70,130,0)");
  cx.beginPath();cx.arc(cxp,cyp,R*4,0,7);cx.fillStyle=gg;cx.fill();

  h._subxy=[];
  const SR=k*.26*zoomT;
  h.subs.forEach((s,j)=>{
    const a=-Math.PI/2+(j/h.subs.length)*Math.PI*2;
    const sx=cxp+Math.cos(a)*SR, sy=cyp+Math.sin(a)*SR, sr=k*.038*zoomT;
    cx.beginPath();cx.moveTo(cxp,cyp);cx.lineTo(sx,sy);
    cx.strokeStyle="rgba(79,195,247,.22)";cx.lineWidth=1;cx.stroke();
    const p=((t*.7+j*.3)%1);
    cx.beginPath();cx.arc(cxp+(sx-cxp)*p,cyp+(sy-cyp)*p,2,0,7);
    cx.fillStyle="rgba(150,225,255,.8)";cx.fill();
    cx.beginPath();cx.arc(sx,sy,sr,0,7);cx.fillStyle="rgba(8,20,38,.95)";cx.fill();
    cx.strokeStyle="rgba(130,220,255,.8)";cx.lineWidth=1.5;cx.stroke();
    cx.fillStyle="#dcf1ff";cx.font=`600 ${Math.max(9,k*.017)}px ui-sans-serif`;cx.textAlign="center";
    cx.fillText(s,sx,sy+sr+15);
    h._subxy.push({s,x:sx,y:sy,r:sr*1.35});
  });
  cx.beginPath();cx.arc(cxp,cyp,R,0,7);cx.fillStyle="rgba(8,20,38,.95)";cx.fill();
  cx.strokeStyle="rgba(140,225,255,.85)";cx.lineWidth=2;cx.stroke();
  cx.fillStyle="#eaf7ff";cx.font=`600 ${Math.max(11,k*.022)}px ui-sans-serif`;cx.textAlign="center";
  cx.fillText(h.name,cxp,cyp+R+24);
  cx.fillStyle="rgba(150,185,210,.6)";cx.font="10.5px ui-sans-serif";
  cx.fillText("tap the centre for the full panel · tap outside to go back",cxp,H-16);
  requestAnimationFrame(frame);
}

cv.addEventListener("click",e=>{
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const k=Math.min(W,H);
  if(FOCUS){
    for(const s of (FOCUS._subxy||[]))
      if(Math.hypot(x-s.x,y-s.y)<s.r){const fn=SUBACT[s.s];FOCUS=null;return fn?fn():null;}
    if(Math.hypot(x-W/2,y-H/2)<k*.075){const id=FOCUS.id;FOCUS=null;return openSheet(id);}
    FOCUS=null;return;                       // click outside walks back out
  }
  const CR=k*.115;
  if(Math.hypot(x-W/2,y-H/2)<CR*1.3)return openChat();
  for(const h of HUBS)if(Math.hypot(x-h._x,y-h._y)<h._r){FOCUS=h;return;}
});

const live=l=>!["won","lost"].includes(l.st||"new");
const txt=l=>((l.out||"")+" "+(l.next||"")).toLowerCase();
const isCallback=l=>live(l)&&/callback|call back|he asked|she asked|they asked|promised/.test(txt(l));
const isGate    =l=>live(l)&&/gatekeeper|receptionist|voicemail|left message/.test(txt(l));
const isNoAns   =l=>live(l)&&/no answer|didn'?t answer|no contact/.test(txt(l));
const isOwner   =l=>live(l)&&/spoke to (the )?owner|spoke to manager|spoke to marlena|spoke to melanie/.test(txt(l));
/* Overdue means a promise that slipped, NOT a past date. Almost every row in
   the file carries a 2026-08-01 due date it inherited from sourcing, so a
   plain due<today test flags 556 of 614 leads and the chip means nothing.
   Only a lead you actually spoke to and owe a call counts. Nick sat six days
   past due on exactly this and went dead. */
const today=()=>new Date().toISOString().slice(0,10);
const isOverdue=l=>live(l)&&!!l.due&&l.due<today()&&(isCallback(l)||isOwner(l));

function leadTable(){
  const rows=DATA.leads.filter(l=>!LEAD_NICHE||l.niche===LEAD_NICHE)
    .filter(l=>CALLED==="all"||(CALLED==="due"?isBooked(l)
                              :CALLED==="em"?!!l.em
                              // "dial" is exactly the CSV: never called, and a
                              // number to actually ring. Anything without one is
                              // research, not a dial.
                              :CALLED==="dial"?dialRank(l)<9e9
                              :CALLED==="late"?isOverdue(l)
                              :CALLED==="cb"?isCallback(l)
                              :CALLED==="owner"?isOwner(l)
                              :CALLED==="gate"?isGate(l)
                              :CALLED==="na"?isNoAns(l)
                              :CALLED==="yes"?!!l.out:!l.out)).sort((a,b)=>{
    // The Dial list is imported into the dialer in a fixed order, and a call
    // sheet that disagrees with the dialer means hunting for the row on every
    // call. Pinned order wins here unless a column header is clicked.
    if(CALLED==="dial"&&SORT.key==="co")return (dialRank(a)-dialRank(b))*SORT.dir;
    let x,y;
    if(SORT.key==="st"){x=STAGES.indexOf(a.st||"new");y=STAGES.indexOf(b.st||"new");}
    else{x=(a[SORT.key]||"").toLowerCase();y=(b[SORT.key]||"").toLowerCase();}
    return (x>y?1:x<y?-1:0)*SORT.dir;});
  const inNiche=n=>DATA.leads.filter(l=>l.niche===n).length;
  const cnt=s=>rows.filter(l=>(l.st||"new")===s).length;
  const chips=STAGES.map(s=>`<span class="chip">${s.toUpperCase()} <b>${cnt(s)}</b></span>`).join("");
  const branch=(n,label)=>`<span class="chip" data-niche="${n}" style="cursor:pointer;${LEAD_NICHE===n?"border-color:var(--acc);background:rgba(79,195,247,.2)":""}">${label} <b>${n?inNiche(n):DATA.leads.length}</b></span>`;
  const th=(k,l)=>`<th data-sort="${k}">${l}${SORT.key===k?(SORT.dir>0?" ▲":" ▼"):""}</th>`;
  const pool=DATA.leads.filter(l=>!LEAD_NICHE||l.niche===LEAD_NICHE);
  const done=pool.filter(l=>l.out).length;
  const cf=(k,label,n)=>`<span class="chip" data-called="${k}" style="cursor:pointer;${CALLED===k?"border-color:var(--acc);background:rgba(79,195,247,.2)":""}">${label} <b>${n}</b></span>`;
  return targetBar()+offerBar()+`<div class="sec"><div class="slb">Branch</div>
    ${branch("","All")}${branch("Restoration","Restoration")}${branch("MedSpa","MedSpa")}</div>
  <div class="sec"><div class="slb">Calls</div>
    ${cf("all","All",pool.length)}${cf("no","Not called",pool.length-done)}${cf("yes","Called",done)}${cf("due","Appointments",pool.filter(isBooked).length)}${cf("dial","Dial list",pool.filter(l=>dialRank(l)<9e9).length)}${cf("em","Has email",pool.filter(l=>l.em).length)}</div>
  <div class="sec"><div class="slb">Follow-ups <span>who is owed a call, in the order they should get one</span></div>
    ${cf("late","⚠ Overdue",pool.filter(isOverdue).length)}${cf("cb","Callback owed",pool.filter(isCallback).length)}${cf("owner","Spoke to owner",pool.filter(isOwner).length)}${cf("gate","Gatekeeper",pool.filter(isGate).length)}${cf("na","No answer",pool.filter(isNoAns).length)}</div>
  <div class="sec"><div class="slb">Pipeline <span>${rows.length} companies${LEAD_NICHE?" · "+LEAD_NICHE:""}</span></div>${chips}</div>
  <div class="sec"><table><thead><tr>${th("co","Company")}${th("p","Phone")}${th("st","Stage")}<th>Outcome</th><th></th></tr></thead>
  <tbody>${rows.map(l=>`<tr${l.out?' style="background:rgba(79,211,154,.05)"':""}>
    <td>${esc(l.co)}
      ${l.who?`<div class="who">${esc(l.who)}</div>`
             :`<div class="who none">no name yet</div>`}
      ${l.em?`<div class="em">${esc(l.em)}</div>`
            :(wantsEmail(l)?`<div class="em none">no address — needs research</div>`:"")}
      ${CALLED==="dial"?(()=>{const[k,c]=callKind(l);
        return `<div class="ckind" style="color:${c}"><b>${dialRank(l)+1}.</b> ${esc(k)}</div>`;})():""}</td>
    <td style="white-space:nowrap">${l.p?`<a class="tel" href="tel:+1${dialn(l.p)}">${esc(l.p)}</a>`:'<span class="noph">—</span>'}</td>
    <td style="opacity:.8;white-space:nowrap">${esc(l.st||"new")}</td>
    <td><div class="ocg">${OUTCOMES.map(o=>{const on=hasOut(l,o);
      return `<button class="ocx${on?" on":""}${o==="appointment booked"?" appt":""}" data-co="${esc(l.co)}" data-o="${o}" aria-pressed="${on}">${SHORT[o]}</button>`;}).join("")}</div>
    ${isBooked(l)
      ?`<input type="date" class="due" data-co="${esc(l.co)}" value="${esc(l.due||"")}" aria-label="Appointment date">`
      :`<div style="font:10px var(--mono);color:var(--dim);margin-top:3px">${esc((l.last||"—").slice(0,10))}</div>`}
    ${l.pending?'<div style="font:10px var(--mono);color:var(--warn);margin-top:3px">⏳ queued — not saved yet</div>':""}</td>
    <td style="text-align:right"><button class="ntbtn ${NOTES[l.co]?"has":""}" data-co="${esc(l.co)}">✎</button></td></tr>
    <tr><td colspan="5" style="border:0;padding:0"><textarea class="hide" data-co="${esc(l.co)}" placeholder="What happened?">${esc(NOTES[l.co]||"")}</textarea></td></tr>`).join("")}
  </tbody></table></div>`;
}

/* One tap has to survive a dropped connection — the phone is used on the move
   and a silently lost outcome means the lead gets called twice. The whole set
   goes up every time, so the server never has to merge anything. */
async function markLead(co,outcomes,el,due){
  const lead=DATA.leads.find(l=>l.co===co);
  const prev=lead?lead.out:"",prevDue=lead?lead.due:"";
  // An appointment with no date drops straight back into the 400-row pile.
  // Tomorrow is a guess, but a wrong date is visible in the picker that
  // appears next to it; a missing one is not.
  if(outcomes.includes("appointment booked")&&!due&&!prevDue){
    const d=new Date();d.setDate(d.getDate()+1);due=d.toISOString().slice(0,10);
  }
  if(lead){lead.out=outcomes.join(", ");if(due)lead.due=due;}
  if(el)el.disabled=true;
  try{
    const r=await bfetch("/lead",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({company:co,outcome:outcomes,due})});
    const j=await r.json();
    if(!r.ok||j.error)throw new Error(j.error||"bridge refused it");
    if(lead){lead.st=j.stage||lead.st;if(j.due)lead.due=j.due;}
    hydrate();
  }catch(e){
    // Do NOT revert. The tap is the record of a call that happened, and
    // throwing it away because a tunnel dropped is how a morning of dialling
    // disappears. Keep it on screen, queue it, send it when the bridge is back.
    queueLead({company:co,outcome:outcomes,due:due||prevDue||"",at:iso()});
    if(lead)lead.pending=true;
    paint();
    const b=$("shBody");if(b&&b.querySelector("button.ocx")){b.innerHTML=leadTable();wireSheet();}
  }finally{ if(el)el.disabled=false; }
}

/* Drains queued outcomes. Same shape as flushOutbox: stop on the first
   failure so ordering holds, and keep whatever did not go. */
async function flushLeads(){let sent=0;
  while(LEADQ.length){
    try{
      const r=await bfetch("/lead",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(LEADQ[0])});
      if(!r.ok)break;
      const j=await r.json();
      if(j.error)break;
      LEADQ.shift();sent++;
    }catch(e){break;}
  }
  saveLeadq();return{sent,left:LEADQ.length};
}

   spent at the Mac, so they are read here. */
DATA.prep={items:null,open:null,text:"",busy:false,err:null};

async function runPrep(){
  DATA.prep.busy=true; repaintPrep();

/* Enough markdown for what call-prep writes: headings, bold, code, bullets. */
function md(s){
  const lines=esc(s).split("\n");let out="",inList=false;
  for(let ln of lines){
    const bullet=/^\s*[-*]\s+(.*)$/.exec(ln);
    if(bullet){ if(!inList){out+="<ul>";inList=true;} out+="<li>"+inline(bullet[1])+"</li>"; continue; }
    if(inList){out+="</ul>";inList=false;}
    const hd=/^(#{1,4})\s+(.*)$/.exec(ln);
    if(hd){ const n=Math.min(hd[1].length+1,4); out+="<h"+n+">"+inline(hd[2])+"</h"+n+">"; continue; }
    if(!ln.trim()){continue;}
    out+="<p>"+inline(ln)+"</p>";
  }
  if(inList)out+="</ul>";
  return out;
  function inline(t){return t
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/`(.+?)`/g,"<code>$1</code>")
    .replace(/\[(.+?)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\bUNVERIFIED\b/g,'<span class="unver">UNVERIFIED</span>');}
}

// Marked "Email them" on a call but the Email column is empty. This is the
// queue that needs research, not writing — and it is the real constraint.
const wantsEmail=l=>hasOut(l,"send an email");
/* On the dial sheet the useful thing is not the stage, it's what you are
   walking into when they pick up. Read off the last touch. */
function callKind(l){
  const t=(l.out||"").toLowerCase();
  if(!t) return ["fresh — never called","var(--dim)"];
  if(/phone disconnected/.test(t))      return ["SKIP — disconnected","var(--warn)"];
  if(/not interested/.test(t))          return ["SKIP — already a no","var(--warn)"];
  if(/already has a system/.test(t))    return ["they have a system — ask what it does wrong","var(--acc2)"];
  if(/appointment booked/.test(t))      return ["BOOKED — do not cold call","var(--ok)"];
  if(/callback set/.test(t))            return ["CALLBACK OWED","var(--ok)"];
  if(/spoke to owner/.test(t))          return ["2nd call — you already spoke to the owner","var(--acc2)"];
  if(/gatekeeper/.test(t))              return ["2nd call — got a gatekeeper"+(l.who?", ask for "+l.who:""),"var(--acc2)"];
  if(/send an email/.test(t))           return ["emailed — do not re-pitch cold","var(--acc2)"];
  if(/no answer/.test(t))               return ["redial — no answer last time","var(--dim)"];
  return [t,"var(--dim)"];
}

// Must match the slug in draft-emails.sh, or a lead never finds its own draft.
const slugco=s=>s.toLowerCase().replace(/&/g," ").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
let EMF="all";   // all | ready | todo | noaddr — which slice of the one list

function emailPanel(){
  const P=DATA.drafts;
  if(P.items===null){loadDrafts().then(repaintDrafts);return '<div class="say" style="color:var(--dim)">Loading drafts…</div>';}

  if(P.open){
    // Monospace and unrendered: this text gets pasted into a mail app, so it
    // has to be seen exactly as it will be sent.
    return `<div class="sec"><button class="qa" data-back="drafts" style="width:auto;display:inline-flex">◂ Back</button></div>
      <div class="sec"><textarea class="draft" readonly onclick="this.select()">${esc(P.text)}</textarea>
      <div class="say" style="color:var(--dim);margin-top:6px">Tap the text to select all, then copy.</div></div>`;
  }

  // One list: every lead that has an address, each joined to its draft file.
  const byFile={};(P.items||[]).forEach(i=>byFile[i.file]=i);
  const rows=DATA.leads.filter(l=>l.em)
    .map(l=>{const f=slugco(l.co)+".md";return{l,f,d:byFile[f]||null};})
    .sort((a,b)=>(b.d?1:0)-(a.d?1:0)||a.l.co.localeCompare(b.l.co));
  const ready =rows.filter(x=>x.d&&!x.d.needs);
  const todo  =rows.filter(x=>!x.d||x.d.needs);
  const noaddr=DATA.leads.filter(l=>!l.em&&wantsEmail(l));

  const chip=(k,label,n)=>`<span class="chip" data-emf="${k}" style="cursor:pointer;${EMF===k?"border-color:var(--acc);background:rgba(79,195,247,.2)":""}">${label} <b>${n}</b></span>`;
  const chips=chip("all","With an address",rows.length)+chip("ready","Ready to send",ready.length)
             +chip("todo","Not written yet",todo.length)+chip("noaddr","No address",noaddr.length);

  let body;
  if(EMF==="noaddr"){
    body=noaddr.length?noaddr.map(l=>`<div class="sr">
        <span class="sd" style="background:var(--warn);box-shadow:0 0 8px var(--warn)"></span>
        <span class="nm">${esc(l.co)}<div style="font-size:10.5px;color:var(--dim)">${l.p?esc(l.p):"no phone either"}</div></span>
        <span class="vl">find address</span></div>`).join("")
      :'<div class="say" style="color:var(--dim)">Nothing waiting on an address.</div>';
  }else{
    const set=EMF==="ready"?ready:EMF==="todo"?todo:rows;
    body=set.length?set.map(({l,f,d})=>{
      const col=d?(d.needs?"var(--warn)":"var(--ok)"):"var(--dim)";
      return `<div class="sr"${d?` data-draft="${esc(f)}" style="cursor:pointer"`:""}>
        <span class="sd" style="background:${col};box-shadow:0 0 8px ${col}"></span>
        <span class="nm">${esc(l.co)}<div class="em">${esc(l.em)}</div>
          ${d&&d.subject?`<div style="font-size:10.5px;color:var(--dim)">${esc(d.subject)}</div>`:""}</span>
        <span class="vl">${d?(d.needs?"blocked ▸":"read ▸"):(P.busy?"writing…":"not written")}</span></div>`;
    }).join("")
      :'<div class="say" style="color:var(--dim)">Nothing here.</div>';
  }

  return `<div class="sec">${chips}</div>
    <div class="sec">${body}</div>
    <div class="sec">
      <button class="qa" id="draftRun"${P.busy?" disabled":""}>${P.busy?"Writing… a few minutes":"▸ Write the missing ones"}</button>
      ${P.err?`<div class="say" style="color:var(--warn);margin-top:8px">${esc(P.err)}</div>`:""}
      <div class="say" style="color:var(--dim);margin-top:8px">${rows.length} of ${DATA.leads.length} leads have an address. That ratio, not the writing, is what caps this channel — the 5am enrichment is what moves it.</div>
    </div>`;
}

let OFFERBAR=localStorage.getItem("mdp-offerbar")!=="0";
/* The one number that decides whether this month works. 150 dials a day is
   the target; everything else on this screen is downstream of it. Counted off
   pipeline.md, so it survives a reload and cannot be fudged. */
const DAILY_TARGET=150;
const todayStr=()=>new Date().toISOString().slice(0,10);
function dialedToday(){
  const d=todayStr();
  // Saved calls, plus the ones still queued because the bridge was unreachable.
  // A call that happened counts whether or not the tunnel was up for it —
  // reading zero after sixty dials is worse than useless.
  const saved=DATA.leads.filter(l=>(l.last||"").startsWith(d)&&(l.last||"").slice(10).trim()
    &&(l.last||"").slice(10).trim()!=="sourced").map(l=>l.co);
  const set=new Set(saved);
  LEADQ.forEach(q=>{if((q.at||"").slice(0,10)===d)set.add(q.company);});
  return set.size;
}
function targetBar(){
  const n=dialedToday(),pct=Math.min(100,Math.round(n/DAILY_TARGET*100));
  const col=n>=DAILY_TARGET?"var(--ok)":n>=DAILY_TARGET*0.5?"var(--acc)":"var(--warn)";
  return `<div class="tbar">
    <div class="tnum"><b style="color:${col}">${n}</b> <span>/ ${DAILY_TARGET} dials today</span></div>
    <div class="ttrack"><i style="width:${pct}%;background:${col}"></i></div>
    <div class="tsub">${n>=DAILY_TARGET?"Target hit.":`${DAILY_TARGET-n} to go`}${LEADQ.length?` · ${LEADQ.length} not saved yet`:""}</div>
  </div>`;
}
function offerBar(){
  return `<div class="obar">
    <div class="obh" data-obt="1">WHAT I SELL — pick ONE, from what he just said <span>${OFFERBAR?"▾":"▸"}</span></div>
    ${OFFERBAR?`<div class="obg">${OFFER.map(([n,,,,cue],i)=>
      `<div class="obi${i===0?" lead":""}"><b>${esc(n)}</b><span>${esc(cue)}</span></div>`).join("")}</div>`:""}
  </div>`;
}
let SCF="offer";   // offer | openers | objections

function scriptsPanel(){
  const P=[["“We answer our own phones”","“Good — then this never fires. It only picks up the ones that get away from you. If you catch every single call it sits there doing nothing.”"],
  ["“Not interested”","“Fair enough. Different question — what happens to the leads from six months ago that never booked? That's the one that costs nothing to fix.”"],
  ["“Just send me info”","“The demo IS the info — nothing to read. Call it, throw a fake emergency at it, 90 seconds.”"],
  ["“We already have someone”","“Does that person answer at 2am on a Sunday, or does it roll to voicemail? Not a knock — nobody's up at 2am. That's the gap.”"],
  ["“We have a system already”","“What's it doing wrong? Most guys who tell me that are already annoyed with it — if yours is perfect I'll leave you alone.”"],
  ["“How much is it?”","“$500 a month, and I'm waiving setup for the first three shops — but hear it first, then price is easy.”"]];

  const chip=(k,l)=>`<span class="chip" data-scf="${k}" style="cursor:pointer;${SCF===k?"border-color:var(--acc);background:rgba(79,195,247,.2)":""}">${l}</span>`;
  const chips=`<div class="sec">${chip("offer","What I sell")}${chip("openers","Openers")}${chip("objections","Comebacks")}</div>`;

  if(SCF==="offer"){
    return chips+`<div class="sec"><div class="slb">What I sell <span>$500/mo · $600 with a site</span></div>
      <div class="say" style="color:var(--dim);margin-bottom:10px">Never read this list on a call. Pick the ONE that answers what he just said.</div>
      ${OFFER.map(([n,what,trigger,why],i)=>`<div style="margin-bottom:14px;padding-left:10px;border-left:2px solid ${i===0?"var(--ok)":"var(--line2)"}">
        <div class="say" style="color:var(--acc2);font-weight:600">${i+1}. ${esc(n)}${i===0?' <span style="color:var(--ok);font-size:10px;letter-spacing:.08em"> ← LEAD WITH THIS</span>':""}</div>
        <div class="say">${esc(what)}</div>
        <div class="say" style="color:var(--warn);font-size:12px;margin-top:3px">Say it when: ${esc(trigger)}</div>
        <div class="say" style="color:var(--dim);font-size:11.5px;margin-top:2px">${esc(why)}</div>
      </div>`).join("")}
      <div class="say" style="color:var(--dim);margin-top:4px">Setup $500, waived for the first 3 in exchange for case-study rights — they must go live that same week.</div></div>`;
  }
  if(SCF==="objections"){
    return chips+`<div class="sec"><div class="slb">When they push back</div>
      ${P.map(([a,b])=>`<div style="margin-bottom:10px"><div class="say" style="color:var(--acc2)">${esc(a)}</div><div class="say">${esc(b)}</div></div>`).join("")}</div>`;
  }
  return chips+`<div class="sec"><div class="slb">The opener</div><div class="say">“Not a pitch, quick: when a water call hits at 2am and drops to voicemail, that job's gone. I built a line that answers those. Call it — 90 seconds.”</div></div>
  <div class="sec"><div class="slb">If he says he answers his own phones</div><div class="say">“Good — then this never fires. It only picks up the ones that get away from you.”</div></div>
  <div class="sec"><div class="slb">Reactivation open (no new spend)</div><div class="say">“What happens to the leads from six months ago that never booked? You already paid for those. That's the one that costs nothing to try.”</div></div>
  <div class="sec"><div class="slb">Demo line</div><div class="say"><a class="tel" href="tel:+13148879824" style="font-size:15px">(314) 887-9824</a> — the demo is the sale.</div></div>`;
}
function notesPanel(){
  const ks=Object.keys(NOTES).filter(k=>NOTES[k]);
  return `<div class="sec"><div class="slb">Local capture <span>${ks.length} companies</span></div>
    ${ks.length?ks.map(k=>`<div style="margin-bottom:9px"><div class="say" style="color:var(--acc2)">${esc(k)}</div><div class="say" style="white-space:pre-wrap">${esc(NOTES[k])}</div></div>`).join(""):'<div class="say" style="color:var(--dim)">Nothing captured on this device yet.</div>'}</div>
  <div class="sec"><div class="slb">Queue</div><div class="say">
    ${OUTBOX.length||LEADQ.length
      ?`${OUTBOX.length?OUTBOX.length+" note(s)":""}${OUTBOX.length&&LEADQ.length?" and ":""}${LEADQ.length?`<b style="color:var(--warn)">${LEADQ.length} outcome(s)</b>`:""} waiting for the bridge. Nothing is lost — they send themselves when it reconnects.`
      :"Nothing queued — everything synced."}</div>
    ${LEADQ.length?`<div class="say" style="color:var(--dim);margin-top:6px">${LEADQ.map(q=>esc(q.company)+" — "+esc((q.outcome||[]).join(", "))).join("<br>")}</div>
    <button class="qa" id="flushQ" style="margin-top:8px">▸ Try sending now</button>
    <button class="qa" id="copyQ" style="margin-top:6px">▸ Copy it all out (works with the bridge down)</button>
    <textarea class="draft" id="qOut" style="display:none;min-height:200px;margin-top:8px" readonly onclick="this.select()"></textarea>`:""}</div>
  <div class="sec"><button class="qa" data-act="csv">▸ Export leads + notes CSV</button></div>`;
}
/* Every agent that exists, and the one line that says when it fires. If an
   agent is not on this list it is not running — that is the point of the
   list. Kept in the order they run at 5:00. */
const AGENTS=[
  ["lead-research","Sources new prospects, then fills the owner name and Email column from the same page visit.","5:00, steps 1–2"],
  ["check-phones","Not an agent — plain code wrapping lead-research. Finds missing numbers, quarantines what it cannot verify.","5:00, step 3"],
  ["notes","Pushes every change since the last run into the Notion Call Log.","5:00, step 4"],
  ["call-prep","Researches a booked prospect and writes the pre-call brief.","On a booking"],
  ["prep-review","Gates every brief. Kills anything undeliverable or unverified, sends it back until it passes.","After call-prep"],
  ["email-drafter","One ready-to-send email per lead with a real address. Never invents one.","5:00, step 5"],
  ["sales-assistant","Interactive: scripts, objections, call and demo review. Not part of the 5:00 run.","On request"],
];

function managerPanel(){
  const S=DATA.status,m=S&&S.manager;
  const noEmail=DATA.leads.filter(l=>!l.em).length;
  const noPhone=DATA.leads.filter(l=>!l.p).length;
  const agents=AGENTS.map(([n,what,when])=>`<div class="sr">
      <span class="sd" style="background:var(--acc);box-shadow:0 0 8px var(--acc)"></span>
      <span class="nm"><b>${esc(n)}</b><div style="font-size:10.5px;color:var(--dim)">${esc(what)}</div></span>
      <span class="vl" style="white-space:nowrap">${esc(when)}</span></div>`).join("");

  return `<div class="sec"><div class="slb">The 5:00 run</div><div class="say">
    1. <b>lead-research</b> sources the day's new prospects into pipeline.md.<br>
    2. <b>lead-research</b> enriches up to 15 — owner name and email, same visit.<br>
    3. <b>check-phones</b> finds missing numbers, quarantines the unfindable.<br>
    4. <b>notes</b> pushes every change into the Notion Call Log.<br>
    5. <b>email-drafter</b> writes an email for every new address.<br>
    Then the dial list and any missing call briefs, hottest first.</div></div>

  <div class="sec"><div class="slb">Agents <span>${AGENTS.length}</span></div>${agents}</div>

  <div class="sec"><div class="slb">Data gaps</div><div class="say">
    No phone: <b style="color:${noPhone?"var(--warn)":"var(--ok)"}">${noPhone}</b> of ${DATA.leads.length} — step 3 works these.<br>
    No email: <b style="color:${noEmail?"var(--warn)":"var(--ok)"}">${noEmail}</b> of ${DATA.leads.length} — this is what caps the email channel.<br>
    Quarantined: <b>${DATA.unreachable}</b> under <span style="font:11px var(--mono)">## Unreachable</span>, no number found.</div>
    ${DATA.unreachable?'<div class="say" style="color:var(--dim);margin-top:6px">Nothing was deleted. Move a row back above <span style="font:11px var(--mono)">## Won</span> if a number turns up.</div>':""}</div>

  <div class="sec"><div class="slb">Status</div><div class="say">
    Job: <b>com.mdp.agency.manager</b> (launchd)<br>
    Last run: ${m?esc(new Date(m.lastRun).toLocaleString()):"never"}<br>
    Log: logs/manager.log${m?` · ${m.size} bytes`:""}</div></div>

  <div class="sec"><div class="slb">Guardrail</div><div class="say" style="color:var(--dim)">
    A permission gate reviews every command run from a Claude session and asks
    before anything that could hurt the Mac or the business. It does not cover
    the 5:00 scripts — those run outside it, which is why they only ever move
    rows and never delete one.</div></div>

  <div class="sec"><div class="slb">Caveat</div><div class="say" style="color:var(--dim)">launchd cannot run on a sleeping Mac. If it's asleep at 5:00 the job runs on next wake.</div></div>`;
}
function openSheet(id){
  const[nm,sub,fn]=SHEET[id];
  $("shName").textContent=nm;$("shSub").textContent=sub;$("shBody").innerHTML=fn();
  $("scrim").classList.add("on");$("sheet").classList.add("on");wireSheet();
}
function wireSheet(){
  const b=$("shBody");
  b.querySelectorAll(".ntbtn").forEach(x=>x.onclick=()=>{
    const ta=b.querySelector(`textarea[data-co="${x.dataset.co}"]`);
    if(ta){ta.classList.toggle("hide");if(!ta.classList.contains("hide"))ta.focus();}});
  b.querySelectorAll("textarea[data-co]").forEach(ta=>ta.oninput=()=>{
    saveNote(ta.dataset.co,ta.value);
    const x=b.querySelector(`.ntbtn[data-co="${ta.dataset.co}"]`);if(x)x.classList.toggle("has",!!ta.value.trim());});
  b.querySelectorAll("[data-niche]").forEach(x=>x.onclick=()=>{
    LEAD_NICHE=x.dataset.niche;b.innerHTML=leadTable();wireSheet();});
  b.querySelectorAll("[data-brief]").forEach(x=>x.onclick=()=>openBrief(x.dataset.brief));
  b.querySelectorAll("[data-draft]").forEach(x=>x.onclick=()=>openDraft(x.dataset.draft));
  b.querySelectorAll("[data-back]").forEach(x=>x.onclick=()=>{
    if(x.dataset.back==="drafts"){DATA.drafts.open=null;repaintDrafts();}
    else{DATA.prep.open=null;repaintPrep();}});
  { const r=b.querySelector("#prepRun");  if(r)r.onclick=()=>runPrep(); }
  { const r=b.querySelector("#draftRun"); if(r)r.onclick=()=>runDrafts(); }
  b.querySelectorAll("[data-emf]").forEach(x=>x.onclick=()=>{
    EMF=x.dataset.emf;b.innerHTML=emailPanel();wireSheet();});
  b.querySelectorAll("[data-scf]").forEach(x=>x.onclick=()=>{
    SCF=x.dataset.scf;b.innerHTML=scriptsPanel();wireSheet();});
  b.querySelectorAll("[data-obt]").forEach(x=>x.onclick=()=>{
    OFFERBAR=!OFFERBAR;localStorage.setItem("mdp-offerbar",OFFERBAR?"1":"0");
    b.innerHTML=leadTable();wireSheet();});
  { const cq=b.querySelector("#copyQ"); if(cq)cq.onclick=()=>{
      const ta=b.querySelector("#qOut");
      ta.value=LEADQ.map(q=>`${q.company}\t${(q.outcome||[]).join(", ")}${q.due?"\tdue "+q.due:""}`).join("\n");
      ta.style.display="block"; ta.select();
      try{document.execCommand("copy");cq.textContent="▸ Copied — paste it to Claude";}
      catch(e){cq.textContent="▸ Select the text below and copy it";}
    }; }
  { const q=b.querySelector("#flushQ"); if(q)q.onclick=async()=>{
      q.disabled=true;q.textContent="Sending…";
      const r=await flushLeads();await flushOutbox();
      await hydrate();
      b.innerHTML=notesPanel();wireSheet();
      if(r.left)alert(`${r.left} still queued — the bridge is not reachable yet.`);}; }
  b.querySelectorAll("[data-called]").forEach(x=>x.onclick=()=>{
    CALLED=x.dataset.called;b.innerHTML=leadTable();wireSheet();});
  b.querySelectorAll("button.ocx").forEach(x=>x.onclick=()=>{
    const lead=DATA.leads.find(l=>l.co===x.dataset.co);if(!lead)return;
    const cur=outList(lead),o=x.dataset.o;
    const next=cur.includes(o)?cur.filter(v=>v!==o):[...cur,o];
    // Paint the toggle immediately; markLead puts it back if the save fails.
    x.classList.toggle("on");x.setAttribute("aria-pressed",String(!cur.includes(o)));
    markLead(x.dataset.co,next,x);});
  b.querySelectorAll("input.due").forEach(d=>d.onchange=()=>{
    const lead=DATA.leads.find(l=>l.co===d.dataset.co);
    markLead(d.dataset.co,outList(lead||{}),d,d.value);});
  b.querySelectorAll("th[data-sort]").forEach(h=>h.onclick=()=>{
    const k=h.dataset.sort;if(SORT.key===k)SORT.dir*=-1;else{SORT.key=k;SORT.dir=1;}
    b.innerHTML=leadTable();wireSheet();});
  b.querySelectorAll("[data-act]").forEach(x=>x.onclick=()=>act(x.dataset.act));
}
function closeAll(){["scrim","sheet","chat"].forEach(i=>$(i).classList.remove("on"));}
$("scrim").onclick=closeAll;$("shX").onclick=closeAll;$("chX").onclick=closeAll;
addEventListener("keydown",e=>{if(e.key==="Escape")closeAll();});

/* ============ actions ============ */
function exportCSV(){
  const rows=[["Company","Contact / Owner","Phone","Stage","Note"]];
  DATA.leads.forEach(l=>rows.push([l.co,(l.c||"").replace(/·/g,"-"),l.p||"",l.st||"new",NOTES[l.co]||""]));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const u=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=u;a.download="mdp-leads.csv";a.click();URL.revokeObjectURL(u);
}
function act(a){
  if(a==="csv")return exportCSV();
  if(a==="leads")return openSheet("lead");
  if(a==="notion")return window.open("https://www.notion.so/"+((DATA.status&&DATA.status.db)||"").replace(/-/g,""),"_blank");
  if(a==="log"){openChat();$("cinp").value="log ";$("cinp").focus();}
}
document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act));
$("addThought").onclick=async()=>{
  const t=prompt("New CEO thought:");if(!t)return;
  THOUGHTS=[{id:uid(),text:t,at:iso()},...(THOUGHTS||[])].slice(0,8);
  cacheState();paint();
  await pushState();paint();
};

/* ============ chat ============ */
const logEl=$("log"),cinp=$("cinp");let seeded=false;
let CEO_SESSION=localStorage.getItem("mdp-ceo-session")||null;
function openChat(){$("chat").classList.add("on");
  if(!seeded){add("ai","<b>CEO:</b> Ask me anything about the business — I read your files. Or log a call: <code>log Rapid Dry — no answer</code>");seeded=true;}
  setTimeout(()=>cinp.focus(),150);}
function add(cls,html){const d=document.createElement("div");d.className="msg "+cls;d.innerHTML=html;
  logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;return d;}
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>").replace(/\n/g,"<br>");
const normCo=s=>String(s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function matchCo(q){const k=normCo(q);if(!k)return null;const L=DATA.leads;
  return L.find(l=>normCo(l.co)===k)||L.find(l=>normCo(l.co).startsWith(k))||L.find(l=>normCo(l.co).includes(k))||null;}
async function flushOutbox(){let sent=0;
  while(OUTBOX.length){
    try{const r=await bfetch("/note",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(OUTBOX[0])});
      if(!r.ok)break;const j=await r.json();
      if(j.results&&j.results[0]&&j.results[0].action==="error")break;
      OUTBOX.shift();sent++;}catch(e){break;}}
  saveOutbox();return{sent,left:OUTBOX.length};}
async function logCall(rest){
  const parts=rest.split(/\s+[—–-]{1,2}\s+|\s*:\s+/);
  const who=parts.shift().trim(),what=parts.join(" — ").trim();
  const lead=matchCo(who);
  if(!lead)return add("ai",`<b>Notes:</b> Nothing matches “${esc(who)}”. Use the name as it reads in Leads.`);
  if(!what)return add("ai",`<b>Notes:</b> Matched <b>${esc(lead.co)}</b> — what happened?`);
  appendNote(lead.co,what);
  OUTBOX.push({company:lead.co,note:what,contact:lead.c||"",phone:lead.p||""});saveOutbox();
  add("ai",`<b>Notes:</b> Logged <b>${esc(lead.co)}</b> — “${esc(what)}”.`);
  const r=await flushOutbox();
  add("ai",r.sent?`<b>Notes:</b> Sent to Notion${r.left?` · ${r.left} queued`:""}.`
    :`<b>Notes:</b> Bridge offline — ${r.left} queued.`);
  hydrate();
}
async function askCEO(q){
  const el=add("ai","<b>CEO:</b> <i>thinking…</i>");
  try{
    const r=await bfetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:q,session:CEO_SESSION})});
    const j=await r.json();if(j.error)throw new Error(j.error);
    if(j.session){CEO_SESSION=j.session;localStorage.setItem("mdp-ceo-session",CEO_SESSION);}
    el.innerHTML="<b>CEO:</b> "+fmt(j.text||"(no reply)");
  }catch(e){el.innerHTML="<b>CEO:</b> bridge offline — start it with <code>node notes-bridge.js</code>";}
  logEl.scrollTop=logEl.scrollHeight;
}
function send(q){if(!q.trim())return;add("me",esc(q));cinp.value="";
  const m=q.match(/^\s*(?:log|note)\s+(.+)$/i);
  if(m)return void setTimeout(()=>logCall(m[1]),150);
  askCEO(q);}
$("csend").onclick=()=>send(cinp.value);
cinp.onkeydown=e=>{if(e.key==="Enter")send(cinp.value);};

/* ============ boot ============ */
setInterval(()=>{const d=new Date();
  $("clock").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"}).toUpperCase()
    +"   "+d.toLocaleTimeString();},1000);
setTimeout(()=>{const h=$("hint");if(h)h.style.opacity="0";},8000);
resize();requestAnimationFrame(frame);hydrate();flushOutbox();
setInterval(hydrate,15000);
</script>

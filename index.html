 {id:"core",name:"Command",one:"runs it all",col:"#5ad8ff",core:true,rf:.15,n:800,sp:.16,stage:"live",chip:"BRAIN"},

    halo.addColorStop(0,`rgba(40,90,120,${.18*(1-fp)})`);halo.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=halo;ctx.beginPath();ctx.arc(coreX,coreY,M*.5,0,7);ctx.fill();}

    const x=sx+(coreX-sx)*p.t,y=sy+(coreY-sy)*p.t;const[R,G,B]=hx(p.s.col);
    ctx.fillStyle=`rgba(${R},${G},${B},${(p.s.active?.6:.28)*(1-Math.abs(p.t-.5))*(1-fp)})`;ctx.beginPath();ctx.arc(x,y,1.5,0,7);ctx.fill();});
  // spheres
  SPH.forEach(s=>{
    const P=pose(s);const cx=P.x,cy=P.y,R0=P.R;
    const hd=(mouse.in&&!open)?Math.hypot(mouse.x-cx,mouse.y-cy):999;s.hov+=((hd<R0*1.4?1:0)-s.hov)*.15;
    s.pulse=Math.max(0,s.pulse-dt*1.4);if(!reduce)s.rot+=s.sp*dt;
    const breathe=reduce?1:(1+.035*Math.sin(t/900+s.ph)+s.pulse*.12);const R=R0*breathe;
    const base=P.a;const bright=base*(.7+s.hov*.55+s.pulse*.5);const[Rc,Gc,Bc]=hx(s.col);
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.7);
    g.addColorStop(0,`rgba(${Rc},${Gc},${Bc},${(s.active?.22:.1)*(1+s.hov)})`);g.addColorStop(.5,`rgba(${Rc},${Gc},${Bc},${.05*base})`);g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*1.7,0,7);ctx.fill();
    if(s.core){const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,R*.5);cg.addColorStop(0,`rgba(230,250,255,${.5+s.hov*.3})`);cg.addColorStop(1,"rgba(90,216,255,0)");ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,R*.5,0,7);ctx.fill();}
    const cosR=Math.cos(s.rot),sinR=Math.sin(s.rot),cosT=Math.cos(.42),sinT=Math.sin(.42);
    for(let i=0;i<s.pts.length;i++){let[x,y,z]=s.pts[i];let x1=x*cosR-z*sinR,z1=x*sinR+z*cosR;let y1=y*cosT-z1*sinT,z2=y*sinT+z1*cosT;
      const persp=1/(1-z2*.34);const sx=cx+x1*R*persp,sy=cy+y1*R*persp;const depth=(z2+1)/2;
      const size=(0.5+depth*1.7)*(R0/70)*(s.active?1:.8);ctx.fillStyle=`rgba(${Rc},${Gc},${Bc},${(0.1+depth*0.9)*bright})`;ctx.fillRect(sx-size/2,sy-size/2,size,size);}
    if(s.core){const r2=s.rot*-1.3,cR=Math.cos(r2),sR=Math.sin(r2);
      for(let i=0;i<s.pts.length;i+=2){let[x,y,z]=s.pts[i];let x1=x*cR-z*sR,z1=x*sR+z*cR;let y1=y*cosT-z1*sinT,z2=y*sinT+z1*cosT;
        const persp=1/(1-z2*.34);const sx=cx+x1*R*.62*persp,sy=cy+y1*R*.62*persp;const depth=(z2+1)/2;ctx.fillStyle=`rgba(200,240,255,${(0.06+depth*.4)*bright})`;ctx.fillRect(sx-1,sy-1,1.6,1.6);}}
    if(s.id===focusId&&fp>.2){for(let k=0;k<8;k++){const a=t/1500+k*Math.PI/4,rr=R*1.55,sx2=cx+Math.cos(a)*rr,sy2=cy+Math.sin(a)*rr*.5;ctx.fillStyle="rgba("+Rc+","+Gc+","+Bc+","+(.6*fp)+")";ctx.beginPath();ctx.arc(sx2,sy2,2,0,7);ctx.fill();}}
  });
  ctx.globalCompositeOperation="source-over";
  requestAnimationFrame(frame);
}

function renderKpis(){document.getElementById("k-mrr").innerHTML=DATA.kpis.mrr+'<small>/10k</small>';document.getElementById("k-leads").textContent=DATA.kpis.leads;
  document.getElementById("k-dials").innerHTML=DATA.kpis.dials.split("/")[0]+'<small>/'+DATA.kpis.dials.split("/")[1]+'</small>';document.getElementById("k-clients").textContent=DATA.kpis.clients;
  if(byId.lead.el)byId.lead.el.querySelector(".chip").textContent=DATA.kpis.leads;}
async function hydrate(){try{const pipe=await fetch("pipeline.md",{cache:"no-store"});if(!pipe.ok)throw 0;const txt=await pipe.text();
  const counts={};STAGES.forEach(s=>counts[s[0]]=0);let won=false;
  txt.split("\n").forEach(line=>{if(/^##\s*Won/i.test(line))won=true;if(won||!line.startsWith("|"))return;const c=line.split("|").map(x=>x.trim());if(c.length<4)return;STAGES.forEach(s=>{if(c[3].toLowerCase()===s[0])counts[s[0]]++;});});
  if(Object.values(counts).some(v=>v>0)){DATA.pipeline=counts;DATA.kpis.leads=Object.values(counts).reduce((a,b)=>a+b,0)||DATA.kpis.leads;}
  const met=await fetch("metrics.md",{cache:"no-store"});if(met.ok){const rows=(await met.text()).split("\n").filter(l=>l.startsWith("|")&&!/Week of|:---/.test(l));const last=rows[rows.length-1];if(last){const c=last.split("|").map(x=>x.trim());if(c.length>=9)DATA.kpis.mrr=c[7]||DATA.kpis.mrr;}}
  document.getElementById("liveTxt").textContent="live · reading your files";renderKpis();
}catch(e){document.getElementById("liveTxt").textContent="snapshot";}}
resize();renderKpis();requestAnimationFrame(frame);hydrate();

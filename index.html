<title>MDP Enterprises — Command</title>
<style>
  :root{
    --core:#5ad8ff; --lead:#37e6a4; --sales:#ff6bb0; --store:#ffc24d; --engine:#6f9dff;
    --tiktok:#ff8a5c; --voice:#43dbe6; --appt:#a99bff; --clone:#d07bff;
    --ink:#f0f5fc; --dim:#9fb0cc; --faint:#647691;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(130% 100% at 50% 40%, #101827 0%, #0a1019 45%, #05070c 100%);}
  #wrap{position:fixed;inset:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;}

  /* labels overlay */
  #labels{position:absolute;inset:0;pointer-events:none;}
  .lbl{position:absolute;transform:translate(-50%,0);text-align:center;pointer-events:auto;cursor:pointer;white-space:nowrap;}

  .lbl .one{font-size:10.5px;color:var(--dim);margin-top:2px;}
  .lbl .chip{display:inline-block;margin-top:4px;font-family:ui-monospace,monospace;font-size:10px;font-weight:700;
    padding:2px 8px;border-radius:99px;background:#0e1826;border:1px solid #223349;}
  .lbl.soon{opacity:.6;} .lbl.soon .chip{color:#8391a8;border-color:#2a3549;}

  /* HUD */
  .hud{position:absolute;left:0;top:0;right:0;padding:16px 20px;z-index:20;pointer-events:none;
    display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .brand .tag{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--core);opacity:.85;}
  .brand h1{margin:4px 0 0;font-size:20px;font-weight:700;}
  .brand .st{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--faint);margin-top:5px;display:flex;align-items:center;gap:6px;}
  .brand .st i{width:6px;height:6px;border-radius:99px;background:var(--lead);box-shadow:0 0 8px var(--lead);animation:bp 2s infinite;}
  @keyframes bp{50%{opacity:.35}}
  .kbar{display:flex;gap:1px;border:1px solid #22344e;border-radius:12px;overflow:hidden;background:#22344e;pointer-events:auto;}
  .kbar .k{background:#0a121e;padding:9px 14px;text-align:right;min-width:68px;}
  .kbar .k .v{font-family:ui-monospace,monospace;font-size:17px;font-weight:700;line-height:1;}
  .kbar .k .v small{font-size:10px;color:var(--faint);font-weight:400;}
  .kbar .k .l{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:5px;}
  .kbar .mrr .v{color:var(--core);} .kbar .leads .v{color:var(--lead);} .kbar .dials .v{color:var(--store);} .kbar .clients .v{color:var(--sales);}

  /* drawer — plain english */
  .scrim{position:fixed;inset:0;background:rgba(2,4,9,.62);backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s;}
  .scrim.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(500px,100%);z-index:50;background:#070c15;border-left:1px solid #1c2a40;
    transform:translateX(100%);transition:transform .34s cubic-bezier(.2,.9,.2,1);overflow-y:auto;box-shadow:-24px 0 70px rgba(0,0,0,.6);}
  .drawer.open{transform:translateX(0);}
  .d-head{position:sticky;top:0;background:linear-gradient(#070c15,rgba(7,12,21,.9));backdrop-filter:blur(8px);padding:22px 24px 16px;border-bottom:1px solid #1c2a40;}

  .d-body{padding:20px 24px 60px;}
  .sec{margin-top:24px;} .sec:first-child{margin-top:6px;}
  .s-lbl{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:11px;letter-spacing:.01em;}
  .say{background:#0c1420;border:1px solid #1a2739;border-radius:13px;padding:14px 15px;margin-bottom:9px;font-size:13.5px;color:#d7e6f7;line-height:1.6;} .say b{color:#fff;}
  .big{font-family:ui-monospace,monospace;font-size:30px;font-weight:700;letter-spacing:-.01em;}

  .lead{display:flex;align-items:center;gap:11px;background:#0c1420;border:1px solid #1a2739;border-radius:12px;padding:10px 12px;margin-bottom:7px;}

  .lead .td{width:7px;height:7px;border-radius:99px;flex:none;}

  .push .q{font-size:13px;font-weight:700;color:var(--sales);} .push .a{font-size:13px;color:#d7e6f7;margin-top:5px;line-height:1.55;}
  .script{background:#0c1420;border:1px solid #1a2739;border-radius:12px;padding:13px 14px;margin-bottom:8px;}
  .script .sh{display:flex;align-items:center;justify-content:space-between;gap:8px;} .script .sw{font-size:13px;font-weight:700;} .script .sc{font-size:11px;color:var(--faint);font-family:ui-monospace,monospace;}
  .script a.tel{font-family:ui-monospace,monospace;font-size:12px;color:var(--lead);text-decoration:none;border-bottom:1px solid #2a5c48;}
  .script .op{font-size:13px;color:#e2edf9;line-height:1.65;margin-top:10px;}
  .script .vm{font-size:11.5px;color:var(--dim);line-height:1.55;margin-top:9px;} .script .vm b{color:var(--faint);font-weight:700;font-size:9px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:3px;}
  .script .flag{font-size:11px;color:var(--store);margin-top:8px;}
  .fr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #141f30;} .fr:last-child{border-bottom:none;}
  .fr .fl{font-size:13px;} .fr .fm{font-size:11px;color:var(--faint);margin-top:2px;}
  .badge{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:99px;white-space:nowrap;}
  .badge.on{background:rgba(55,230,164,.14);color:var(--lead);} .badge.warn{background:rgba(255,194,77,.14);color:var(--store);} .badge.empty{background:rgba(95,113,145,.2);color:var(--dim);}
  .bars{display:flex;flex-direction:column;gap:6px;}
  .bar{display:flex;align-items:center;gap:10px;font-size:12.5px;} .bar .bn{width:96px;color:var(--dim);} .bar .bt{flex:1;height:16px;border-radius:5px;background:#0c1420;border:1px solid #1a2739;position:relative;overflow:hidden;} .bar .bt>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--core),rgba(90,216,255,.2));} .bar .bv{width:22px;text-align:right;font-family:ui-monospace,monospace;font-weight:700;}
  a.link{color:var(--core);font-size:12.5px;text-decoration:none;border-bottom:1px solid rgba(90,216,255,.35);}
  @media(max-width:640px){.hud{flex-direction:column;} .kbar{align-self:stretch;} .kbar .k{flex:1;} .drawer{width:100%;} .lbl .one{display:none;}}
</style>

<script>
// ===== DATA =====
const DATA={kpis:{mrr:"$0",leads:25,dials:"0/10",clients:0},pipeline:{new:10,contacted:0,replied:0,booked:0,"call held":0,proposal:0,won:0}};
const STAGES=[["new","Ready to call"],["contacted","Called"],["replied","Replied"],["booked","Booked"],["call held","Call done"],["proposal","Proposal sent"],["won","Won"]];
const T={strong:"#37e6a4",good:"#ffc24d",weak:"#9fb0cc",low:"#ff8a5c"};
const LEADS=[[1,"Rapid Dry STL","Cottleville, MO · Grant, Ops Mgr","3142918888","strong"],[2,"Premier Restoration","Andover, KS · Justin, Owner","3163914400","strong"],[3,"Vortex Restoration","Derby, KS · Matt & Natalie","3165414362","strong"],[4,"Fast Restoration","Lake St. Louis, MO · Terry","6366813200","strong"],[5,"Sage Restoration","Shawnee, KS · check their 24/7 claim","9139050500","strong"],[6,"Power Dry","Lenexa, KS · Greg & Ed","9135861545","strong"],[7,"Pride Cleaning & Rest.","St. Louis, MO · ask who owns it","3146681223","good"],[8,"Kelley Klean","Columbia, MO · ask who owns it","5732140990","good"],[9,"Five One Five Rest.","Des Moines, IA · ask who owns it","5154521876","good"],[10,"Omaha Damage Repair","Omaha, NE · confirm new owner","4027044921","good"],[11,"Cleaning Rest. Svcs","Tulsa, OK","9187100609","good"],[12,"Kwik Dry LLC","Springfield, MO","4177256978","good"],[13,"STL Cleaning & Rest.","St. Louis, MO","3144391665","good"],[14,"Smoke Services Rest.","Marissa, IL","6182349696","good"],[15,"Arkansas Restoration","N. Little Rock, AR","5017533600","good"],[16,"Burggraf Disaster","Tulsa, OK","9185843737","good"],[17,"Best Option KC","Kansas City","","weak"],[18,"ABC Environmental","Columbia, MO","","weak"],[19,"Midwest Flood","St. Louis, MO","","weak"],[20,"Restoration Solutions","Springfield, MO","","weak"],[21,"Mr. Power Clean","Springfield, MO","","weak"],[22,"Water Damage 24","Little Rock, AR","","weak"],[23,"Patriot Water Damage","Tulsa, OK","","weak"],[24,"Elite Restoration","W. Des Moines, IA","","weak"],[25,"Mr. Restore","Dallas–Fort Worth, TX","8776317576","low"]];
const PUSH=[["“Not interested”","“Most guys say that till they hear it handle a real 2am water call. Two minutes — call the number and decide for yourself.”"],["“Just send me info”","“The demo IS the info — nothing to read. Call it, throw a fake emergency at it, 90 seconds.”"],["“We already have someone”","“Does a real person pick up at 2am, or does it go to voicemail? This never sleeps and books the job.”"],["“How much is it?”","“$500 a month, and I'm waiving setup for the first three shops — but hear it first, then price is easy.”"]];
const OPENERS=[[1,"Grant","Rapid Dry STL","3142918888",null,"Hey Grant — not a pitch, quick. 288 five-star reviews means calls all day; I'd bet the after-hours ones drop to voicemail. When a water job hits at 2am and nobody picks up, it's gone to whoever answered. I built a line that answers those and books them. Call it yourself — 90 seconds. Want the number?","Grant, it's [YOU] at Rapid Dry — built a line that answers after-hours emergencies so a 2am water job doesn't slip to voicemail. Call [DEMO #]."],[2,"Justin","Premier Restoration","3163914400",null,"Hey Justin — quick, not a pitch. Your site says you personally oversee every job — so you're answering at 2am too. When you're on a job or asleep, that call goes to whoever picks up next. I built a line that answers those and books them. Call it, 90 seconds.","Justin, it's [YOU]. You run every job personally — this answers your after-hours calls. Call [DEMO #]."],[3,"Matt","Vortex Restoration","3165414362",null,"Hey Matt — quick one. You and Natalie built 400-plus reviews, but a husband-and-wife shop can't catch every 2am water call, and that job goes to whoever does. I built a line that answers those and books them. Call it — 90 seconds.","Matt, it's [YOU] — catches the after-hours calls you and Natalie can't get to. Call [DEMO #]."],[4,"Terry","Fast Restoration","6366813200",null,"Hey Terry — not a pitch. You promise 24/7/365 — who picks up at 2am? If it's voicemail, that water job's gone. I built a line that answers those and books them. Call it — 90 seconds.","Terry, it's [YOU] — you promise 24/7, this makes it true after hours. Call [DEMO #]."],[5,"Alan","Sage Restoration","9139050500","They advertise ‘live dispatch 24/7’ — ask if that's real before you pitch.","Hey Alan — quick one. Your site says live dispatch 24/7 — real person at 2am, or a service? I built a line that answers after-hours water calls and books them, often cheaper. If your setup nails it, I'll leave you alone. Curious? Call it — 90 seconds.","Alan, it's [YOU] — a line that answers and books after-hours calls, often cheaper than a service. Call [DEMO #]."],[6,"Greg","Power Dry","9135861545",null,"Hey Greg — not a pitch. Water mitigation only since '88, so every after-hours call to voicemail is a big job walking to the next guy. If it's still you and Ed, you can't be on the phone at 2am. I built a line that answers and books those. Call it — 90 seconds.","Greg, it's [YOU] — every missed 2am call is a big job lost; this answers and books them. Call [DEMO #]."],[7,"—","Pride Cleaning & Rest.","3146681223","Ask who owns the shop before you pitch.","Hey — who owns the shop? ... 30-plus years in STL, your phone rings a lot — who picks up when a water call hits at 2am? If it's voicemail, that job's gone. I built a line that answers and books them. Call it — 90 seconds.","Hey, it's [YOU] for whoever owns Pride — answers your after-hours water calls. Call [DEMO #]."],[8,"—","Kelley Klean","5732140990","Ask who owns the shop.","Hey — who's the owner these days? ... Oldest restoration shop in Central Missouri, so tons of calls — I bet the after-hours ones roll to voicemail. I built a line that answers and books those. Call it — 90 seconds.","Hey, it's [YOU] for the owner of Kelley Klean — catches after-hours calls before voicemail. Call [DEMO #]."],[9,"—","Five One Five Rest.","5154521876","Ask if they're the owner.","Hey — are you the owner? ... You promise to respond in minutes, so it's you or a small crew — nobody catches every 2am call. I built a line that answers and books those. Call it — 90 seconds.","Hey, it's [YOU] for the owner of 515 — answers the after-hours calls you can't catch. Call [DEMO #]."],[10,"—","Omaha Damage Repair","4027044921","Confirm the current owner.","Hey — who owns the shop now? ... 140-plus reviews means a busy phone, and a small team misses the after-hours water calls. I built a line that answers and books those. Call it — 90 seconds.","Hey, it's [YOU] for whoever owns Omaha Damage Repair now — answers your after-hours calls. Call [DEMO #]."]];

// ===== SPHERES =====
const SPH=[
 {id:"core",name:"Command",one:"runs it all",col:"#5ad8ff",x:.5,y:.47,rf:.165,n:780,sp:.16,active:true,chip:"BRAIN"},
 {id:"lead",name:"Leads",one:"customers to call",col:"#37e6a4",x:.25,y:.30,rf:.078,n:230,sp:.34,active:true,chip:"25"},
 {id:"sales",name:"Scripts",one:"what to say",col:"#ff6bb0",x:.75,y:.30,rf:.078,n:230,sp:-.31,active:true,chip:"READY"},
 {id:"store",name:"Memory",one:"your business info",col:"#ffc24d",x:.75,y:.71,rf:.072,n:200,sp:.28,active:true,chip:"5 files"},
 {id:"engine",name:"Auto-Leads",one:"150 more every 5am",col:"#6f9dff",x:.25,y:.71,rf:.072,n:200,sp:-.26,active:true,chip:"5:00 AM"},
 {id:"tiktok",name:"TikTok",one:"daily videos",col:"#ff8a5c",x:.5,y:.9,rf:.05,n:100,sp:.3,active:false,chip:"SOON"},
 {id:"voice",name:"AI Caller",one:"calls for you",col:"#43dbe6",x:.91,y:.5,rf:.05,n:100,sp:-.3,active:false,chip:"SOON"},
 {id:"appt",name:"Booker",one:"sets appointments",col:"#a99bff",x:.09,y:.5,rf:.05,n:100,sp:.3,active:false,chip:"SOON"},
 {id:"clone",name:"AI Clone",one:"your face for content",col:"#d07bff",x:.35,y:.9,rf:.05,n:100,sp:-.3,active:false,chip:"SOON"},
];
// fibonacci unit sphere
const GA=Math.PI*(3-Math.sqrt(5));
SPH.forEach(s=>{s.pts=[];for(let i=0;i<s.n;i++){const y=1-(i/(s.n-1))*2,r=Math.sqrt(1-y*y),th=i*GA;s.pts.push([Math.cos(th)*r,y,Math.sin(th)*r]);}s.rot=Math.random()*6;s.ph=Math.random()*6;s.hov=0;s.pulse=0;});
const byId=Object.fromEntries(SPH.map(s=>[s.id,s]));

const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let W=0,H=0,DPR=1,M=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;M=Math.min(W,H);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);placeLabels();}
addEventListener("resize",resize);
function hx(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}

const mouse={x:-999,y:-999,in:false};
addEventListener("pointermove",e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.in=true;});
addEventListener("pointerleave",()=>mouse.in=false);
cv.addEventListener("pointerdown",e=>{const s=pick(e.clientX,e.clientY);if(s){s.pulse=1;openDrawer(s.id);}});
function pick(mx,my){let hit=null,best=1e9;SPH.forEach(s=>{const cx=s.x*W,cy=s.y*H,R=s.rf*M;const d=Math.hypot(mx-cx,my-cy);if(d<R*1.25&&d<best){best=d;hit=s;}});return hit;}

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let tPrev=0;
function frame(t){
  const dt=Math.min((t-tPrev)/1000||0,.05);tPrev=t;
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation="lighter";
  SPH.forEach(s=>{
    const cx=s.x*W,cy=s.y*H,R0=s.rf*M;
    const hd=mouse.in?Math.hypot(mouse.x-cx,mouse.y-cy):999;s.hov+=((hd<R0*1.3?1:0)-s.hov)*.15;
    s.pulse=Math.max(0,s.pulse-dt*1.4);
    if(!reduce)s.rot+=s.sp*dt;
    const breathe=reduce?1:(1+.035*Math.sin(t/900+s.ph)+s.pulse*.12);
    const R=R0*breathe;
    const base=s.active?1:.4;const bright=base*(.7+s.hov*.55+s.pulse*.5);
    const[Rc,Gc,Bc]=hx(s.col);
    // glow
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.7);
    g.addColorStop(0,`rgba(${Rc},${Gc},${Bc},${(s.active?.22:.1)*(1+s.hov)})`);g.addColorStop(.5,`rgba(${Rc},${Gc},${Bc},${.06*base})`);g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*1.7,0,7);ctx.fill();
    // hot center for core
    if(s.id==="core"){const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,R*.5);cg.addColorStop(0,`rgba(230,250,255,${.5+s.hov*.3})`);cg.addColorStop(1,"rgba(90,216,255,0)");ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,R*.5,0,7);ctx.fill();}
    // dots
    const cosR=Math.cos(s.rot),sinR=Math.sin(s.rot),tilt=.42,cosT=Math.cos(tilt),sinT=Math.sin(tilt);
    for(let i=0;i<s.pts.length;i++){let[x,y,z]=s.pts[i];
      let x1=x*cosR - z*sinR, z1=x*sinR + z*cosR;         // rotate Y
      let y1=y*cosT - z1*sinT, z2=y*sinT + z1*cosT;        // tilt X
      const persp=1/(1 - z2*.34);
      const sx=cx + x1*R*persp, sy=cy + y1*R*persp;
      const depth=(z2+1)/2;
      const size=(0.5 + depth*1.7)*(R0/70)*(s.active?1:.8);
      const a=(0.1 + depth*0.9)*bright;
      ctx.fillStyle=`rgba(${Rc},${Gc},${Bc},${a})`;
      ctx.fillRect(sx-size/2, sy-size/2, size, size);
    }
    // inner counter-sphere for core (denser feel)
    if(s.id==="core"){const r2=s.rot*-1.3;const cR=Math.cos(r2),sR=Math.sin(r2);
      for(let i=0;i<s.pts.length;i+=2){let[x,y,z]=s.pts[i];let x1=x*cR - z*sR, z1=x*sR + z*cR;let y1=y*cosT - z1*sinT, z2=y*sinT + z1*cosT;
        const persp=1/(1 - z2*.34);const sx=cx + x1*R*.62*persp, sy=cy + y1*R*.62*persp;const depth=(z2+1)/2;
        ctx.fillStyle=`rgba(200,240,255,${(0.06+depth*.4)*bright})`;ctx.fillRect(sx-1,sy-1,1.6,1.6);}}
  });
  ctx.globalCompositeOperation="source-over";
  requestAnimationFrame(frame);
}

// labels
const labels=document.getElementById("labels");
SPH.forEach(s=>{const d=document.createElement("div");d.className="lbl"+(s.active?"":" soon");d.dataset.id=s.id;
  d.innerHTML=`<div class="nm" style="color:${s.col}">${s.name}</div><div class="one">${s.one}</div><div class="chip" style="color:${s.col}">${s.chip}</div>`;
  d.addEventListener("click",()=>{byId[s.id].pulse=1;openDrawer(s.id);});labels.appendChild(d);s.el=d;});

// ===== HUD hydrate =====
function renderKpis(){document.getElementById("k-mrr").innerHTML=DATA.kpis.mrr+'<small>/10k</small>';document.getElementById("k-leads").textContent=DATA.kpis.leads;
  document.getElementById("k-dials").innerHTML=DATA.kpis.dials.split("/")[0]+'<small>/'+DATA.kpis.dials.split("/")[1]+'</small>';document.getElementById("k-clients").textContent=DATA.kpis.clients;
  byId.lead.chip=String(DATA.kpis.leads);if(byId.lead.el)byId.lead.el.querySelector(".chip").textContent=DATA.kpis.leads;}
async function hydrate(){try{const pipe=await fetch("pipeline.md",{cache:"no-store"});if(!pipe.ok)throw 0;const txt=await pipe.text();
  const counts={};STAGES.forEach(s=>counts[s[0]]=0);let won=false;
  txt.split("\n").forEach(line=>{if(/^##\s*Won/i.test(line))won=true;if(won||!line.startsWith("|"))return;const c=line.split("|").map(x=>x.trim());if(c.length<4)return;STAGES.forEach(s=>{if(c[3].toLowerCase()===s[0])counts[s[0]]++;});});
  if(Object.values(counts).some(v=>v>0)){DATA.pipeline=counts;DATA.kpis.leads=Object.values(counts).reduce((a,b)=>a+b,0)||DATA.kpis.leads;}
  const met=await fetch("metrics.md",{cache:"no-store"});if(met.ok){const rows=(await met.text()).split("\n").filter(l=>l.startsWith("|")&&!/Week of|:---/.test(l));const last=rows[rows.length-1];if(last){const c=last.split("|").map(x=>x.trim());if(c.length>=9)DATA.kpis.mrr=c[7]||DATA.kpis.mrr;}}
  document.getElementById("liveTxt").textContent="live · reading your files";renderKpis();
}catch(e){document.getElementById("liveTxt").textContent="snapshot";}}
resize();renderKpis();requestAnimationFrame(frame);hydrate();

  .pill.csv{color:var(--agency);background:rgba(61,255,176,.1);border:1.5px solid rgba(61,255,176,.4);}

    background:rgba(9,14,23,.97);border:1.5px solid var(--line2);border-radius:24px;opacity:0;pointer-events:none;transition:opacity .3s, transform .3s cubic-bezier(.2,.9,.2,1);box-shadow:0 40px 120px rgba(0,0,0,.75);overflow:hidden;}

  ctx.globalCompositeOperation="lighter";const ic=ctx.createRadialGradient(cx,cy,0,cx,cy,R0*.55);ic.addColorStop(0,`rgba(${R},${G},${B},${.8*op})`);ic.addColorStop(1,`rgba(${R},${G},${B},0)`);ctx.fillStyle=ic;ctx.beginPath();ctx.arc(cx,cy,R0*.55,0,7);ctx.fill();ctx.globalCompositeOperation="source-over";
}
function frame(t){const dt=Math.min((t-tPrev)/1000||0,.05);tPrev=t;
  WORLDS.forEach(w=>w.open+=((w.wantOpen?1:0)-w.open)*.16);
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createRadialGradient(W*.5,H*.52,0,W*.5,H*.52,Math.max(W,H)*.8);bg.addColorStop(0,"#0a1526");bg.addColorStop(.6,"#05070f");bg.addColorStop(1,"#03040a");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // trunks CEO -> world (tree limbs, tapered)
  const[ex,ey]=P(CEO);WORLDS.forEach(w=>{const[wx,wy]=P(w);tbranch(ex,ey,wx,wy,w.col,Math.max(4,RAD(w)*.5),2,.32+w.hov*.4);});
  // cross-world twigs
  CROSS.forEach(p=>{const[ax,ay]=P(p[0]),[bx,by]=P(p[1]);const op=Math.max(p[0].world?p[0].world.open:0,p[1].world?p[1].world.open:0);tbranch(ax,ay,bx,by,"#9fc0ff",2,2,.04+op*.4);});
  // world -> kid twigs
  WORLDS.forEach(w=>{if(w.open<.02)return;const[wx,wy]=P(w);w.kids.forEach(k=>{const[kx,ky]=P(k);tbranch(wx,wy,kx,ky,k.col,Math.max(2.5,RAD(w)*.28),1.5,(.15+w.open*.5));});});
  orb(CEO,t);WORLDS.forEach(w=>orb(w,t));WORLDS.forEach(w=>w.kids.forEach(k=>orb(k,t)));
  placeLabels();requestAnimationFrame(frame);
}

};

function reply(q){const s=q.toLowerCase();const ph=DATA.leadList.filter(l=>l.p).length;
  if(/hi|hey|hello|yo|sup/.test(s)&&s.length<12)return "<b>CEO:</b> Talk to me. Money, leads, scripts, or how we sell — what do you need?";
  if(/how many|lead|compan|call list/.test(s))return `<b>CEO:</b> <b>${DATA.kpis.leads}</b> companies in the pipeline, <b>${ph}</b> ready to dial. Hottest: ${DATA.leadList.slice(0,3).map(l=>l.co).join(", ")}. Open AI Agency → Leads.`;
  if(/sell|offer|service|receptionist|website|automation|b2b|pitch/.test(s))return "<b>CEO:</b> We sell three ways: <b>AI Receptionist</b> (24/7 answering — our restoration play), <b>Website AI</b> (chat + booking), and <b>B2B Outbound</b> (cold call now, email/DM/referrals next). Same offer, many doors. Open AI Agency to drill in.";
  if(/csv|export|dialer|download/.test(s))return "<b>CEO:</b> Hit <b> CSV</b> top-right — every company, phone, and note, ready for the dialer.";
  if(/note|log|track/.test(s))return "<b>CEO:</b> Open AI Agency → Notes, or tap  on any lead. It saves on your device and rides along in the CSV.";

  if(/say|script|opener|objection|push/.test(s))return "<b>CEO:</b> Open with — “Not a pitch, quick: when a water call hits at 2am and drops to voicemail, that job's gone. I built a line that answers those. Call it, 90 seconds.” Full scripts in AI Agency → Scripts.";
  if(/money|revenue|mrr|close|client/.test(s))return `<b>CEO:</b> <b>${DATA.kpis.mrr}</b> toward $10k, <b>${DATA.kpis.clients}</b> clients. Waive setup for the first 3, get them live in a week, turn them into case studies. Tap  Everything for the full picture.`;

  if(/tiktok|video|content/.test(s))return "<b>CEO:</b> Content world is mapped — Content Mgr → Story Writer → Video Creator → Analytics. Start with those 4.";
  if(/ecom|store|shopify|product/.test(s))return "<b>CEO:</b> Ecom is mapped — Store Mgr → Product → Storefront → Creative → Support. It's the next business after the agency's paying.";
  return "<b>CEO:</b> I can talk money, leads, scripts, how we sell, notes, CSV, or the 5am engine. Hit a button or ask again.";}

  set("k-mrr",DATA.kpis.mrr+'<small>/10k</small>',"m");set("k-leads",String(DATA.kpis.leads),"l");set("k-dials",DATA.kpis.dials.split("/")[0]+'<small>/'+DATA.kpis.dials.split("/")[1]+'</small>',"d");set("k-clients",String(DATA.kpis.clients),"c");

async function hydrate(){try{const pipe=await fetch("pipeline.md",{cache:"no-store"});if(!pipe.ok)throw 0;const txt=await pipe.text();
  const counts={};STAGES.forEach(s=>counts[s[0]]=0);const list=[];let won=false;
  txt.split("\n").forEach(line=>{if(/^##\s*Won/i.test(line))won=true;if(won||!line.startsWith("| "))return;const c=line.split("|").map(x=>x.trim());if(c.length<4||c[1]===""||c[1]==="Company")return;const st=c[3].toLowerCase();if(!STAGES.some(s=>s[0]===st))return;counts[st]++;if(st==="new"){const m=(c[2]||"").match(/\(?\d{3}\)?[ .-]?\d{3}[ .-]?\d{4}/);list.push({co:c[1],c:c[2],p:m?m[0]:""});}});
  if(list.length){DATA.pipeline=counts;DATA.kpis.leads=Object.values(counts).reduce((a,b)=>a+b,0);DATA.leadList=list;}
  const met=await fetch("metrics.md",{cache:"no-store"});if(met.ok){const rows=(await met.text()).split("\n").filter(l=>l.startsWith("|")&&!/Week of|:---/.test(l));const lr=rows[rows.length-1];if(lr){const c=lr.split("|").map(x=>x.trim());if(c.length>=9)DATA.kpis.mrr=c[7]||DATA.kpis.mrr;}}
  document.getElementById("liveTxt").innerHTML='LIVE · <b>'+DATA.kpis.leads+' leads</b> in your files';renderKpis();
}catch(e){document.getElementById("liveTxt").innerHTML='<b>'+DATA.kpis.leads+' leads</b> · snapshot';renderKpis();}}
setTimeout(()=>{const h=document.getElementById("hint");if(h)h.style.opacity="0";},7000);

const OPENERS=[[1,"Grant","Rapid Dry STL","3142918888",null,"Hey Grant — not a pitch, quick. 288 five-star reviews means calls all day; I'd bet the after-hours ones drop to voicemail. When a water job hits at 2am and nobody picks up, it's gone to whoever answered. I built a line that answers those and books them. Call it yourself — 90 seconds.","Grant, it's [YOU] at Rapid Dry — a line that answers after-hours emergencies. Call [DEMO #]."],[2,"Justin","Premier Restoration","3163914400",null,"Hey Justin — quick, not a pitch. Your site says you personally oversee every job — so you're answering at 2am too. That call goes to whoever picks up next. I built a line that answers those and books them. Call it, 90 seconds.","Justin, it's [YOU]. This answers your after-hours calls. Call [DEMO #]."],[3,"Matt","Vortex Restoration","3165414362",null,"Hey Matt — quick one. You and Natalie built 400-plus reviews, but a husband-and-wife shop can't catch every 2am call. I built a line that answers those and books them. Call it — 90 seconds.","Matt, it's [YOU] — catches the after-hours calls you can't get to. Call [DEMO #]."],[4,"Terry","Fast Restoration","6366813200",null,"Hey Terry — not a pitch. You promise 24/7/365 — who picks up at 2am? If it's voicemail, that job's gone. I built a line that answers those. Call it — 90 seconds.","Terry, it's [YOU] — makes your 24/7 true after hours. Call [DEMO #]."],[5,"Alan","Sage Restoration","9139050500","Ask if their ‘24/7 dispatch’ is a real person first.","Hey Alan — your site says live dispatch 24/7 — real person at 2am, or a service? I built a line that answers after-hours calls, often cheaper. Curious? Call it — 90 seconds.","Alan, it's [YOU] — answers after-hours calls, often cheaper than a service. Call [DEMO #]."],[6,"Greg","Power Dry","9135861545",null,"Hey Greg — water mitigation only since '88, so every after-hours call to voicemail is a big job lost. If it's still you and Ed, you can't be on the phone at 2am. Call it — 90 seconds.","Greg, it's [YOU] — this answers the big after-hours jobs you'd miss. Call [DEMO #]."]];

const DIVS={agency:{label:"AI Agency",note:"makes money now",dir:Math.PI,spread:2.4,col:"#3dffb0"},content:{label:"Content",note:"builds audience",dir:-Math.PI/2,spread:.9,col:"#ff9a5c"},ecom:{label:"Ecom",note:"future income",dir:0,spread:.9,col:"#ffd84d"},personal:{label:"Personal",note:"your life",dir:Math.PI/2,spread:.9,col:"#a9c0ff"}};

 {id:"sales",div:"agency",name:"Scripts",one:"what to say",col:"#ff6bb0",ico:"💬",live:1},
 {id:"store",div:"agency",name:"Memory",one:"business info",col:"#ffc24d",ico:"🗄️",live:1},
 {id:"engine",div:"agency",name:"Auto-Leads",one:"150 every 5am",col:"#6f9dff",ico:"⚙️",live:1},
 {id:"voice",div:"agency",name:"AI Caller",one:"calls for you",col:"#43dbe6",ico:"📞",live:0},
 {id:"appt",div:"agency",name:"Booker",one:"sets appts",col:"#a99bff",ico:"📅",live:0},
 {id:"tiktok",div:"content",name:"TikTok",one:"daily videos",col:"#ff9a5c",ico:"🎬",live:0},

 {id:"ecomstore",div:"ecom",name:"Ecom Store",one:"online shop",col:"#ffd84d",ico:"🛒",live:0},

const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));byId.core={id:"core",name:"Command",ico:"🧠",col:"#57e0ff",live:1};
Object.keys(DIVS).forEach(dk=>{const mem=NODES.filter(n=>n.div===dk),D=DIVS[dk];mem.forEach((n,i)=>{const f=mem.length===1?0:(i/(mem.length-1)-.5);n.ang=D.dir+f*D.spread;n.rad=.34+((i%2)?.11:0);});});

// ===== BUILD NETWORK =====
const net=document.getElementById("net"),wires=document.getElementById("wires");
const hub=document.createElement("div");hub.className="hub";hub.innerHTML='<span class="e">🧠</span><span class="t">Command</span>';
hub.addEventListener("click",()=>openModal("core"));net.appendChild(hub);
NODES.forEach(n=>{const el=document.createElement("div");el.className="node"+(n.live?"":" soon");el.style.setProperty("--nc",n.col);
  el.innerHTML=`<div class="badge">${n.ico}<span class="sd"></span></div><div class="nm">${n.name}</div><div class="on">${n.one}</div>`;
  el.addEventListener("click",()=>openModal(n.id));net.appendChild(el);n.el=el;});
const dls={};Object.keys(DIVS).forEach(dk=>{const D=DIVS[dk];const d=document.createElement("div");d.className="dlabel";d.style.color=D.col;d.innerHTML=`<b>${D.label}</b><small>${D.note}</small>`;net.appendChild(d);dls[dk]=d;});
function layoutNet(){const w=net.clientWidth,h=net.clientHeight,cx=w/2,cy=h/2,M=Math.min(w,h);
  hub.style.left=cx+"px";hub.style.top=cy+"px";
  wires.innerHTML="";
  NODES.forEach(n=>{const x=cx+Math.cos(n.ang)*n.rad*M,y=cy+Math.sin(n.ang)*n.rad*M;n.el.style.left=x+"px";n.el.style.top=y+"px";
    const ln=document.createElementNS("http://www.w3.org/2000/svg","line");ln.setAttribute("x1",cx);ln.setAttribute("y1",cy);ln.setAttribute("x2",x);ln.setAttribute("y2",y);
    ln.setAttribute("stroke",n.col);ln.setAttribute("stroke-opacity",n.live?.5:.2);wires.appendChild(ln);});
  Object.keys(DIVS).forEach(dk=>{const D=DIVS[dk];dls[dk].style.left=(cx+Math.cos(D.dir)*.47*M)+"px";dls[dk].style.top=(cy+Math.sin(D.dir)*.47*M)+"px";});}
addEventListener("resize",layoutNet);

// ===== MODAL =====
function tel(d){return d?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:"";}
function dial(p){return p?p.replace(/\D/g,""):"";}
const WORK={
 core:()=>`<div class="sec"><div class="s-lbl">The money</div><div class="say"><b style="font-size:26px;color:var(--core)">${DATA.kpis.mrr}</b> of $10,000/mo · <b>${DATA.kpis.clients}</b> clients · <b>${DATA.kpis.leads}</b> leads ready · <b>${DATA.kpis.dials.split("/")[0]}</b> called today</div></div>
  <div class="sec"><div class="s-lbl">Biggest thing holding you back</div><div class="say">Not how many calls you make — you make plenty. It's turning calls into demos, and <b>your demo line isn't verified yet</b>. Fix that first.</div></div>
  <div class="sec"><div class="s-lbl">Do this next</div><div class="say"><b>1.</b> Verify the Vapi demo line.<br><b>2.</b> Call the green leads.<br><b>3.</b> Log every call.</div></div>`,
 lead:()=>`<div class="sec"><div class="s-lbl">Companies to call<span>${DATA.leadList.length} total · tap to dial</span></div>${DATA.leadList.map((l,i)=>`<div class="lead"><span class="td" style="background:${l.p?'var(--agency)':'var(--ecom)'}"></span><span class="lx">${i+1}</span><div class="lb"><div class="lco">${l.co}</div><div class="lm">${l.c||''}</div></div>${l.p?`<a class="tel" href="tel:+1${dial(l.p)}">${l.p}</a>`:`<span class="noph">no #</span>`}</div>`).join("")}</div>`,
 sales:()=>`<div class="sec"><div class="s-lbl">When they push back, say this</div>${PUSH.map(c=>`<div class="push"><div class="q">${c[0]}</div><div class="a">${c[1]}</div></div>`).join("")}</div>
  <div class="sec"><div class="s-lbl">What to open with</div>${OPENERS.map(o=>`<div class="script"><div class="sh"><div><div class="sw">${o[1]} · ${o[2]}</div><div class="sc">${tel(o[3])}</div></div><a class="tel" href="tel:+1${o[3]}">Call</a></div>${o[4]?`<div class="flag">⚠ ${o[4]}</div>`:""}<div class="op">“${o[5]}”</div><div class="vm"><b>if voicemail</b>${o[6]}</div></div>`).join("")}</div>`,
 store:()=>`<div class="sec"><div class="s-lbl">Everything the team remembers</div>
   <div class="fr"><div><div class="fl">Your offer & pricing</div><div class="fm">$500/mo, setup waived for first 3</div></div><span class="badge on">Set</span></div>
   <div class="fr"><div><div class="fl">Decisions made</div><div class="fm">pivot, pricing, phone-first</div></div><span class="badge on">Saved</span></div>
   <div class="fr"><div><div class="fl">Your leads</div><div class="fm">${DATA.pipeline.new||0} waiting</div></div><span class="badge warn">${DATA.pipeline.new||0}</span></div>
   <div class="fr"><div><div class="fl">Objections</div><div class="fm">fills once you call</div></div><span class="badge empty">empty</span></div></div>`,
 engine:()=>`<div class="sec"><div class="s-lbl">Your 5am robot</div><div class="say">Every morning at <b>5:00am</b> it finds ~150 new companies, checks the phone numbers, writes what to say, and adds them to your list — while you sleep.</div></div>
  <div class="sec"><div class="s-lbl">Latest run</div><div class="say">Added <b>37 new companies</b> to your list. <a class="link" href="https://claude.ai/code/routines/trig_018YYUgA7ZBB2uueWFLEQRgg" target="_blank" rel="noopener">See its runs →</a></div></div>`,
 voice:()=>`<div class="sec"><div class="s-lbl">Coming soon</div><div class="say"><b>An AI that makes the calls for you</b> — same tech as your demo, pointed at the lead list to warm them up or set appointments.</div></div>`,
 appt:()=>`<div class="sec"><div class="s-lbl">Coming soon</div><div class="say"><b>Books appointments into your calendar</b> when a lead replies. Works with the AI caller.</div></div>`,
 tiktok:()=>`<div class="sec"><div class="s-lbl">Building tomorrow</div><div class="say"><b>Makes a faceless AI story video every day</b> to post on TikTok for views. Needs a video + posting tool (~$50–150/mo).</div></div>`,
 clone:()=>`<div class="sec"><div class="s-lbl">Coming soon</div><div class="say"><b>An AI version of your voice and face</b> for the content videos.</div></div>`,
 ecomstore:()=>`<div class="sec"><div class="s-lbl">Just an idea</div><div class="say"><b>An online store</b> — finds a product, builds it, writes listings, runs ads. Best started once the agency's making money.</div></div>`,
 adstudio:()=>`<div class="sec"><div class="s-lbl">Just an idea</div><div class="say"><b>Makes the photos, video, and copy</b> for the ecom store's ads.</div></div>`,
 life:()=>`<div class="sec"><div class="s-lbl">Just an idea</div><div class="say"><b>Your personal assistant</b> — calendar, reminders, errands, travel.</div></div>`,
 money:()=>`<div class="sec"><div class="s-lbl">Just an idea</div><div class="say"><b>Watches your money</b> — spending, bills, savings goals.</div></div>`,
};
const SUB={core:"The brain. All your key info and what to do next.",lead:"Fresh restoration companies to call, hottest first.",sales:"What to say — and what to say back when they push.",store:"Everything the team knows about your business.",engine:"Finds 150 new leads every morning while you sleep.",voice:"An AI that makes calls for you.",appt:"Books your appointments.",tiktok:"Daily AI videos for views.",clone:"An AI you for content.",ecomstore:"An online store for profit.",adstudio:"Makes the store's ads.",life:"Runs your personal life admin.",money:"Watches your finances."};
const EY={1:"Working now",0:"Coming soon"};
const scrim=document.getElementById("scrim"),modal=document.getElementById("modal"),mey=document.getElementById("mey"),mname=document.getElementById("mname"),msub=document.getElementById("msub"),mbody=document.getElementById("mbody"),morb=document.getElementById("morb");
function hx(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function openModal(id){const n=byId[id];mey.textContent=n.live?"Working now":"Coming soon";mey.style.color=n.col;mname.textContent=n.name;msub.textContent=SUB[id]||"";
  morb.textContent=n.ico;morb.style.background=`rgba(${hx(n.col).join(",")},.14)`;morb.style.color=n.col;
  mbody.innerHTML=WORK[id]();modal.scrollTop=0;scrim.classList.add("open");modal.classList.add("open");}
function closeModal(){scrim.classList.remove("open");modal.classList.remove("open");}
document.getElementById("mx").addEventListener("click",closeModal);scrim.addEventListener("click",closeModal);
addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

// ===== CHAT (talks to your team from real data) =====
const log=document.getElementById("log"),cinp=document.getElementById("cinp");
function add(cls,html){const m=document.createElement("div");m.className="msg "+cls;m.innerHTML=html;log.appendChild(m);log.scrollTop=log.scrollHeight;}
function withPhones(){return DATA.leadList.filter(l=>l.p).length;}
function reply(q){
  const s=q.toLowerCase();
  if(/hi|hey|hello|yo|sup/.test(s)&&s.length<12)return "<b>Command:</b> Hey. Ask me about your leads, what to say, what to do next, or the 5am engine.";
  if(/how many|lead|company|companies|call list/.test(s))return `<b>Leads:</b> You've got <b>${DATA.kpis.leads}</b> companies in the pipeline, <b>${withPhones()}</b> with a phone number ready to dial right now. Tap the Leads node to see them all. Hottest: ${DATA.leadList.slice(0,3).map(l=>l.co).join(", ")}.`;
  if(/next|what.*do|priority|today/.test(s))return "<b>Command:</b> One thing first — <b>verify your Vapi demo line</b> works for a stranger. Every script sends them to it. Then call the green leads and log each call.";
  if(/say|script|opener|pitch|objection|push/.test(s))return "<b>Scripts:</b> Open with — “Not a pitch, quick: when a water call hits at 2am and drops to voicemail, that job's gone to whoever answered. I built a line that answers those. Call it, 90 seconds.” Tap the Scripts node for the push-back answers.";
  if(/money|revenue|mrr|close|client/.test(s))return `<b>Command:</b> Revenue is <b>${DATA.kpis.mrr}</b> toward $10k, <b>${DATA.kpis.clients}</b> clients. The path: waive setup for your first 3, get them live in a week, turn them into case studies.`;
  if(/engine|5am|auto|source|find more/.test(s))return "<b>Auto-Leads:</b> I run at 5am daily and add ~150 fresh companies to your list, phone-checked. Last run added 37. Want me to run again now? Ask Mario's operator to trigger it.";
  if(/tiktok|video|content|clone/.test(s))return "<b>Content:</b> TikTok studio's being built next — daily AI story videos you post yourself. Not live yet; needs a video + posting tool.";
  if(/demo|vapi|number|phone line/.test(s))return "<b>Command:</b> The demo line is the #1 blocker — it's still unverified. Call it yourself, confirm a stranger can reach it, then every script works.";
  return "<b>Command:</b> I can talk leads, scripts, next steps, revenue, or the 5am engine. Try one of the buttons below — or tell your operator to wire me to full AI for open-ended chat.";
}
function send(q){if(!q.trim())return;add("me",q);cinp.value="";setTimeout(()=>add("ai",reply(q)),380);}
document.getElementById("csend").addEventListener("click",()=>send(cinp.value));
cinp.addEventListener("keydown",e=>{if(e.key==="Enter")send(cinp.value);});
const CHIPS=["How many leads?","What do I do next?","What do I say?","Run the engine"];
const chips=document.getElementById("chips");CHIPS.forEach(c=>{const b=document.createElement("button");b.textContent=c;b.onclick=()=>send(c);chips.appendChild(b);});
document.getElementById("chatHead").addEventListener("click",()=>{const c=document.getElementById("chat");c.classList.toggle("min");document.getElementById("chatToggle").textContent=c.classList.contains("min")?"▴":"▾";});
add("ai","<b>Command:</b> Your team's online. Ask me anything about the business — try the buttons below.");

// ===== LIVE =====
const last={};
function flash(id){const el=document.getElementById(id);el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}
function renderBars(){const el=document.getElementById("bars");el.innerHTML="";const mx=Math.max(1,...STAGES.map(x=>DATA.pipeline[x[0]]||0));
  STAGES.forEach(([k,label])=>{const v=DATA.pipeline[k]||0;const d=document.createElement("div");d.className="bar";d.innerHTML=`<span class="bn">${label}</span><span class="bt"><i style="width:${v/mx*100}%"></i></span><span class="bv">${v}</span>`;el.appendChild(d);});}
function renderKpis(){const set=(id,html,key)=>{const el=document.getElementById(id);el.innerHTML=html;if(last[key]!==undefined&&last[key]!==html)flash(id);last[key]=html;};
  set("k-mrr",DATA.kpis.mrr+'<small>/10k</small>',"m");set("k-leads",String(DATA.kpis.leads),"l");set("k-dials",DATA.kpis.dials.split("/")[0]+'<small>/'+DATA.kpis.dials.split("/")[1]+'</small>',"d");set("k-clients",String(DATA.kpis.clients),"c");
  if(byId.lead.el)byId.lead.el.querySelector(".on").textContent=DATA.kpis.leads+" to call";
  if(modal.classList.contains("open")){const cur=mname.textContent;} renderBars();}
async function hydrate(){try{const pipe=await fetch("pipeline.md",{cache:"no-store"});if(!pipe.ok)throw 0;const txt=await pipe.text();
  const counts={};STAGES.forEach(s=>counts[s[0]]=0);const list=[];let won=false;
  txt.split("\n").forEach(line=>{if(/^##\s*Won/i.test(line))won=true;if(won||!line.startsWith("| "))return;const c=line.split("|").map(x=>x.trim());if(c.length<4||c[1]===""||c[1]==="Company")return;const st=c[3].toLowerCase();if(!STAGES.some(s=>s[0]===st))return;counts[st]++;if(st==="new"){const m=(c[2]||"").match(/\(?\d{3}\)?[ .-]?\d{3}[ .-]?\d{4}/);list.push({co:c[1],c:c[2],p:m?m[0]:""});}});
  if(list.length){DATA.pipeline=counts;DATA.kpis.leads=Object.values(counts).reduce((a,b)=>a+b,0);DATA.leadList=list;}
  const met=await fetch("metrics.md",{cache:"no-store"});if(met.ok){const rows=(await met.text()).split("\n").filter(l=>l.startsWith("|")&&!/Week of|:---/.test(l));const lr=rows[rows.length-1];if(lr){const c=lr.split("|").map(x=>x.trim());if(c.length>=9)DATA.kpis.mrr=c[7]||DATA.kpis.mrr;}}
  document.getElementById("liveTxt").innerHTML='LIVE · <b>'+DATA.kpis.leads+' leads</b> in your files';renderKpis();
}catch(e){document.getElementById("liveTxt").innerHTML='<b>'+DATA.kpis.leads+' leads</b> · snapshot';renderKpis();}}
layoutNet();renderKpis();hydrate();setInterval(hydrate,5000);
</script>

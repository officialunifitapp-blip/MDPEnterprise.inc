<title>MDP Enterprises — The Team</title>
<style>
  :root{
    --core:#7fe4ff; --lead:#4fe39c; --sales:#ff7ac2; --store:#f6c453; --engine:#6ea8ff;
    --tiktok:#ff8a5c; --voice:#4fdbe6; --appt:#a99bff; --clone:#d07bff;
    --ink:#eaf1fb; --dim:#93a6c4; --faint:#5a6d8c;
    --room:#0a1220;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(120% 90% at 50% 8%, #16223b 0%, #0a1120 42%, #05080f 100%);}
  #scene{position:fixed;inset:0;perspective:1400px;perspective-origin:50% 42%;overflow:hidden;}
  #room{position:absolute;inset:0;transform-style:preserve-3d;
    transform:translateZ(0) rotateX(var(--rx,4deg)) rotateY(var(--ry,0deg));
    transition:transform .18s ease-out;}

  /* floor */
  .floor{position:absolute;left:50%;top:64%;width:2600px;height:2000px;transform:translate(-50%,0) rotateX(78deg);
    transform-style:preserve-3d;
    background:
      repeating-linear-gradient(90deg, rgba(120,170,240,.08) 0 1px, transparent 1px 120px),
      repeating-linear-gradient(0deg, rgba(120,170,240,.08) 0 1px, transparent 1px 120px);
    -webkit-mask-image:radial-gradient(60% 55% at 50% 30%, #000 0%, transparent 78%);
    mask-image:radial-gradient(60% 55% at 50% 30%, #000 0%, transparent 78%);}
  .floorglow{position:absolute;left:50%;top:52%;width:900px;height:520px;transform:translate(-50%,-50%);
    background:radial-gradient(50% 50% at 50% 50%, rgba(127,228,255,.14), transparent 70%);filter:blur(30px);}

  /* atmosphere motes */
  .mote{position:absolute;border-radius:99px;background:#bfe0ff;pointer-events:none;opacity:.4;
    animation:rise linear infinite;}
  @keyframes rise{from{transform:translateY(30px);opacity:0}10%{opacity:.5}to{transform:translateY(-160px);opacity:0}}

  /* team */
  .team{position:absolute;left:50%;top:50%;transform-style:preserve-3d;}
  .member{position:absolute;transform-style:preserve-3d;cursor:pointer;
    transition:filter .25s, transform .3s;will-change:transform;}
  .member .lift{transform-style:preserve-3d;animation:breathe var(--bd,4s) ease-in-out infinite;animation-delay:var(--bdl,0s);}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .member.off{filter:saturate(.35) brightness(.7);opacity:.62;}
  .member:hover{filter:brightness(1.12) drop-shadow(0 0 20px var(--ac));}
  .member.off:hover{filter:saturate(.5) brightness(.85);}

  .pad{position:absolute;left:50%;bottom:-8px;width:150px;height:44px;transform:translate(-50%,0) rotateX(72deg);
    border-radius:50%;background:radial-gradient(50% 50% at 50% 50%, var(--ac), transparent 66%);opacity:.5;}
  .ring{position:absolute;left:50%;bottom:-8px;width:150px;height:44px;transform:translate(-50%,0) rotateX(72deg);
    border-radius:50%;border:1.5px solid var(--ac);opacity:.5;animation:ping 3.4s ease-out infinite;animation-delay:var(--bdl,0s);}
  @keyframes ping{0%{transform:translate(-50%,0) rotateX(72deg) scale(.5);opacity:.55}100%{transform:translate(-50%,0) rotateX(72deg) scale(1.35);opacity:0}}
  .member.off .ring{display:none;}

  .av{display:block;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5));}
  .plate{position:absolute;left:50%;bottom:-52px;transform:translateX(-50%);text-align:center;white-space:nowrap;}
  .plate .nm{font-size:13px;font-weight:600;letter-spacing:.01em;}
  .plate .rl{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:3px;
    display:inline-flex;align-items:center;gap:5px;}
  .plate .rl i{width:6px;height:6px;border-radius:99px;background:var(--ac);box-shadow:0 0 7px var(--ac);}
  .member.off .plate .rl i{background:#7c8aa3;box-shadow:none;animation:flick 2.4s steps(1) infinite;}
  @keyframes flick{0%,100%{opacity:1}45%{opacity:.3}50%{opacity:.8}}

  .blink{transform-box:fill-box;transform-origin:center;animation:blink var(--kd,5s) steps(1) infinite;animation-delay:var(--kdl,0s);}
  @keyframes blink{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(.08)}}
  .chest{transform-box:fill-box;transform-origin:center;animation:cpulse 2.6s ease-in-out infinite;}
  @keyframes cpulse{0%,100%{opacity:.55}50%{opacity:1}}

  /* HUD */
  .hud{position:fixed;left:0;top:0;right:0;padding:16px 20px;z-index:20;pointer-events:none;
    display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .brand .tag{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--core);opacity:.85;}
  .brand h1{margin:4px 0 0;font-size:20px;font-weight:600;}
  .brand .st{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--faint);margin-top:5px;display:flex;align-items:center;gap:6px;}
  .brand .st i{width:6px;height:6px;border-radius:99px;background:var(--lead);box-shadow:0 0 8px var(--lead);animation:bp 2s ease-in-out infinite;}
  @keyframes bp{50%{opacity:.35}}
  .kbar{display:flex;gap:1px;border:1px solid #23324a;border-radius:11px;overflow:hidden;background:#23324a;pointer-events:auto;}
  .kbar .k{background:#080e1acc;backdrop-filter:blur(8px);padding:8px 13px;text-align:right;min-width:64px;}
  .kbar .k .v{font-family:ui-monospace,monospace;font-size:16px;font-weight:600;line-height:1;}
  .kbar .k .v small{font-size:10px;color:var(--faint);}
  .kbar .k .l{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:5px;}
  .kbar .mrr .v{color:var(--core);} .kbar .leads .v{color:var(--lead);} .kbar .dials .v{color:var(--store);} .kbar .clients .v{color:var(--tiktok);}
  .foot{position:fixed;left:20px;bottom:16px;z-index:20;font-size:10px;color:var(--faint);letter-spacing:.03em;pointer-events:none;}
  .foot b{color:var(--dim);font-weight:500;}

  /* drawer (real work) */
  .scrim{position:fixed;inset:0;background:rgba(2,4,9,.6);backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s;}
  .scrim.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(500px,100%);z-index:50;background:#060a12;border-left:1px solid #1b2942;
    transform:translateX(100%);transition:transform .34s cubic-bezier(.2,.9,.2,1);overflow-y:auto;box-shadow:-24px 0 70px rgba(0,0,0,.6);}
  .drawer.open{transform:translateX(0);}
  .d-head{position:sticky;top:0;background:linear-gradient(#060a12,rgba(6,10,18,.9));backdrop-filter:blur(8px);padding:20px 24px 15px;border-bottom:1px solid #1b2942;display:flex;align-items:center;gap:13px;}
  .d-ava{width:52px;height:52px;flex:none;border-radius:13px;display:grid;place-items:center;border:1px solid #1b2942;overflow:hidden;}
  .d-role{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;} .d-head h2{margin:3px 0 0;font-size:20px;font-weight:600;}
  .d-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--faint);font-size:24px;cursor:pointer;} .d-close:hover{color:var(--ink);}
  .d-sub{padding:13px 24px 0;color:var(--dim);font-size:12px;line-height:1.55;} .d-body{padding:14px 24px 60px;}
  .sec{margin-top:22px;} .sec:first-child{margin-top:8px;}
  .s-lbl{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:10px;display:flex;justify-content:space-between;}
  .lead{display:flex;align-items:center;gap:11px;background:#0a1019;border:1px solid #17233a;border-radius:11px;padding:10px 12px;margin-bottom:7px;}
  .lead .lx{width:20px;font-family:ui-monospace,monospace;font-size:11px;color:var(--faint);text-align:center;}
  .lead .lb{flex:1;min-width:0;} .lead .lco{font-size:13px;font-weight:600;} .lead .lm{font-size:10.5px;color:var(--dim);margin-top:2px;}
  .lead a.tel{font-family:ui-monospace,monospace;font-size:12.5px;color:#03050b;background:var(--lead);border-radius:8px;padding:7px 11px;text-decoration:none;font-weight:700;white-space:nowrap;}
  .lead .noph{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--store);border:1px solid #4a3f22;border-radius:8px;padding:6px 8px;}
  .lead .td{width:6px;height:6px;border-radius:99px;flex:none;}
  .chess{background:#0a1019;border:1px solid #17233a;border-radius:11px;padding:12px 13px;margin-bottom:7px;}
  .chess .obj{font-size:12px;font-weight:600;color:var(--sales);} .chess .rep{font-size:12px;color:#d3e3f4;margin-top:4px;line-height:1.5;} .chess .rep::before{content:"→ ";color:var(--faint);}
  .script{background:#0a1019;border:1px solid #17233a;border-radius:11px;padding:12px 13px;margin-bottom:8px;}
  .script .sh{display:flex;align-items:center;justify-content:space-between;gap:8px;} .script .sw{font-size:12.5px;font-weight:600;} .script .sc{font-size:10.5px;color:var(--faint);font-family:ui-monospace,monospace;}
  .script a.tel{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--lead);text-decoration:none;border-bottom:1px solid #2a5c48;}
  .script .op{font-size:12px;color:#d3e3f4;line-height:1.6;margin-top:9px;border-left:2px solid var(--sales);padding-left:11px;}
  .script .vm{font-size:11px;color:var(--dim);line-height:1.55;margin-top:8px;} .script .vm b{color:var(--faint);font-weight:600;font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px;}
  .script .flag{font-size:10.5px;color:var(--store);margin-top:8px;}
  .mini{background:#0a1019;border:1px solid #17233a;border-radius:11px;padding:12px 13px;margin-bottom:8px;font-size:12px;color:var(--dim);line-height:1.6;} .mini b{color:var(--ink);font-weight:600;}
  .stagebars{display:flex;flex-direction:column;gap:5px;} .sb{display:flex;align-items:center;gap:9px;font-size:11px;} .sb .sn{font-family:ui-monospace,monospace;width:78px;color:var(--dim);text-transform:capitalize;}
  .sb .st2{flex:1;height:14px;border-radius:4px;background:#0a1019;border:1px solid #17233a;position:relative;overflow:hidden;} .sb .st2>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(79,227,156,.42),rgba(79,227,156,.12));}
  .sb .sv{font-family:ui-monospace,monospace;width:20px;text-align:right;font-weight:600;}
  .filerow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #121c2e;} .filerow:last-child{border-bottom:none;}
  .fname{font-family:ui-monospace,monospace;font-size:11.5px;} .fmeta{font-size:10px;color:var(--faint);margin-top:2px;}
  .badge{font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap;}
  .badge.on{background:rgba(79,227,156,.14);color:var(--lead);} .badge.warn{background:rgba(246,196,83,.14);color:var(--store);} .badge.empty{background:rgba(90,109,140,.2);color:var(--dim);}
  .plan{background:linear-gradient(135deg,rgba(255,138,92,.08),#0a1019);border:1px dashed #4a3a2e;border-radius:12px;padding:15px;font-size:12.5px;color:var(--dim);line-height:1.6;} .plan b{color:var(--ink);}
  a.link{color:var(--core);font-size:11.5px;text-decoration:none;border-bottom:1px solid rgba(127,228,255,.35);}
  @media(max-width:640px){.hud{flex-direction:column;} .kbar{align-self:stretch;} .kbar .k{flex:1;} .drawer{width:100%;} #scene{perspective:900px;}}
  @media(prefers-reduced-motion:reduce){.member .lift,.blink,.chest,.ring,.mote{animation:none!important;}}
</style>

ll it — 90 seconds.","Alan, it's [YOU] — a line that answers and books after-hours calls, often cheaper than a service. Call [DEMO #]."],[6,"Greg","Power Dry","9135861545",null,"Hey Greg — not a pitch. Water mitigation only since '88, so every after-hours call to voicemail is a big job walking to the next guy. If it's still you and Ed, you can't be on the phone at 2am. I built a line that answers and books those. Call it — 90 seconds.","Greg, it's [YOU] — every missed 2am call is a big job lost; this answers and books them. Call [DEMO #]."],[7,"—","Pride Cleaning & Rest.","3146681223","Get the owner's name first.","Hey — who owns the shop? ... 30-plus years in STL, your phone rings a lot — who picks up when a water call hits at 2am? If it's voicemail, that job's gone. I built a line that answers and books them. Call it — 90 seconds.","Hey, it's [YOU] for whoever owns Pride — answers your after-hours water calls. Call [DEMO #]."],[8,"—","Kelley Klean","5732140990","Owner unconfirmed.","Hey — who's the owner these days? ... Oldest restoration shop in Central Missouri, so tons of calls — I bet the after-hours ones roll to voicemail. I built a line that answers and books those. Call it — 90 seconds.","Hey, it's [YOU] for the owner of Kelley Klean — catches after-hours calls before voicemail. Call [DEMO #]."],[9,"—","Five One Five Rest.","5154521876","Get the right person.","Hey — are you the owner? ... You promise to respond in minutes, so it's you or a small crew — nobody catches every 2am call. I built a line that answers and books those. Call it — 90 seconds.","Hey, it's [YOU] for the owner of 515 — answers the after-hours calls you can't catch. Call [DEMO #]."],[10,"—","Omaha Damage Repair","4027044921","Confirm current owner.","Hey — who owns the shop now? ... 140-plus reviews means a busy phone, and a small team misses the after-hours water calls. I built a line that answers and books those. Call it — 90 seconds.","Hey, it's [YOU] for whoever owns Omaha Damage Rep   };
  return `<svg class="av" width="${150*s}" height="${185*s}" viewBox="0 0 100 125" fill="none">

    <!-- shoulders/torso -->

    <circle cx="50" cy="106" r="10" fill="none" stroke="${c}" stroke-width="1" stroke-opacity=".35"/>
    <!-- neck -->

    <!-- eyes -->

  </svg>`;
}

// place members in a shallow arc facing camera
const team=document.getElementById("team");
const active=TEAM.filter(m=>m.active), off=TEAM.filter(m=>!m.active);
function layout(list,rowZ,rowY,spread,scale,cls){
  const n=list.length;
  list.forEach((m,i)=>{
    const f=n===1?0:(i/(n-1)-.5); // -.5..h.5
    const ang=f*1.1; // arc
    const x=Math.sin(ang)*spread;
    const z=rowZ - Math.cos(ang)*140 + 140;
    const el=document.createElement("div");
    el.className="member"+(cls||"");
    el.style.setProperty("--ac",m.col);
    el.style.setProperty("--bd",(3.4+Math.random()*1.6).toFixed(2)+"s");
    el.style.setProperty("--bdl","-"+(Math.random()*3).toFixed(2)+"s");
    el.style.transform=`translate3d(${x}px, ${rowY}px, ${z}px) rotateY(${-f*10}deg)`;
    el.dataset.id=m.id;
    el.innerHTML=`<div class="lift"><div class="pad"></div><div class="ring"></div>${avatar(m,scale)}</div>
      <div class="plate"><div class="nm">${m.name}</div><div class="rl"><i></i>${m.role}</div></div>`;
    el.addEventListener("click",()=>openDrawer(m.id));
    team.appendChild(el);
  });
}

// ===== HUD hydrate =====
function renderKpis(){document.getElementById("k-mrr").innerHTML=DATA.kpis.mrr+'<small>/10k</small>';document.getElementById("k-leads").textContent=DATA.kpis.leads;
  document.getElementById("k-dials").innerHTML=DATA.kpis.dials.split("/")[0]+'<small>/'+DATA.kpis.dials.split("/")[1]+'</small>';document.getElementById("k-clients").textContent=DATA.kpis.clients;}
async function hydrate(){try{const pipe=await fetch("pipeline.md",{cache:"no-store"});if(!pipe.ok)throw 0;const txt=await pipe.text();
  const counts={};STAGES.forEach(s=>counts[s]=0);let won=false;
  txt.split("\n").forEach(line=>{if(/^##\s*Won/i.test(line))won=true;if(won||!line.startsWith("|"))return;const c=line.split("|").map(x=>x.trim());if(c.length<4)return;STAGES.forEach(s=>{if(c[3].toLowerCase()===s)counts[s]++;});});
  if(Object.values(counts).some(v=>v>0)){DATA.pipeline=counts;DATA.kpis.leads=Object.values(counts).reduce((a,b)=>a+b,0)||DATA.kpis.leads;}
  const met=await fetch("metrics.md",{cache:"no-store"});if(met.ok){const rows=(await met.text()).split("\n").filter(l=>l.startsWith("|")&&!/Week of|:---/.test(l));const last=rows[rows.length-1];if(last){const c=last.split("|").map(x=>x.trim());if(c.length>=9)DATA.kpis.mrr=c[7]||DATA.kpis.mrr;}}
  document.getElementById("liveTxt").textContent="live · reading files";renderKpis();
}catch(e){document.getElementById("liveTxt").textContent="snapshot";}}
renderKpis();hydrate();

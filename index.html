 {id:"money",div:"personal",name:"Finances",one:"track your money",col:"#7ee0c0",rf:.048,n:110,sp:-.3,stage:"idea",chip:"IDEA",ico:"💵"},
];
const byId=Object.fromEntries(SPH.map(s=>[s.id,s]));
Object.keys(DIVS).forEach(dk=>{const mem=SPH.filter(s=>s.div===dk),D=DIVS[dk];mem.forEach((s,i)=>{const f=mem.length===1?0:(i/(mem.length-1)-.5);s.ang=D.dir+f*D.spread;s.radN=.30+((i%2)?.09:0);});});
const GA=Math.PI*(3-Math.sqrt(5));
SPH.forEach(s=>{s.pts=[];for(let i=0;i<s.n;i++){const y=1-(i/(s.n-1))*2,r=Math.sqrt(1-y*y),th=i*GA;s.pts.push([Math.cos(th)*r,y,Math.sin(th)*r]);}s.rot=Math.random()*6;s.ph=Math.random()*6;s.hov=0;s.pulse=0;s.active=s.stage==="live";});

const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let W=0,H=0,DPR=1,M=0;
function CX(s){return s.core?W*.5:W*.5+Math.cos(s.ang)*s.radN*M;}
function CY(s){return s.core?H*.5:H*.5+Math.sin(s.ang)*s.radN*M;}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;M=Math.min(W,H);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);placeLabels();}
addEventListener("resize",resize);
function hx(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
let focusId=null,open=false,fp=0;
function pose(s){const bx=CX(s),by=CY(s),bR=s.rf*M;if(!focusId||fp<.001)return{x:bx,y:by,R:bR,a:s.active?1:.45};
  const fx=W*.5,fy=H*.42,fR=Math.min(W,H)*.2;
  if(s.id===focusId)return{x:bx+(fx-bx)*fp,y:by+(fy-by)*fp,R:bR+(fR-bR)*fp,a:1};
  return{x:bx,y:by,R:bR,a:(s.active?1:.45)*(1-fp*.92)};}
const mouse={x:-999,y:-999,in:false};
addEventListener("pointermove",e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.in=true;});
addEventListener("pointerleave",()=>mouse.in=false);
cv.addEventListener("pointerdown",e=>{if(open)return;const s=pick(e.clientX,e.clientY);if(s){s.pulse=1;openModal(s.id);}});
function pick(mx,my){let hit=null,best=1e9;SPH.forEach(s=>{const cx=CX(s),cy=CY(s),R=s.rf*M;const d=Math.hypot(mx-cx,my-cy);if(d<R*1.3&&d<best){best=d;hit=s;}});return hit;}
const feeds=[];SPH.forEach(s=>{if(s.core)return;const cnt=s.active?4:2;for(let k=0;k<cnt;k++)feeds.push({s,t:k/cnt,sp:.14+Math.random()*.08});});

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let tPrev=0;
function frame(t){
  const dt=Math.min((t-tPrev)/1000||0,.05);tPrev=t;
  const tf=open?1:0;fp+=(tf-fp)*.14;if(fp<.01&&!open)focusId=null;
  labels.style.opacity=(1-fp);labels.style.pointerEvents=fp>.15?"none":"";
  ctx.clearRect(0,0,W,H);const coreX=W*.5,coreY=H*.5;
  ctx.globalCompositeOperation="lighter";
  if(fp<.6){const halo=ctx.createRadialGradient(coreX,coreY,0,coreX,coreY,M*.55);halo.addColorStop(0,`rgba(50,110,150,${.22*(1-fp)})`);halo.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=halo;ctx.beginPath();ctx.arc(coreX,coreY,M*.55,0,7);ctx.fill();}
  if(!reduce)feeds.forEach(p=>{const sx=CX(p.s),sy=CY(p.s);p.t+=p.sp*dt;if(p.t>1)p.t-=1;const x=sx+(coreX-sx)*p.t,y=sy+(coreY-sy)*p.t;const[R,G,B]=hx(p.s.col);
    ctx.fillStyle=`rgba(${R},${G},${B},${(p.s.active?.8:.35)*(1-Math.abs(p.t-.5))*(1-fp)})`;ctx.beginPath();ctx.arc(x,y,2,0,7);ctx.fill();});
  SPH.forEach(s=>{
    const P=pose(s);const cx=P.x,cy=P.y,R0=P.R;
    const hd=(mouse.in&&!open)?Math.hypot(mouse.x-cx,mouse.y-cy):999;s.hov+=((hd<R0*1.4?1:0)-s.hov)*.15;
    s.pulse=Math.max(0,s.pulse-dt*1.4);if(!reduce)s.rot+=s.sp*dt;
    const breathe=reduce?1:(1+.04*Math.sin(t/900+s.ph)+s.pulse*.14);const R=R0*breathe;
    const base=P.a;const bright=base*(.85+s.hov*.5+s.pulse*.5);const[Rc,Gc,Bc]=hx(s.col);
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.8);g.addColorStop(0,`rgba(${Rc},${Gc},${Bc},${(s.active?.3:.13)*(1+s.hov)})`);g.addColorStop(.5,`rgba(${Rc},${Gc},${Bc},${.08*base})`);g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*1.8,0,7);ctx.fill();
    if(s.core){const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,R*.55);cg.addColorStop(0,`rgba(235,252,255,${.6+s.hov*.3})`);cg.addColorStop(1,"rgba(87,224,255,0)");ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,R*.55,0,7);ctx.fill();}
    const cosR=Math.cos(s.rot),sinR=Math.sin(s.rot),cosT=Math.cos(.42),sinT=Math.sin(.42);
    for(let i=0;i<s.pts.length;i++){let[x,y,z]=s.pts[i];let x1=x*cosR-z*sinR,z1=x*sinR+z*cosR;let y1=y*cosT-z1*sinT,z2=y*sinT+z1*cosT;
      const persp=1/(1-z2*.34);const sx=cx+x1*R*persp,sy=cy+y1*R*persp;const depth=(z2+1)/2;
      const size=(0.6+depth*1.9)*(R0/66)*(s.active?1:.8);ctx.fillStyle=`rgba(${Rc},${Gc},${Bc},${(0.16+depth*0.95)*bright})`;ctx.fillRect(sx-size/2,sy-size/2,size,size);}
    if(s.core){const r2=s.rot*-1.3,cR=Math.cos(r2),sR=Math.sin(r2);for(let i=0;i<s.pts.length;i+=2){let[x,y,z]=s.pts[i];let x1=x*cR-z*sR,z1=x*sR+z*cR;let y1=y*cosT-z1*sinT,z2=y*sinT+z1*cosT;const persp=1/(1-z2*.34);const sx=cx+x1*R*.62*persp,sy=cy+y1*R*.62*persp;const depth=(z2+1)/2;ctx.fillStyle=`rgba(215,245,255,${(0.1+depth*.5)*bright})`;ctx.fillRect(sx-1,sy-1,1.8,1.8);}}
    if(s.id===focusId&&fp>.2){for(let k=0;k<8;k++){const a=t/1500+k*Math.PI/4,rr=R*1.55,sx2=cx+Math.cos(a)*rr,sy2=cy+Math.sin(a)*rr*.5;ctx.fillStyle="rgba("+Rc+","+Gc+","+Bc+","+(.7*fp)+")";ctx.beginPath();ctx.arc(sx2,sy2,2.4,0,7);ctx.fill();}}
  });
  ctx.globalCompositeOperation="source-over";requestAnimationFrame(frame);
}

// labels
const labels=document.getElementById("labels");
SPH.forEach(s=>{const d=document.createElement("div");d.className="lbl"+(s.active?"":" soon");
  d.innerHTML=`<div class="nm" style="color:${s.col}">${s.name}</div><div class="one">${s.one}</div><div class="chip" style="color:${s.col}">${s.chip}</div>`;
  d.addEventListener("click",()=>{s.pulse=1;openModal(s.id);});labels.appendChild(d);s.el=d;});
const dlabels={};Object.keys(DIVS).forEach(dk=>{const D=DIVS[dk];const d=document.createElement("div");d.className="dlbl";d.style.color=D.col;d.innerHTML=`<b>${D.label}</b><small>${D.note}</small>`;labels.appendChild(d);dlabels[dk]=d;});
function placeLabels(){SPH.forEach(s=>{s.el.style.left=CX(s)+"px";s.el.style.top=(CY(s)+s.rf*M+8)+"px";});Object.keys(DIVS).forEach(dk=>{const D=DIVS[dk];dlabels[dk].style.left=(W*.5+Math.cos(D.dir)*.46*M)+"px";dlabels[dk].style.top=(H*.5+Math.sin(D.dir)*.46*M)+"px";});}

// ===== MODAL =====
function tel(d){return d?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:"";}
function dial(p){return p?p.replace(/\D/g,""):"";}
const WORK={
 core:()=>`<div class="sec"><div class="s-lbl">The money, right now</div><div class="say"><span class="hero" style="color:var(--core)">${DATA.kpis.mrr}<small> of $10,000/mo</small></span><br><br><b>${DATA.kpis.clients}</b> paying clients &nbsp;·&nbsp; <b>${DATA.kpis.leads}</b> leads ready &nbsp;·&nbsp; <b>${DATA.kpis.dials.split("/")[0]}</b> called today</div></div>
  <div class="sec"><div class="s-lbl">Where your leads stand</div><div class="bars">${STAGES.map(([k,label])=>{const v=DATA.pipeline[k]||0,mx=Math.max(1,...STAGES.map(x=>DATA.pipeline[x[0]]||0));return`<div class="bar"><span class="bn">${label}</span><span class="bt"><i style="width:${v/mx*100}%"></i></span><span class="bv">${v}</span></div>`;}).join("")}</div></div>
  <div class="sec"><div class="s-lbl">Biggest thing holding you back</div><div class="say">It's not how many calls you make — you make plenty. It's two things: turning calls into demos, and <b>your demo line isn't verified yet</b>. Every script sends them to that number. Fix it first.</div></div>
  <div class="sec"><div class="s-lbl">Do this next</div><div class="say"><b>1.</b> Call your Vapi demo line — make sure it works for a stranger.<br><b>2.</b> Call the hottest leads (green dots).<br><b>3.</b> Note what happened on each call.</div></div>`,
 lead:()=>`<div class="sec"><div class="s-lbl">Companies ready to call<span>${DATA.leadList.length} total · tap a number to dial</span></div>${DATA.leadList.map((l,i)=>`<div class="lead"><span class="td" style="color:${l.p?'var(--agency)':'var(--ecom)'};background:currentColor"></span><span class="lx">${i+1}</span><div class="lb"><div class="lco">${l.co}</div><div class="lm">${l.c||''}</div></div>${l.p?`<a class="tel" href="tel:+1${dial(l.p)}">${l.p}</a>`:`<span class="noph">no # yet</span>`}</div>`).join("")}</div>`,
 sales:()=>`<div class="sec"><div class="s-lbl">When they push back, say this</div>${PUSH.map(c=>`<div class="push"><div class="q">${c[0]}</div><div class="a">${c[1]}</div></div>`).join("")}</div>
  <div class="sec"><div class="s-lbl">What to open with — your hottest</div>${OPENERS.map(o=>`<div class="script"><div class="sh"><div><div class="sw">${o[1]==="—"?"":o[1]+" · "}${o[2]}</div><div class="sc">${o[3]?tel(o[3]):""}</div></div>${o[3]?`<a class="tel" href="tel:+1${o[3]}">Call</a>`:""}</div>${o[4]?`<div class="flag">⚠ ${o[4]}</div>`:""}<div class="op">“${o[5]}”</div><div class="vm"><b>if voicemail</b>${o[6]}</div></div>`).join("")}</div>`,
 store:()=>`<div class="sec"><div class="s-lbl">Everything the team remembers</div>
   <div class="fr"><div><div class="fl">Your offer & pricing</div><div class="fm">$500/mo, setup waived for first 3</div></div><span class="badge on">Set</span></div>
   <div class="fr"><div><div class="fl">Decisions you've made</div><div class="fm">the pivot, pricing, phone-first</div></div><span class="badge on">Saved</span></div>
   <div class="fr"><div><div class="fl">Your leads</div><div class="fm">${DATA.pipeline.new||0} waiting to be called</div></div><span class="badge warn">${DATA.pipeline.new||0}</span></div>
   <div class="fr"><div><div class="fl">Your scoreboard</div><div class="fm">tracks calls, replies, closes</div></div><span class="badge warn">started</span></div>
   <div class="fr"><div><div class="fl">Objections you hear</div><div class="fm">fills once you start calling</div></div><span class="badge empty">empty</span></div></div>`,
 engine:()=>`<div class="sec"><div class="s-lbl">Your 5am robot</div><div class="say">Every morning at <b>5:00am</b>, while you sleep, it:<br><br><b>1.</b> Finds ~150 new restoration companies<br><b>2.</b> Checks each phone number is real<br><b>3.</b> Writes what to say to each<br><b>4.</b> Adds them to your call list</div></div>
  <div class="sec"><div class="s-lbl">Latest run</div><div class="say">Its last run added <b>37 new companies</b> to your list. Connected to your files — it updates this board automatically. <a class="link" href="https://claude.ai/code/routines/trig_018YYUgA7ZBB2uueWFLEQRgg" target="_blank" rel="noopener">See its runs →</a></div></div>`,
 voice:()=>`<div class="sec"><div class="s-lbl">Coming soon · AI Agency</div><div class="say"><b>An AI that makes the calls for you.</b> Same tech as your demo, pointed at your lead list to warm them up or set appointments. Built in Vapi when you're ready.</div></div>`,
 appt:()=>`<div class="sec"><div class="s-lbl">Coming soon · AI Agency</div><div class="say"><b>Books appointments into your calendar</b> when a lead replies — by text or voice. Works with the AI caller.</div></div>`,
 tiktok:()=>`<div class="sec"><div class="s-lbl">Building tomorrow · Content</div><div class="say"><b>Makes you a faceless AI story video every day</b> to post on TikTok and earn off the views. You just post it. Needs a video tool + posting tool (~$50–150/mo).</div></div>`,
 clone:()=>`<div class="sec"><div class="s-lbl">Coming soon · Content</div><div class="say"><b>An AI version of your voice and face</b> for the videos, so everything uses one consistent persona.</div></div>`,
 ecomstore:()=>`<div class="sec"><div class="s-lbl">Just an idea · Ecom</div><div class="say"><b>An online store.</b> When you want it: finds a product, builds the Shopify store, writes the listings, runs the ads. A different business from the agency — best started once the agency is making real money.</div></div>`,
 adstudio:()=>`<div class="sec"><div class="s-lbl">Just an idea · Ecom</div><div class="say"><b>Makes the photos, videos, and ad copy</b> for the ecom store.</div></div>`,
 life:()=>`<div class="sec"><div class="s-lbl">Just an idea · Personal</div><div class="say"><b>Your personal assistant.</b> Could run your calendar, reminders, errands, and travel.</div></div>`,
 money:()=>`<div class="sec"><div class="s-lbl">Just an idea · Personal</div><div class="say"><b>Keeps an eye on your money.</b> Track spending, bills, and savings goals.</div></div>`,
};
const SUB={core:"The brain. Tells you what to do next and where the money is.",lead:"Fresh restoration companies to call, hottest first.",sales:"Exactly what to say — and what to say back when they push.",store:"Everything the team knows about your business.",engine:"Finds 150 new leads every morning while you sleep.",voice:"An AI that makes calls for you.",appt:"Books your appointments automatically.",tiktok:"Daily AI videos to post for views.",clone:"An AI you for content.",ecomstore:"An online store you'd run for profit.",adstudio:"Makes the ads for the store.",life:"Runs your personal life admin.",money:"Watches your personal finances."};
const EY={live:"Working now",soon:"Coming soon",idea:"Just an idea"};
const scrim=document.getElementById("scrim"),modal=document.getElementById("modal"),mey=document.getElementById("mey"),mname=document.getElementById("mname"),msub=document.getElementById("msub"),mbody=document.getElementById("mbody"),morb=document.getElementById("morb");
function openModal(id){const s=byId[id];focusId=id;open=true;mey.textContent=EY[s.stage];mey.style.color=s.col;mname.textContent=s.name;msub.textContent=SUB[id];
  morb.textContent=s.ico;morb.style.background=`rgba(${hx(s.col).join(",")},.14)`;morb.style.color=s.col;
  mbody.innerHTML=WORK[id]();modal.scrollTop=0;scrim.classList.add("open");modal.classList.add("open");}
function closeModal(){open=false;scrim.classList.remove("open");modal.classList.remove("open");}
document.getElementById("mx").addEventListener("click",closeModal);scrim.addEventListener("click",closeModal);
addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

// ===== LIVE HYDRATE + POLL =====
const last={};
function flash(id){const el=document.getElementById(id);el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}
function renderKpis(){
  const set=(id,html,key)=>{const el=document.getElementById(id);el.innerHTML=html;if(last[key]!==undefined&&last[key]!==html)flash(id);last[key]=html;};
  set("k-mrr",DATA.kpis.mrr+'<small>/10k</small>',"mrr");
  set("k-leads",String(DATA.kpis.leads),"leads");
  set("k-dials",DATA.kpis.dials.split("/")[0]+'<small>/'+DATA.kpis.dials.split("/")[1]+'</small>',"dials");
  set("k-clients",String(DATA.kpis.clients),"clients");
  if(byId.lead.el)byId.lead.el.querySelector(".chip").textContent=DATA.kpis.leads;
  if(open&&focusId&&WORK[focusId])mbody.innerHTML=WORK[focusId]();}
function stamp(){document.getElementById("liveTxt").innerHTML='LIVE · reading your files · <b>'+DATA.kpis.leads+' leads</b>';}
async function hydrate(){try{
  const pipe=await fetch("pipeline.md",{cache:"no-store"});if(!pipe.ok)throw 0;const txt=await pipe.text();
  const counts={};STAGES.forEach(s=>counts[s[0]]=0);const list=[];let won=false;
  txt.split("\n").forEach(line=>{if(/^##\s*Won/i.test(line))won=true;if(won||!line.startsWith("| "))return;const c=line.split("|").map(x=>x.trim());if(c.length<4||c[1]===""||c[1]==="Company")return;const st=c[3].toLowerCase();if(!STAGES.some(s=>s[0]===st))return;counts[st]++;
    if(st==="new"){const m=(c[2]||"").match(/\(?\d{3}\)?[ .-]?\d{3}[ .-]?\d{4}/);list.push({co:c[1],c:c[2],p:m?m[0]:""});}});
  if(list.length){DATA.pipeline=counts;DATA.kpis.leads=Object.values(counts).reduce((a,b)=>a+b,0);DATA.leadList=list;}
  const met=await fetch("metrics.md",{cache:"no-store"});if(met.ok){const rows=(await met.text()).split("\n").filter(l=>l.startsWith("|")&&!/Week of|:---/.test(l));const lastRow=rows[rows.length-1];if(lastRow){const c=lastRow.split("|").map(x=>x.trim());if(c.length>=9)DATA.kpis.mrr=c[7]||DATA.kpis.mrr;}}
  renderKpis();stamp();
}catch(e){document.getElementById("liveTxt").innerHTML='<b>'+DATA.kpis.leads+' leads</b> · snapshot';renderKpis();}}
resize();renderKpis();requestAnimationFrame(frame);hydrate();setInterval(hydrate,5000);
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MDP Enterprises — A.I. Operating System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05080f; --panel:rgba(9,18,32,.72); --line:rgba(90,175,255,.16);
  --line2:rgba(90,175,255,.30); --txt:#cfe3f4; --dim:#7d94aa; --acc:#4fc3f7;
  --acc2:#7fe6ff; --ok:#4fd39a; --warn:#e0b45c; --bad:#e5697a;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 700px at 50% 42%,rgba(20,70,130,.30),transparent 62%),
    radial-gradient(900px 600px at 8% 0%,rgba(15,50,95,.22),transparent 60%),
    var(--bg);
  color:var(--txt);font:13px/1.45 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
/* faint HUD grid */
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(80,160,240,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(80,160,240,.045) 1px,transparent 1px);
  background-size:46px 46px}

.app{position:fixed;inset:0;display:grid;
  grid-template-columns:266px 1fr 288px;grid-template-rows:52px 1fr;gap:12px;padding:12px}

/* ---------- header ---------- */
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 14px;
  backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.16em;
  font-size:11.5px;text-transform:uppercase;color:#dbeeff}
.mark{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--acc);
  display:grid;place-items:center;box-shadow:0 0 14px rgba(79,195,247,.45)}
.mark i{width:7px;height:7px;border-radius:50%;background:var(--acc);display:block}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);
  border-radius:20px;padding:3px 10px;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 8px var(--ok);animation:bp 2.4s infinite}
@keyframes bp{50%{opacity:.35}}
.clock{margin-left:auto;font:11.5px/1 var(--mono);color:var(--dim);letter-spacing:.08em}

/* ---------- rails ---------- */
.rail{display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:thin}
.rail::-webkit-scrollbar{width:5px}
.rail::-webkit-scrollbar-thumb{background:rgba(90,175,255,.22);border-radius:3px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px 12px;backdrop-filter:blur(8px)}
.ct{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--acc);margin-bottom:9px;font-weight:600}
.ct svg{width:13px;height:13px;stroke:var(--acc);fill:none;stroke-width:1.7}

/* metrics */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mt{border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:rgba(255,255,255,.015)}
.ml{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.mv{font:600 20px/1.15 var(--mono);color:#eaf6ff;margin-top:3px;letter-spacing:-.01em}
.mv small{font-size:11px;color:var(--dim);font-weight:400}
.md{font-size:10px;margin-top:2px;color:var(--dim)}

/* status rows */
.sr{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(90,175,255,.09);font-size:12px}
.sr:first-of-type{border-top:0}
.sr .nm{flex:1;color:var(--txt)}
.sr .vl{font:11px var(--mono);color:var(--dim)}
.sd{width:7px;height:7px;border-radius:50%;flex:none}

/* feed */
.fi{display:flex;gap:9px;padding:8px 0;border-top:1px solid rgba(90,175,255,.09)}
.fi:first-of-type{border-top:0}
.fic{width:24px;height:24px;border-radius:7px;border:1px solid var(--line2);flex:none;
  display:grid;place-items:center;font-size:11px;color:var(--acc);background:rgba(79,195,247,.07)}
.fb{flex:1;min-width:0}
.fn{font-size:12px;color:#e2f1ff}
.fs{font-size:10.5px;color:var(--dim);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ft{font:10px var(--mono);color:#5f7a92;flex:none}

/* thoughts */
.th{display:flex;gap:8px;padding:6px 0;font-size:12px;line-height:1.4}
.th b{color:var(--acc);font-weight:400}
.addbtn,.qa{width:100%;display:flex;align-items:center;gap:8px;background:rgba(79,195,247,.07);
  border:1px solid var(--line2);color:var(--acc2);border-radius:8px;padding:8px 10px;
  font-size:11.5px;cursor:pointer;font-family:inherit;text-align:left;margin-top:4px;transition:.15s}
.addbtn:hover,.qa:hover{background:rgba(79,195,247,.16);border-color:var(--acc)}

/* ---------- stage ---------- */
.stage{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background:radial-gradient(600px 460px at 50% 48%,rgba(20,75,140,.20),rgba(5,10,20,.55))}
#net{display:block;width:100%;height:100%}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:10.5px;
  color:#5f7a92;letter-spacing:.05em;pointer-events:none;transition:opacity 1s}

/* ---------- modal / chat ---------- */
.scrim{position:fixed;inset:0;background:rgba(2,6,14,.72);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:.22s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;top:50%;left:50%;transform:translate(-50%,-46%) scale(.97);
  width:min(760px,92vw);max-height:82vh;overflow-y:auto;background:rgba(8,16,29,.97);
  border:1px solid var(--line2);border-radius:12px;opacity:0;pointer-events:none;transition:.22s;
  box-shadow:0 30px 90px rgba(0,0,0,.6)}
.sheet.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.sh{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:rgba(8,16,29,.98);z-index:2}
.sh h2{font-size:15px;font-weight:600;color:#eaf6ff}
.sh p{font-size:11.5px;color:var(--dim);margin-top:1px}
.sx{margin-left:auto;background:none;border:0;color:var(--dim);font-size:22px;cursor:pointer;line-height:1}
.sb{padding:14px 16px}
.sec{margin-bottom:16px}
.slb{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--acc);
  margin-bottom:7px;display:flex;justify-content:space-between;align-items:baseline}
.slb span{color:var(--dim);letter-spacing:.03em;text-transform:none;font-size:11px}
.say{font-size:12.5px;line-height:1.55;color:#c3d8ea}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:5px 6px;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);cursor:pointer;user-select:none;white-space:nowrap;font-weight:600}
td{padding:6px;border-top:1px solid rgba(90,175,255,.09);vertical-align:middle}
.tel{color:var(--acc2);text-decoration:none;font-family:var(--mono);font-size:11.5px}
.noph{color:#4d6478}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;background:rgba(79,195,247,.09);
  border:1px solid var(--line);font-size:10.5px;letter-spacing:.05em;margin:0 5px 5px 0}
.chip b{color:var(--acc2)}
.ntbtn{width:24px;height:24px;border-radius:6px;border:1px solid var(--line2);
  background:transparent;color:var(--dim);cursor:pointer;font-size:11px}
.ntbtn.has{background:rgba(79,211,154,.16);border-color:var(--ok);color:var(--ok)}
textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:7px;
  color:var(--txt);padding:7px 8px;font:12px/1.45 inherit;resize:vertical;min-height:52px;margin:4px 0 6px}
.hide{display:none}

/* ---------- scout ---------- */
.opp{display:flex;gap:11px;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px;
  background:rgba(255,255,255,.015)}
.opp img{width:74px;height:74px;object-fit:cover;border-radius:8px;flex:none;background:rgba(255,255,255,.05)}
.opp .ob{flex:1;min-width:0}
.opp .oh{display:flex;align-items:flex-start;gap:8px}
.opp .on{font-size:13px;color:#eaf6ff;font-weight:600;flex:1}
.opp .obr{font-size:11px;color:var(--dim)}
.badge{font-size:9.5px;letter-spacing:.09em;font-weight:700;padding:3px 8px;border-radius:5px;flex:none}
.badge.BUY{background:rgba(79,211,154,.18);color:var(--ok);border:1px solid var(--ok)}
.badge.REVIEW{background:rgba(224,180,92,.16);color:var(--warn);border:1px solid var(--warn)}
.badge.PASS{background:rgba(229,105,122,.13);color:var(--bad);border:1px solid rgba(229,105,122,.5)}
.og{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 6px}
.og div{border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.og .k{font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.og .v{font:600 12.5px var(--mono);color:#dff0ff;margin-top:1px}
.orisk{font-size:11px;color:var(--warn);margin-top:3px}
.ometa{font-size:10.5px;color:var(--dim);margin-top:3px}
.obtn{display:inline-block;margin-top:7px;background:rgba(79,195,247,.1);border:1px solid var(--line2);
  color:var(--acc2);border-radius:7px;padding:5px 11px;font-size:11.5px;text-decoration:none}
.obtn:hover{background:rgba(79,195,247,.2)}
.fld{display:grid;grid-template-columns:130px 1fr;gap:7px;align-items:center;margin-bottom:7px}
.fld label{font-size:11px;color:var(--dim)}
.fld input,.fld select{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:6px;
  color:var(--txt);padding:6px 8px;font:12px inherit;width:100%}
.warnbox{border:1px solid rgba(224,180,92,.4);background:rgba(224,180,92,.07);border-radius:8px;
  padding:9px 11px;font-size:11.5px;color:#e8d3a6;margin-bottom:12px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.filters select,.filters input{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:6px;
  color:var(--txt);padding:5px 7px;font:11.5px inherit}
.spin{color:var(--dim);font-size:12px;padding:10px 0}

/* chat */
.chat{position:fixed;z-index:50;right:14px;bottom:14px;width:min(400px,94vw);height:min(560px,80vh);
  background:rgba(8,16,29,.97);border:1px solid var(--line2);border-radius:12px;display:flex;
  flex-direction:column;opacity:0;pointer-events:none;transform:translateY(14px);transition:.22s;
  box-shadow:0 24px 70px rgba(0,0,0,.6)}
.chat.on{opacity:1;pointer-events:auto;transform:none}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:88%;padding:8px 11px;border-radius:11px;font-size:12.5px;line-height:1.5}
.msg.me{align-self:flex-end;background:rgba(79,195,247,.16);border:1px solid var(--line2)}
.msg.ai{align-self:flex-start;background:rgba(255,255,255,.045);border:1px solid var(--line)}
.msg code{font:11.5px var(--mono);background:rgba(0,0,0,.4);padding:1px 4px;border-radius:4px}
.cin{display:flex;gap:7px;padding:10px;border-top:1px solid var(--line)}
.cin input{flex:1;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;
  color:var(--txt);padding:9px 11px;font:12.5px inherit;outline:none}
.cin input:focus{border-color:var(--acc)}
.cin button{background:var(--acc);border:0;color:#04141f;font-weight:600;border-radius:8px;
  padding:0 15px;cursor:pointer;font-size:12px}

@media(max-width:1180px){
  .app{grid-template-columns:1fr;grid-template-rows:52px 46vh auto}
  .rail{flex-direction:row;overflow-x:auto}
  .card{min-width:250px;flex:none}
}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand"><span class="mark"><i></i></span> MDP Enterprises — A.I. Operating System</div>
    <span class="pill" id="sysPill"><span class="dot"></span><span id="sysTxt">Booting</span></span>
    <div class="clock" id="clock"></div>
  </header>

  <!-- LEFT -->
  <aside class="rail">
    <div class="card">
      <div class="ct"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg> Live Metrics</div>
      <div class="mg" id="metrics"></div>
    </div>
    <div class="card">
      <div class="ct"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> CEO Thoughts</div>
      <div id="thoughts"></div>
      <button class="addbtn" id="addThought">+ Add new thought</button>
    </div>
    <div class="card">
      <div class="ct"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg> System Status</div>
      <div id="status"></div>
    </div>
  </aside>

  <!-- CENTER -->
  <main class="stage">
    <canvas id="net"></canvas>
    <div class="hint" id="hint">tap the core to talk to your CEO · tap a hub to open it</div>
  </main>

  <!-- RIGHT -->
  <aside class="rail">
    <div class="card">
      <div class="ct"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg> Activity Feed</div>
      <div id="feed"></div>
    </div>
    <div class="card">
      <div class="ct"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg> AI Agent Activity</div>
      <div id="agents"></div>
    </div>
    <div class="card">
      <div class="ct"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg> Quick Actions</div>
      <button class="qa" data-act="log">▸ Log a call</button>
      <button class="qa" data-act="leads">▸ Open call list</button>
      <button class="qa" data-act="csv">▸ Export CSV for dialer</button>
      <button class="qa" data-act="notion">▸ Open Notion Call Log</button>
    </div>
  </aside>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="sh"><div><h2 id="shName"></h2><p id="shSub"></p></div><button class="sx" id="shX">×</button></div>
  <div class="sb" id="shBody"></div>
</div>

<div class="chat" id="chat">
  <div class="sh"><div><h2>CEO</h2><p id="ceoSub">Claude Code, running in ~/agency</p></div><button class="sx" id="chX">×</button></div>
  <div id="log"></div>
  <div class="cin"><input id="cinp" placeholder='Ask, or: log Rapid Dry — no answer' autocomplete="off"><button id="csend">Send</button></div>
</div>

<script>
/* The bridge runs on the Mac. On the Mac that is localhost; on the phone it
   has to be the tunnel URL, which the page cannot guess. Pair a device once by
   opening ...?bridge=https://xyz.trycloudflare.com&key=SECRET — it is stored
   and the query string is stripped so the key never sits in history or in a
   shared link. The key is never in this file: this file is public on Pages. */
const CFG=(()=>{
  const q=new URLSearchParams(location.search);
  const b=q.get("bridge"),k=q.get("key");
  if(b)localStorage.setItem("mdp-bridge",b.replace(/\/$/,""));
  if(k)localStorage.setItem("mdp-key",k);
  if(b||k)history.replaceState(null,"",location.pathname);
  const host=location.hostname;
  const dflt=(host==="localhost"||host==="127.0.0.1"||host==="")?"http://localhost:8787":"";
  return{url:localStorage.getItem("mdp-bridge")||dflt,key:localStorage.getItem("mdp-key")||""};
})();
const BRIDGE=CFG.url;
const bfetch=(path,opt={})=>{
  if(!BRIDGE)return Promise.reject(new Error("no bridge configured"));
  const h={...(opt.headers||{})};if(CFG.key)h["X-Bridge-Key"]=CFG.key;
  return fetch(BRIDGE+path,{...opt,headers:h});
};
const STAGES=["new","contacted","replied","booked","call held","proposal","won","lost"];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dialn=p=>String(p||"").replace(/\D/g,"");
const $=id=>document.getElementById(id);

const DATA={leads:[],counts:{},metrics:{},status:null,feed:[]};
/* localStorage is now a cache, not the store. The bridge holds the truth; this
   copy is what the device shows while the bridge is unreachable, and what it
   replays once it is back. */
const NOTES=JSON.parse(localStorage.getItem("mdp-notes")||"{}");
const NOTE_AT=JSON.parse(localStorage.getItem("mdp-notes-at")||"{}");
let THOUGHTS=(()=>{
  const raw=JSON.parse(localStorage.getItem("mdp-thoughts")||"null");
  if(!raw)return null;
  // Migration: thoughts used to be bare strings with no id and no timestamp,
  // neither of which survives a merge between two devices.
  return raw.map(t=>typeof t==="string"?{id:uid(),text:t,at:"2000-01-01T00:00:00.000Z"}:t);
})();
let OUTBOX=JSON.parse(localStorage.getItem("mdp-outbox")||"[]");
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36);}
const iso=()=>new Date().toISOString();
const saveOutbox=()=>localStorage.setItem("mdp-outbox",JSON.stringify(OUTBOX));
function cacheState(){
  localStorage.setItem("mdp-notes",JSON.stringify(NOTES));
  localStorage.setItem("mdp-notes-at",JSON.stringify(NOTE_AT));
  if(THOUGHTS)localStorage.setItem("mdp-thoughts",JSON.stringify(THOUGHTS));
}
function saveNote(co,v){
  if(v.trim())NOTES[co]=v;else delete NOTES[co];
  NOTE_AT[co]=iso();cacheState();pushState();
}
function appendNote(co,t){
  const l=iso().slice(0,10)+" — "+t;
  NOTES[co]=NOTES[co]?NOTES[co]+"\n"+l:l;
  NOTE_AT[co]=iso();cacheState();pushState();
}

/* ---- cross-device sync ---- */
async function pullState(){
  try{
    const s=await (await bfetch("/state")).json();
    for(const [co,n] of Object.entries(s.notes||{})){
      // Server wins only when it is actually newer — otherwise a slow pull
      // would clobber something typed on this device a second ago.
      if(!NOTE_AT[co]||String(n.at||"")>NOTE_AT[co]){NOTES[co]=n.text;NOTE_AT[co]=n.at;}
    }
    if(s.thoughts&&s.thoughts.length)THOUGHTS=s.thoughts;
    cacheState();return true;
  }catch(e){return false;}
}
async function pushState(){
  const notes={};for(const co of Object.keys(NOTES))notes[co]={text:NOTES[co],at:NOTE_AT[co]||iso()};
  try{
    const r=await bfetch("/state",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({notes,thoughts:THOUGHTS||[]})});
    if(r.ok){const s=await r.json();if(s.thoughts)THOUGHTS=s.thoughts;cacheState();}
    return r.ok;
  }catch(e){return false;}
}

/* ============ data ============ */
async function hydrate(){
  try{
    const r=await fetch("pipeline.md",{cache:"no-store"});
    if(r.ok){
      const counts={};STAGES.forEach(s=>counts[s]=0);const list=[];let won=false;
      (await r.text()).split("\n").forEach(line=>{
        if(/^##\s*Won/i.test(line))won=true;
        if(won||!line.startsWith("| "))return;
        const c=line.split("|").map(x=>x.trim());
        if(c.length<4||!c[1]||c[1]==="Company")return;
        const st=(c[3]||"").toLowerCase();if(!STAGES.includes(st))return;
        counts[st]++;
        const m=(c[2]||"").match(/\(?\d{3}\)?[ .-]?\d{3}[ .-]?\d{4}/);
        // Niche is the trailing column; fall back to name-matching for rows
        // written before the column existed (the 5am job appends without it).
        const niche=(c[7]||"").trim()||(/med ?spa|aesthetic|botox|derm|skin|laser|salon|injectable/i.test(c[1]+c[2])?"MedSpa":"Restoration");
        list.push({co:c[1],c:c[2],p:m?m[0]:"",st,last:c[4]||"",next:c[5]||"",niche});
      });
      DATA.counts=counts;DATA.leads=list;
    }
  }catch(e){}
  try{
    const m=await fetch("metrics.md",{cache:"no-store"});
    if(m.ok){
      const rows=(await m.text()).split("\n").filter(l=>l.startsWith("|")&&!/Week of|:---/.test(l));
      const c=(rows[rows.length-1]||"").split("|").map(x=>x.trim());
      if(c.length>=9)DATA.metrics={week:c[1],out:c[2],rep:c[3],mtg:c[4],calls:c[5],closes:c[6],mrr:c[7],constraint:c[8]};
    }
  }catch(e){}
  try{DATA.status=await (await bfetch("/status")).json();}catch(e){DATA.status=null;}
  try{DATA.feed=(await (await bfetch("/activity")).json()).items||[];}catch(e){DATA.feed=[];}
  await pullState();
  flushOutbox();
  paint();
}

/* ============ panels ============ */
const n=v=>v==null||v===""?"—":v;
function paint(){
  const M=DATA.metrics,total=DATA.leads.length||0;
  const dialed=total-(DATA.counts.new||0);
  $("metrics").innerHTML=[
    ["Leads in pipeline",total,`${DATA.counts.new||0} not yet called`],

/* ============ graph ============ */
const cv=$("net"),cx=cv.getContext("2d");
const HUBS=[
  {id:"lead",  name:"LEADS",   subs:["Restoration","MedSpa","By stage"]},
  {id:"sales", name:"SCRIPTS", subs:["Openers","Objections","Voicemail"]},
  {id:"notes", name:"NOTES",   subs:["Call Log","Notion","CSV"]},
  {id:"mgr",   name:"MANAGER", subs:["5am job","Sourcing","Sync"]},
  {id:"scout", name:"SCOUT",   subs:["Opportunities","Criteria","Activity"]},
];
let W=0,H=0,DPR=1,t=0;
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);
  W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener("resize",resize);
const core=[];for(let i=0;i<300;i++){const y=1-(i/299)*2,rr=Math.sqrt(1-y*y),th=i*Math.PI*(3-Math.sqrt(5));
  core.push([Math.cos(th)*rr,y,Math.sin(th)*rr]);}
function hubPos(i){const a=-Math.PI/2+(i/HUBS.length)*Math.PI*2;const R=Math.min(W,H)*.315;
  return[W/2+Math.cos(a)*R,H/2+Math.sin(a)*R,a];}
/* Walk-in: clicking a hub zooms the graph into it and turns its sub-nodes into
   real targets, instead of jumping straight to a panel. `zoom` eases 0→1 so the
   transition reads as moving in rather than a hard cut. */
let FOCUS=null,zoomT=0;
const SUBACT={
  "Restoration":()=>{LEAD_NICHE="Restoration";openSheet("lead");},
  "MedSpa":()=>{LEAD_NICHE="MedSpa";openSheet("lead");},
  "By stage":()=>{LEAD_NICHE="";SORT.key="st";SORT.dir=1;openSheet("lead");},
  "Openers":()=>openSheet("sales"),"Objections":()=>openSheet("sales"),"Voicemail":()=>openSheet("sales"),
  "Call Log":()=>openSheet("notes"),"Notion":()=>act("notion"),"CSV":()=>exportCSV(),
  "5am job":()=>openSheet("mgr"),"Sourcing":()=>openSheet("mgr"),"Sync":()=>openSheet("mgr"),
  "Opportunities":()=>openSheet("scout"),"Criteria":()=>openSheet("scout"),"Activity":()=>openSheet("scout"),
};
function frame(){
  t+=.006;
  zoomT+=((FOCUS?1:0)-zoomT)*.14;          // ease toward focused / unfocused
  cx.clearRect(0,0,W,H);
  if(zoomT>.02)return frameFocus();
  const cxp=W/2,cyp=H/2,CR=Math.min(W,H)*.115;
  // rings
  for(let i=1;i<=3;i++){cx.beginPath();cx.arc(cxp,cyp,CR*(1+i*.42),0,7);
    cx.strokeStyle=`rgba(79,195,247,${.13-i*.03})`;cx.lineWidth=1;cx.stroke();}
  // links + hubs
  HUBS.forEach((h,i)=>{
    const[hx,hy,a]=hubPos(i);
    cx.beginPath();cx.moveTo(cxp,cyp);cx.lineTo(hx,hy);
    cx.strokeStyle="rgba(79,195,247,.20)";cx.lineWidth=1;cx.stroke();
    // travelling pulse
    const p=((t*.6+i*.25)%1);
    cx.beginPath();cx.arc(cxp+(hx-cxp)*p,cyp+(hy-cyp)*p,2.1,0,7);
    cx.fillStyle="rgba(150,225,255,.85)";cx.fill();
    // sub nodes
    h.subs.forEach((s,j)=>{
      const sa=a+(j-(h.subs.length-1)/2)*.42, SR=Math.min(W,H)*.135;
      const sx=hx+Math.cos(sa)*SR, sy=hy+Math.sin(sa)*SR;
      cx.beginPath();cx.moveTo(hx,hy);cx.lineTo(sx,sy);
      cx.strokeStyle="rgba(79,195,247,.13)";cx.stroke();
      cx.beginPath();cx.arc(sx,sy,3.4,0,7);cx.fillStyle="rgba(10,25,45,.95)";cx.fill();
      cx.strokeStyle="rgba(120,215,255,.55)";cx.lineWidth=1.2;cx.stroke();
      cx.fillStyle="rgba(150,185,210,.72)";cx.font="9.5px ui-sans-serif";
      cx.textAlign=Math.cos(sa)<0?"right":"left";
      cx.fillText(s,sx+(Math.cos(sa)<0?-8:8),sy+3);
    });
    // hub body
    const hr=Math.min(W,H)*.052;
    const g=cx.createRadialGradient(hx,hy,1,hx,hy,hr*1.7);
    g.addColorStop(0,"rgba(60,150,225,.42)");g.addColorStop(1,"rgba(20,60,110,0)");
    cx.beginPath();cx.arc(hx,hy,hr*1.7,0,7);cx.fillStyle=g;cx.fill();
    cx.beginPath();cx.arc(hx,hy,hr,0,7);cx.fillStyle="rgba(8,20,38,.92)";cx.fill();
    cx.strokeStyle="rgba(120,215,255,.75)";cx.lineWidth=1.5;cx.stroke();
    cx.beginPath();cx.arc(hx,hy,hr*1.22,0,7);cx.strokeStyle="rgba(79,195,247,.28)";cx.lineWidth=1;cx.stroke();
    h._x=hx;h._y=hy;h._r=hr*1.25;
    cx.fillStyle="#dcf1ff";cx.font="600 10.5px ui-sans-serif";cx.textAlign="center";
    cx.fillText(h.name,hx,hy+hr+15);
    if(h.id==="lead"){cx.fillStyle="rgba(127,230,255,.9)";cx.font="600 13px "+getComputedStyle(document.body).getPropertyValue("--mono");
      cx.fillText(String(DATA.leads.length||""),hx,hy+4);}
  });
  // core
  const gg=cx.createRadialGradient(cxp,cyp,2,cxp,cyp,CR*2.2);
  gg.addColorStop(0,"rgba(70,175,255,.5)");gg.addColorStop(1,"rgba(20,70,130,0)");
  cx.beginPath();cx.arc(cxp,cyp,CR*2.2,0,7);cx.fillStyle=gg;cx.fill();
  core.forEach(([x,y,z])=>{
    const ca=Math.cos(t),sa=Math.sin(t);
    const X=x*ca-z*sa,Z=x*sa+z*ca,d=(Z+1.6)/2.6;
    cx.beginPath();cx.arc(cxp+X*CR,cyp+y*CR,.9*d+.3,0,7);
    cx.fillStyle=`rgba(160,230,255,${.10+d*.5})`;cx.fill();
  });
  cx.beginPath();cx.arc(cxp,cyp,CR,0,7);cx.strokeStyle="rgba(140,225,255,.6)";cx.lineWidth=1.6;cx.stroke();
  cx.fillStyle="#eaf7ff";cx.font="600 19px ui-sans-serif";cx.textAlign="center";
  cx.fillText("CEO",cxp,cyp+CR+26);
  requestAnimationFrame(frame);
}
/* Focused view: the hub sits centre, its sub-nodes ring it as real targets. */
function frameFocus(){
  const h=FOCUS||{name:"",subs:[]},cxp=W/2,cyp=H/2;
  const k=Math.min(W,H),R=k*.055*(0.4+zoomT*.6);
  const gg=cx.createRadialGradient(cxp,cyp,2,cxp,cyp,R*4);
  gg.addColorStop(0,"rgba(70,175,255,.34)");gg.addColorStop(1,"rgba(20,70,130,0)");
  cx.beginPath();cx.arc(cxp,cyp,R*4,0,7);cx.fillStyle=gg;cx.fill();

  h._subxy=[];
  const SR=k*.26*zoomT;
  h.subs.forEach((s,j)=>{
    const a=-Math.PI/2+(j/h.subs.length)*Math.PI*2;
    const sx=cxp+Math.cos(a)*SR, sy=cyp+Math.sin(a)*SR, sr=k*.038*zoomT;
    cx.beginPath();cx.moveTo(cxp,cyp);cx.lineTo(sx,sy);
    cx.strokeStyle="rgba(79,195,247,.22)";cx.lineWidth=1;cx.stroke();
    const p=((t*.7+j*.3)%1);
    cx.beginPath();cx.arc(cxp+(sx-cxp)*p,cyp+(sy-cyp)*p,2,0,7);
    cx.fillStyle="rgba(150,225,255,.8)";cx.fill();
    cx.beginPath();cx.arc(sx,sy,sr,0,7);cx.fillStyle="rgba(8,20,38,.95)";cx.fill();
    cx.strokeStyle="rgba(130,220,255,.8)";cx.lineWidth=1.5;cx.stroke();
    cx.fillStyle="#dcf1ff";cx.font=`600 ${Math.max(9,k*.017)}px ui-sans-serif`;cx.textAlign="center";
    cx.fillText(s,sx,sy+sr+15);
    h._subxy.push({s,x:sx,y:sy,r:sr*1.35});
  });
  cx.beginPath();cx.arc(cxp,cyp,R,0,7);cx.fillStyle="rgba(8,20,38,.95)";cx.fill();
  cx.strokeStyle="rgba(140,225,255,.85)";cx.lineWidth=2;cx.stroke();
  cx.fillStyle="#eaf7ff";cx.font=`600 ${Math.max(11,k*.022)}px ui-sans-serif`;cx.textAlign="center";
  cx.fillText(h.name,cxp,cyp+R+24);
  cx.fillStyle="rgba(150,185,210,.6)";cx.font="10.5px ui-sans-serif";
  cx.fillText("tap the centre for the full panel · tap outside to go back",cxp,H-16);
  requestAnimationFrame(frame);
}

cv.addEventListener("click",e=>{
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const k=Math.min(W,H);
  if(FOCUS){
    for(const s of (FOCUS._subxy||[]))
      if(Math.hypot(x-s.x,y-s.y)<s.r){const fn=SUBACT[s.s];FOCUS=null;return fn?fn():null;}
    if(Math.hypot(x-W/2,y-H/2)<k*.075){const id=FOCUS.id;FOCUS=null;return openSheet(id);}
    FOCUS=null;return;                       // click outside walks back out
  }
  const CR=k*.115;
  if(Math.hypot(x-W/2,y-H/2)<CR*1.3)return openChat();
  for(const h of HUBS)if(Math.hypot(x-h._x,y-h._y)<h._r){FOCUS=h;return;}
});

  ["“How much is it?”","“$500 a month, and I'm waiving setup for the first three shops — but hear it first, then price is easy.”"]];
  return `<div class="sec"><div class="slb">The opener</div><div class="say">“Not a pitch, quick: when a water call hits at 2am and drops to voicemail, that job's gone. I built a line that answers those. Call it — 90 seconds.”</div></div>
  <div class="sec"><div class="slb">Demo line</div><div class="say"><a class="tel" href="tel:+13148879824" style="font-size:15px">(314) 887-9824</a> — the demo is the sale.</div></div>
  <div class="sec"><div class="slb">When they push back</div>${P.map(([a,b])=>`<div style="margin-bottom:10px"><div class="say" style="color:var(--acc2)">${esc(a)}</div><div class="say">${esc(b)}</div></div>`).join("")}</div>`;
}
function notesPanel(){
  const ks=Object.keys(NOTES).filter(k=>NOTES[k]);
  return `<div class="sec"><div class="slb">Local capture <span>${ks.length} companies</span></div>
    ${ks.length?ks.map(k=>`<div style="margin-bottom:9px"><div class="say" style="color:var(--acc2)">${esc(k)}</div><div class="say" style="white-space:pre-wrap">${esc(NOTES[k])}</div></div>`).join(""):'<div class="say" style="color:var(--dim)">Nothing captured on this device yet.</div>'}</div>
  <div class="sec"><div class="slb">Queue</div><div class="say">${OUTBOX.length?OUTBOX.length+" note(s) waiting for the bridge.":"Nothing queued — everything synced."}</div></div>
  <div class="sec"><button class="qa" data-act="csv">▸ Export leads + notes CSV</button></div>`;
}
function managerPanel(){
  const S=DATA.status,m=S&&S.manager;
  return `<div class="sec"><div class="slb">The 5:00 run</div><div class="say">
    1. <b>lead-research</b> sources the day's new prospects into pipeline.md.<br>
    2. <b>notes</b> pushes everything changed since the last run into the Notion Call Log.<br>
    3. Prints the dial list, hottest first.</div></div>
  <div class="sec"><div class="slb">Status</div><div class="say">
    Job: <b>com.mdp.agency.manager</b> (launchd)<br>
    Last run: ${m?esc(new Date(m.lastRun).toLocaleString()):"never"}<br>
    Log: logs/manager.log${m?` · ${m.size} bytes`:""}</div></div>
  <div class="sec"><div class="slb">Caveat</div><div class="say" style="color:var(--dim)">launchd cannot run on a sleeping Mac. If it's asleep at 5:00 the job runs on next wake.</div></div>`;
}
function openSheet(id){
  const[nm,sub,fn]=SHEET[id];
  $("shName").textContent=nm;$("shSub").textContent=sub;$("shBody").innerHTML=fn();
  $("scrim").classList.add("on");$("sheet").classList.add("on");wireSheet();
  if(id==="scout"&&!DATA.scout.items)
    loadScout().then(()=>{$("shBody").innerHTML=scoutPanel();wireSheet();});
}
function wireSheet(){
  const b=$("shBody");
  b.querySelectorAll(".ntbtn").forEach(x=>x.onclick=()=>{
    const ta=b.querySelector(`textarea[data-co="${x.dataset.co}"]`);
    if(ta){ta.classList.toggle("hide");if(!ta.classList.contains("hide"))ta.focus();}});
  b.querySelectorAll("textarea[data-co]").forEach(ta=>ta.oninput=()=>{
    saveNote(ta.dataset.co,ta.value);
    const x=b.querySelector(`.ntbtn[data-co="${ta.dataset.co}"]`);if(x)x.classList.toggle("has",!!ta.value.trim());});
  b.querySelectorAll("[data-niche]").forEach(x=>x.onclick=()=>{
    LEAD_NICHE=x.dataset.niche;b.innerHTML=leadTable();wireSheet();});
  b.querySelectorAll("th[data-sort]").forEach(h=>h.onclick=()=>{
    const k=h.dataset.sort;if(SORT.key===k)SORT.dir*=-1;else{SORT.key=k;SORT.dir=1;}
    b.innerHTML=leadTable();wireSheet();});
  b.querySelectorAll("[data-act]").forEach(x=>x.onclick=()=>act(x.dataset.act));
  // scout: filters, criteria, manual email analysis
  b.querySelectorAll("[data-f]").forEach(el=>{
    const ev=el.tagName==="SELECT"?"onchange":"oninput";
    el[ev]=()=>{SCOUTF[el.dataset.f]=el.value;b.innerHTML=scoutPanel();wireSheet();};});
  const save=b.querySelector("#cfgSave");
  if(save)save.onclick=async()=>{
    const p={};
    b.querySelectorAll("[data-cfg]").forEach(el=>{
      const k=el.dataset.cfg,v=el.value.trim();
      if(k==="platforms")p[k]=[v];
      else if(["brands","categories","sizes"].includes(k))p[k]=v?v.split(",").map(s=>s.trim()).filter(Boolean):[];
      else if(["maxPrice","minProfit","minRoi"].includes(k))p[k]=v===""?null:+v;
      else p[k]=v;});
    save.textContent="Saving…";
    try{DATA.scout.cfg=await (await bfetch("/scout/config",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(p)})).json();
      save.textContent="▸ Saved";}
    catch(e){save.textContent="▸ Save failed — bridge offline";}
    setTimeout(()=>{save.textContent="▸ Save criteria";},1800);};
  const run=b.querySelector("#scoutRun");
  if(run)run.onclick=async()=>{
    const ta=b.querySelector("#scoutPaste"),out=b.querySelector("#scoutOut");
    if(!ta.value.trim()){out.textContent="Paste an email first.";return;}
    run.textContent="Analysing…";out.textContent="";
    try{
      const r=await (await bfetch("/scout/analyze",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({html:ta.value,from:"no-reply@depop.com"})})).json();
      if(r.rejected){out.textContent="Rejected: "+r.rejected;}
      else{out.textContent=`parsed ${r.parsed} · new ${r.created} · duplicates ${r.duplicates} · BUY ${r.buys}`;
        await loadScout();b.innerHTML=scoutPanel();wireSheet();}
    }catch(e){out.textContent="Bridge offline — start it with: node notes-bridge.js";}
    run.textContent="▸ Analyse email";};
}
function closeAll(){["scrim","sheet","chat"].forEach(i=>$(i).classList.remove("on"));}
$("scrim").onclick=closeAll;$("shX").onclick=closeAll;$("chX").onclick=closeAll;
addEventListener("keydown",e=>{if(e.key==="Escape")closeAll();});

/* ============ actions ============ */
function exportCSV(){
  const rows=[["Company","Contact / Owner","Phone","Stage","Note"]];
  DATA.leads.forEach(l=>rows.push([l.co,(l.c||"").replace(/·/g,"-"),l.p||"",l.st||"new",NOTES[l.co]||""]));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const u=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=u;a.download="mdp-leads.csv";a.click();URL.revokeObjectURL(u);
}
function act(a){
  if(a==="csv")return exportCSV();
  if(a==="leads")return openSheet("lead");
  if(a==="notion")return window.open("https://www.notion.so/"+((DATA.status&&DATA.status.db)||"").replace(/-/g,""),"_blank");
  if(a==="log"){openChat();$("cinp").value="log ";$("cinp").focus();}
}
document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act));
$("addThought").onclick=async()=>{
  const t=prompt("New CEO thought:");if(!t)return;
  THOUGHTS=[{id:uid(),text:t,at:iso()},...(THOUGHTS||[])].slice(0,8);
  cacheState();paint();
  await pushState();paint();
};

/* ============ chat ============ */
const logEl=$("log"),cinp=$("cinp");let seeded=false;
let CEO_SESSION=localStorage.getItem("mdp-ceo-session")||null;
function openChat(){$("chat").classList.add("on");
  if(!seeded){add("ai","<b>CEO:</b> Ask me anything about the business — I read your files. Or log a call: <code>log Rapid Dry — no answer</code>");seeded=true;}
  setTimeout(()=>cinp.focus(),150);}
function add(cls,html){const d=document.createElement("div");d.className="msg "+cls;d.innerHTML=html;
  logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;return d;}
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>").replace(/\n/g,"<br>");
const normCo=s=>String(s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function matchCo(q){const k=normCo(q);if(!k)return null;const L=DATA.leads;
  return L.find(l=>normCo(l.co)===k)||L.find(l=>normCo(l.co).startsWith(k))||L.find(l=>normCo(l.co).includes(k))||null;}
async function flushOutbox(){let sent=0;
  while(OUTBOX.length){
    try{const r=await bfetch("/note",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(OUTBOX[0])});
      if(!r.ok)break;const j=await r.json();
      if(j.results&&j.results[0]&&j.results[0].action==="error")break;
      OUTBOX.shift();sent++;}catch(e){break;}}
  saveOutbox();return{sent,left:OUTBOX.length};}
async function logCall(rest){
  const parts=rest.split(/\s+[—–-]{1,2}\s+|\s*:\s+/);
  const who=parts.shift().trim(),what=parts.join(" — ").trim();
  const lead=matchCo(who);
  if(!lead)return add("ai",`<b>Notes:</b> Nothing matches “${esc(who)}”. Use the name as it reads in Leads.`);
  if(!what)return add("ai",`<b>Notes:</b> Matched <b>${esc(lead.co)}</b> — what happened?`);
  appendNote(lead.co,what);
  OUTBOX.push({company:lead.co,note:what,contact:lead.c||"",phone:lead.p||""});saveOutbox();
  add("ai",`<b>Notes:</b> Logged <b>${esc(lead.co)}</b> — “${esc(what)}”.`);
  const r=await flushOutbox();
  add("ai",r.sent?`<b>Notes:</b> Sent to Notion${r.left?` · ${r.left} queued`:""}.`
    :`<b>Notes:</b> Bridge offline — ${r.left} queued.`);
  hydrate();
}
async function askCEO(q){
  const el=add("ai","<b>CEO:</b> <i>thinking…</i>");
  try{
    const r=await bfetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:q,session:CEO_SESSION})});
    const j=await r.json();if(j.error)throw new Error(j.error);
    if(j.session){CEO_SESSION=j.session;localStorage.setItem("mdp-ceo-session",CEO_SESSION);}
    el.innerHTML="<b>CEO:</b> "+fmt(j.text||"(no reply)");
  }catch(e){el.innerHTML="<b>CEO:</b> bridge offline — start it with <code>node notes-bridge.js</code>";}
  logEl.scrollTop=logEl.scrollHeight;
}
function send(q){if(!q.trim())return;add("me",esc(q));cinp.value="";
  const m=q.match(/^\s*(?:log|note)\s+(.+)$/i);
  if(m)return void setTimeout(()=>logCall(m[1]),150);
  askCEO(q);}
$("csend").onclick=()=>send(cinp.value);
cinp.onkeydown=e=>{if(e.key==="Enter")send(cinp.value);};

/* ============ boot ============ */
setInterval(()=>{const d=new Date();
  $("clock").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"}).toUpperCase()
    +"   "+d.toLocaleTimeString();},1000);
setTimeout(()=>{const h=$("hint");if(h)h.style.opacity="0";},8000);
resize();requestAnimationFrame(frame);hydrate();flushOutbox();
setInterval(hydrate,15000);
</script>
